name: UI Vault 校验与发布
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# 同一个分支上只保留最新一次构建/部署，避免过期版本覆盖。
concurrency:
  group: ui-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: 元数据校验、测试与静态构建
    # 固定 Chromium 截图所需的 Linux 字体/图形环境，避免 ubuntu-latest 升级导致像素基线漂移。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 React 构建依赖
        run: npm ci --no-audit --no-fund
      - name: 安装字体构建依赖
        run: python -m pip install -r scripts/requirements-fonts.txt
      - uses: actions/cache@v4
        with:
          path: .cache/fonts/975yuan
          key: lxgw-975yuan-37b753f408b25d3ab3d25cbddb5dd9dacca0289a
      - name: 校验资产协议
        run: node scripts/validate.mjs
      - name: 单元测试
        run: node --test tests/*.test.mjs
      - name: 设计规范与文字对比度检查
        run: node scripts/design-audit.mjs
      - name: JavaScript 语法检查
        run: |
          find assets scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: 白名单静态构建
        run: npm run build
      - name: 发布目录检查
        run: node scripts/check-dist.mjs
      - name: 安装 Chromium 视觉回归环境
        run: |
          python -m pip install -r scripts/requirements-visual.txt
          python -m playwright install chromium --with-deps
      - name: Chromium 视觉回归（只读仓库基线）
        run: python scripts/visual-regression.py
      - name: 上传视觉回归截图（成功或失败均保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-vault-visual-${{ github.run_id }}
          path: visual-output/
          if-no-files-found: ignore
          retention-days: 10
      - name: 上传已验证的站点产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ui-vault-static
          path: dist
  deploy:
    name: GitHub Pages 发布
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-vault-static
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 等待 Pages 构建产物元数据就绪
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
