name: UI Vault 校验与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick：快速检查与构建；full：正式发布完整验收'
        type: choice
        options: [full, quick]
        default: full
      regenerate-baselines:
        description: '在 CI 基线环境重新生成 Chromium 视觉基线（产物形式上传，需人工审核后提交 tests/visual-baselines.json）'
        type: boolean
        default: false
  # 定期从公开 GitHub API 刷新来源 Project 状态，不需要提交生成文件。
  schedule:
    - cron: '31 5 * * 2'
permissions:
  contents: read
# 同一个分支上只保留最新一次构建/部署，避免过期版本覆盖。
concurrency:
  group: ui-vault-${{ github.workflow }}-${{ github.ref }}-${{ inputs.regenerate-baselines == true && 'baseline' || 'normal' }}
  cancel-in-progress: true
jobs:
  plan:
    name: 识别验证级别
    runs-on: ubuntu-24.04
    outputs:
      fast: ${{ steps.plan.outputs.fast }}
      build: ${{ steps.plan.outputs.build }}
      visual: ${{ steps.plan.outputs.visual }}
      windows: ${{ steps.plan.outputs.windows }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_MODE: ${{ inputs.mode }}
          CI_REGENERATE: ${{ inputs.regenerate-baselines }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-plan.mjs
  validate:
    name: 元数据校验、测试与静态构建
    needs: plan
    # 固定 Chromium 截图所需的 Linux 字体/图形环境，避免 ubuntu-latest 升级导致像素基线漂移。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.build == 'true'
        with:
          python-version: '3.12'
      - name: 安装 React 构建依赖
        run: npm ci --no-audit --no-fund
      - name: 安装字体构建依赖
        if: needs.plan.outputs.build == 'true'
        run: python -m pip install -r scripts/requirements-fonts.txt
      - uses: actions/cache@v4
        if: needs.plan.outputs.build == 'true'
        with:
          path: .cache/fonts/975yuan
          key: lxgw-975yuan-37b753f408b25d3ab3d25cbddb5dd9dacca0289a
      - name: 校验资产协议
        run: node scripts/validate.mjs
      - name: 单元测试
        if: needs.plan.outputs.fast == 'true'
        run: node --test --import ./tests/helpers/jsx-register.mjs tests/*.test.mjs
      - name: ESLint 与 React Hooks 检查
        if: needs.plan.outputs.fast == 'true'
        run: npm run lint
      - name: 设计规范与文字对比度检查
        if: needs.plan.outputs.fast == 'true'
        run: node scripts/design-audit.mjs
      - name: JavaScript 语法检查
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.visual == 'true' || needs.plan.outputs.windows == 'true'
        run: |
          find assets scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: 白名单静态构建
        if: needs.plan.outputs.build == 'true'
        run: npm run build
      - name: 发布目录检查
        if: needs.plan.outputs.build == 'true'
        run: node scripts/check-dist.mjs
      - name: 安装 Chromium 视觉回归环境
        if: needs.plan.outputs.visual == 'true'
        run: |
          python -m pip install -r scripts/requirements-visual.txt
          python -m playwright install chromium --with-deps
      - name: Chromium 视觉回归（只读仓库基线，或按需重新生成）
        if: needs.plan.outputs.visual == 'true'
        run: |
          if [ "${{ inputs.regenerate-baselines }}" = "true" ]; then
            python scripts/visual-regression.py --capture-current
          else
            python scripts/visual-regression.py
          fi
      - name: 上传重生成的视觉基线（供人工审核后提交）
        if: inputs.regenerate-baselines == true
        uses: actions/upload-artifact@v4
        with:
          name: ui-vault-visual-baselines-${{ github.run_id }}
          # 必须上传脚本写出的采集结果；仓库里的 tests/visual-baselines.json 在 CI 中不会被改写，
          # 上传它只会把旧基线当成新基线交给人工审核。
          path: visual-output/visual-baselines.json
          if-no-files-found: error
      - name: 上传视觉回归截图（成功或失败均保留）
        if: always() && needs.plan.outputs.visual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-vault-visual-${{ github.run_id }}
          path: visual-output/
          if-no-files-found: ignore
          retention-days: 10
      # 此步的网络故障不应阻断 UI-Vault 发布；构建产物已有离线“未核实”占位。
      - name: 刷新已公开来源项目的 GitHub 状态
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.regenerate-baselines != true
        continue-on-error: true
        env:
          GH_PROJECT_HEALTH_TOKEN: ${{ github.token }}
        run: node scripts/project-health.mjs --live
      - name: 采集预览站点 HTTP 与 iframe 限制证据
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.regenerate-baselines != true
        continue-on-error: true
        run: node scripts/preview-health.mjs --live
      - name: 上传已验证的站点产物
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.regenerate-baselines != true
        uses: actions/upload-artifact@v4
        with:
          name: ui-vault-static
          path: dist
  validate-windows:
    name: Windows 本地开发环境校验
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    # 保护本地可复现性：Windows 检出曾因 CRLF 换行符导致 validate 误报与大量测试
    # 断言失败（见 .gitattributes 与 docs/ROADMAP.md）。此任务不运行依赖
    # Python 字体子集化与 Chromium 截图的步骤，只覆盖与 Linux 一致的部分。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装 React 构建依赖
        run: npm ci --no-audit --no-fund
      - name: 校验资产协议
        run: node scripts/validate.mjs
      - name: 单元测试
        run: node --test --import ./tests/helpers/jsx-register.mjs tests/*.test.mjs
      - name: ESLint 与 React Hooks 检查
        run: npm run lint
      - name: 设计规范与文字对比度检查
        run: node scripts/design-audit.mjs
      - name: JavaScript 语法检查
        run: |
          find assets scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
  deploy:
    name: GitHub Pages 发布
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.regenerate-baselines != true && needs.validate.result == 'success' && (needs.validate-windows.result == 'success' || needs.validate-windows.result == 'skipped')
    needs: [validate, validate-windows]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-vault-static
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 等待 Pages 构建产物元数据就绪
        run: sleep 8
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
