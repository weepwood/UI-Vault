<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f5">
  <meta name="description" content="UI Vault：左侧浏览项目，右侧实时预览设计与交互实验。">
  <title>UI Vault — 设计资料库</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer type="module" src="./assets/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">跳转到预览工作区</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="项目目录">
    <div class="sidebar-heading">
      <a class="brand" href="./" aria-label="UI Vault 首页"><span class="brand-mark"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#layout-grid"></use></svg></span><span class="brand-type"><strong>UI Vault</strong><small>设计资料库</small></span></a>
      <button class="sidebar-dismiss" id="sidebar-dismiss" type="button" aria-label="关闭项目目录"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#x"></use></svg></button>
    </div>
    <div class="library-search">
      <label class="search-field"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#search"></use></svg><input id="search" type="search" autocomplete="off" placeholder="搜索项目、标签、技术栈" aria-label="搜索项目" aria-keyshortcuts="Control+K Meta+K"><kbd>⌘ K</kbd></label>
    </div>
    <nav class="quick-filters" aria-label="快速筛选">
      <button type="button" class="filter-button is-active" data-category="all" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#layout-grid"></use></svg><span>全部资源</span><span class="filter-count" id="total-count">—</span></button>
      <button type="button" class="filter-button" data-curated="toggle" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#sliders-horizontal"></use></svg><span>手工精调</span><span class="filter-count" id="curated-count">—</span></button>
      <button type="button" class="filter-button" data-favorites="toggle" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#heart"></use></svg><span>我的收藏</span><span class="filter-count" id="favorite-count">0</span></button>
      <button type="button" class="filter-button" data-imported="toggle" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#git-branch"></use></svg><span>跨仓资源</span><span class="filter-count" id="imported-count">—</span></button>
    </nav>
    <div class="category-section"><div class="section-row"><span>项目分类</span><button type="button" class="text-reset" id="reset-filters" hidden>重置筛选</button></div><nav id="category-nav" class="category-nav" aria-label="项目分类"></nav></div>
    <div class="list-controls">
      <div class="section-row"><span>项目目录 <span class="result-count" id="results-count">—</span></span><select id="sort" aria-label="项目排序"><option value="featured">精选优先</option><option value="newest">最新添加</option><option value="az">名称排序</option></select></div>
      <label class="tag-select-label">标签 <select id="tag-filter" aria-label="按标签筛选"><option value="">全部标签</option></select></label>
    </div>
    <p id="results-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="project-scroll">
      <div id="gallery" class="project-list" role="list" aria-label="可浏览项目"></div>
      <div id="empty" class="empty-list" hidden><p id="empty-message">没有找到匹配的项目。</p><button type="button" id="clear-filters">显示全部项目</button></div>
    </div>
    <div class="sidebar-footer">
      <a href="https://github.com/weepwood/UI-Vault/blob/main/docs/ADDING-DEMO.md" target="_blank" rel="noopener noreferrer"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#plus"></use></svg><span>新增项目</span></a>
      <a href="https://github.com/weepwood/UI-Vault" target="_blank" rel="noopener noreferrer"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#code-xml"></use></svg><span>GitHub</span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#external-link"></use></svg></a>
    </div>
  </aside>
  <div class="mobile-shade" id="mobile-shade" hidden></div>
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left"><button id="menu-toggle" class="menu-toggle" type="button" aria-label="打开项目目录" aria-expanded="false" aria-controls="sidebar"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#menu"></use></svg></button><span class="topbar-path">UI Vault <span class="path-divider">/</span> <span id="location-label">预览工作区</span></span></div>
      <div class="topbar-right"><span class="workspace-status"><span class="live-dot"></span> 实时工作台</span><a class="top-repo" href="https://github.com/weepwood/UI-Vault" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 UI Vault"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#git-branch"></use></svg></a></div>
    </header>
    <section class="selection-head" aria-label="当前项目">
      <div class="selection-text"><span class="selection-eyebrow" id="preview-kind">选择项目</span><h1 id="preview-title">正在加载项目…</h1><p id="preview-subtitle">在左侧选择一个项目，右侧直接查看实际效果。</p></div>
      <div class="selection-actions">
        <button type="button" id="preview-favorite" class="square-action" aria-label="收藏当前项目" aria-pressed="false" disabled><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#heart"></use></svg></button>
        <button type="button" id="preview-copy-link" class="square-action" aria-label="复制当前项目链接" disabled><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#copy"></use></svg></button>
        <a id="preview-open" class="open-action" href="https://github.com/weepwood/UI-Vault" target="_blank" rel="noopener noreferrer" aria-label="在新标签打开项目"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#external-link"></use></svg><span>单独打开</span></a>
      </div>
    </section>
    <div class="preview-toolbar">
      <span class="preview-toolbar-label"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#monitor"></use></svg><span id="preview-label">网页效果</span></span>
      <div id="viewport-controls" class="viewport-controls" role="group" aria-label="模拟预览设备">
        <button type="button" data-preview-size="fluid" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#maximize-2"></use></svg><span>自适应</span></button>
        <button type="button" data-preview-size="mobile" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#smartphone"></use></svg><span>手机</span></button>
        <button type="button" data-preview-size="tablet" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#tablet"></use></svg><span>平板</span></button>
        <button type="button" data-preview-size="desktop" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#monitor"></use></svg><span>桌面</span></button>
      </div>
    </div>
    <section id="preview-stage" class="preview-stage" aria-label="所选项目的网页效果"><div class="preview-placeholder"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#layout-grid"></use></svg><p>请选择一个项目开始预览</p></div></section>
    <details id="project-notes" class="project-notes">
      <summary><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#book-open"></use></svg><span>项目说明与源码</span><span id="notes-caption" class="notes-caption"></span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#chevron-down"></use></svg></summary>
      <div id="project-info" class="project-info"></div>
    </details>
    <footer class="workbench-footer"><span id="preview-status" role="status" aria-live="polite">就绪</span><span id="workbench-count">UI Vault</span></footer>
  </main>
</div>
<div class="toast" role="status" aria-live="polite" id="toast"></div>
</body>
</html>
