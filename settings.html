<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f5">
  <meta name="description" content="UI Vault 设置：外观、界面、字体与预览偏好">
  <title>设置 — UI Vault</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./assets/styles.css">
  <script defer type="module" src="./assets/settings-page.js"></script>
</head>
<body class="settings-body">
<a class="skip-link" href="#settings-main">跳转到设置内容</a>
<div class="settings-page" data-settings-page>
  <aside class="settings-rail" aria-label="设置导航">
    <a class="settings-brand" href="./"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#layout-grid"></use></svg><span>UI Vault</span></a>
    <a class="settings-back" href="./"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#external-link"></use></svg><span>返回工作台</span></a>
    <div class="settings-nav-heading">设置</div>
    <nav class="settings-nav" aria-label="设置分类">
      <a href="#appearance"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#palette"></use></svg><span>外观</span></a>
      <a href="#interface"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#panels-top-left"></use></svg><span>界面</span></a>
      <a href="#typography"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#file-text"></use></svg><span>字体</span></a>
      <a href="#preview"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#monitor"></use></svg><span>浏览体验</span></a>
      <a href="#about"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#github"></use></svg><span>关于</span></a>
    </nav>
  </aside>
  <main id="settings-main" class="settings-main">
    <header class="settings-header">
      <div>
        <p class="settings-eyebrow">UI VAULT / PREFERENCES</p>
        <h1 id="settings-title">设置</h1>
        <p class="settings-intro">自定义工作台的外观和浏览方式，修改后立即保存。</p>
      </div>
    </header>
    <div class="settings-scroll">
      <section id="appearance" class="settings-section" aria-labelledby="appearance-title"><div class="settings-section-heading"><h2 id="appearance-title">外观</h2><p>工作台主题与界面强调色，不影响独立 Demo 的视觉效果。</p></div><div class="settings-grid"><label class="setting-field"><span class="setting-label">主题</span><select data-setting="theme" aria-label="主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label class="setting-field"><span class="setting-label">强调色</span><select data-setting="accent" aria-label="强调色"><option value="blue">经典蓝</option><option value="teal">青绿</option><option value="violet">紫罗兰</option></select></label></div></section>
      <section id="interface" class="settings-section" aria-labelledby="interface-title"><div class="settings-section-heading"><h2 id="interface-title">界面</h2><p>调整项目列表的信息密度和导航栏所占空间。</p></div><div class="settings-grid"><label class="setting-field"><span class="setting-label">列表密度</span><select data-setting="density" aria-label="列表密度"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></label><label class="setting-field"><span class="setting-label">侧栏宽度</span><select data-setting="sidebar" aria-label="侧栏宽度"><option value="standard">标准</option><option value="narrow">窄侧栏</option></select></label></div></section>
      <section id="typography" class="settings-section" aria-labelledby="typography-title"><div class="settings-section-heading"><h2 id="typography-title">字体</h2><p>字体设置仅作用于 UI-Vault 工作台，不覆盖外部网站。</p></div><div class="settings-grid"><label class="setting-field"><span class="setting-label">字体家族</span><select data-setting="font" aria-label="字体家族"><option value="yuan">霞鹜 975 圆体</option><option value="system">系统无衬线</option><option value="serif">系统衬线</option></select></label><label class="setting-field"><span class="setting-label">基础字号</span><select data-setting="fontSize" aria-label="基础字号"><option value="12">小 · 12px</option><option value="13">默认 · 13px</option><option value="14">中 · 14px</option><option value="15">大 · 15px</option></select></label></div></section>
      <section id="preview" class="settings-section" aria-labelledby="preview-title"><div class="settings-section-heading"><h2 id="preview-title">浏览体验</h2><p>设置打开本站 Demo 时的默认预览方式。</p></div><div class="settings-grid"><label class="setting-field"><span class="setting-label">默认预览尺寸</span><select data-setting="preview" aria-label="默认预览尺寸"><option value="fluid">自适应</option><option value="mobile">手机</option><option value="tablet">平板</option><option value="desktop">桌面</option></select><small>只对本站 Demo 设备预览生效</small></label><label class="setting-field"><span class="setting-label">界面动效</span><select data-setting="motion" aria-label="界面动效"><option value="system">跟随系统</option><option value="reduced">减少动态效果</option></select></label></div></section>
      <section id="about" class="settings-section" aria-labelledby="about-title">
        <div class="settings-section-heading"><h2 id="about-title">关于</h2><p>项目仓库与开源代码。</p></div>
        <div class="settings-grid settings-grid--full">
          <a class="settings-repo-link" href="https://github.com/weepwood/UI-Vault" target="_blank" rel="noopener noreferrer" aria-label="打开 UI Vault GitHub 仓库">
            <span class="settings-repo-icon"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#github"></use></svg></span>
            <span class="settings-repo-text"><strong>GitHub</strong><small>weepwood/UI-Vault</small></span>
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="./assets/icons/lucide.svg#external-link"></use></svg>
          </a>
        </div>
      </section>
    </div>
    <footer class="settings-footer">
      <p>设置保存在当前浏览器，返回工作台后自动生效。</p>
      <button type="button" id="settings-reset" class="settings-reset">恢复默认设置</button>
    </footer>
  </main>
</div>
<div class="sr-only" role="status" aria-live="polite" id="settings-status"></div>
</body>
</html>
