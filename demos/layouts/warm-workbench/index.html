<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暖色工作台 · UI Vault</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#37312b;background:#f4f0eb}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #cf7748;outline-offset:3px}
.shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100vh}.side{padding:28px 17px;background:#f9f6f2;border-right:1px solid #e7dfd6}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.05em;font-size:19px}.brand-mark{display:grid;place-items:center;background:#df966c;color:#fff;width:32px;height:32px;border-radius:10px}
.eyebrow{color:#9b9187;letter-spacing:.1em;font-size:10px;text-transform:uppercase;font-weight:700;margin:31px 12px 12px}.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;color:#776f66;border-radius:9px;font-size:13px;text-decoration:none}.nav.active{color:#ad6a45;background:#f4e6dc;font-weight:700}.dot{width:8px;height:8px;background:#b7aca2;border-radius:50%}.nav.active .dot{background:#df966c}.profile{margin-top:60px;padding:12px;background:#f1eae2;border-radius:12px;font-size:12px}.profile strong{display:block;margin-bottom:6px}
.main{padding:28px clamp(20px,4vw,60px);max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;color:#988e83;font-size:12px;gap:10px}.pill{padding:9px 13px;background:#fff9f3;border:1px solid #eadfd4;border-radius:100px;color:#946b51}h1{font-size:clamp(26px,3vw,38px);letter-spacing:-.06em;margin:35px 0 7px;font-weight:750}.lead{margin:0 0 28px;color:#8e857b;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stat{padding:21px;background:#fdfbf8;border:1px solid #ebe4da;border-radius:14px;min-height:138px}.stat small{font-size:12px;color:#958a80}.stat strong{display:block;margin:16px 0 8px;font-size:29px;letter-spacing:-.06em}.trend{color:#67947f;font-size:11px}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-top:16px}.panel{background:#fdfbf8;border:1px solid #ebe4da;border-radius:14px;padding:23px}.panel h2{font-size:15px;letter-spacing:-.03em;margin:0 0 18px}.progress{height:9px;background:#eee8e0;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#db976e;border-radius:20px}.task{display:flex;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #eee8e1;font-size:12px}.task:last-child{border-bottom:none}.check{width:17px;height:17px;border:1px solid #d7b59d;border-radius:6px;background:#f8e5d6}.task small{margin-left:auto;color:#9a9186}.bars{display:flex;align-items:flex-end;height:110px;gap:10px;margin-top:18px}.bars i{background:#ebc9b1;border-radius:4px 4px 0 0;display:block;flex:1}.bars i:nth-child(3n){background:#d68c63}.muted{font-size:12px;color:#a0978d} 
@media(max-width:720px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.stat:last-child{grid-column:span 2}}@media(max-width:350px){.stats{grid-template-columns:1fr}.stat:last-child{grid-column:span 1}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><span class="brand-mark">W</span> warmday</div><div class="eyebrow">工作空间</div><a href="#" class="nav active"><span class="dot"></span>概览</a><a href="#" class="nav"><span class="dot"></span>项目</a><a href="#" class="nav"><span class="dot"></span>日历</a><a href="#" class="nav"><span class="dot"></span>报告</a><div class="eyebrow">我的分组</div><a href="#" class="nav"><span class="dot"></span>设计工作台</a><a href="#" class="nav"><span class="dot"></span>开发任务</a><div class="profile"><strong>设计记录</strong>近期创建 4 个 UI 实验。</div></aside>
<main class="main"><div class="top"><span>Workspace / 概览</span><span class="pill">本地演示数据</span></div><h1>项目概览</h1><p class="lead">查看正在进行的设计任务与最近一周进度。</p>
<section class="stats"><div class="stat"><small>进行中的项目</small><strong>08</strong><span class="trend">本周新增 2 个</span></div><div class="stat"><small>已完成任务</small><strong>24</strong><span class="trend">较上周多 12%</span></div><div class="stat"><small>本周投入</small><strong>16.5h</strong><span class="muted">过去七天</span></div></section>
