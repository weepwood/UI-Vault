function validParameter(field,value){
  if(field.type==='color')return typeof value==='string'&&/^#[0-9a-f]{6}$/i.test(value);
  if(field.type==='number')return Number.isInteger(value)&&value>=field.min&&value<=field.max&&(!field.step||(value-field.min)%field.step===0);
  if(field.type==='boolean')return typeof value==='boolean';
  if(field.type==='enum')return typeof value==='string'&&field.options.includes(value);
  return false;
}
function normalizeParameters(fields,values,{complete=false}={}){
  if(!values||typeof values!=='object'||Array.isArray(values))throw new TypeError('参数必须为对象');
  const result={};
  for(const [key,value] of Object.entries(values)){
    const field=fields.find(item=>item.key===key);
    if(!field||!validParameter(field,value))throw new TypeError('无效参数：'+key);
    result[key]=field.type==='color'?value.toLowerCase():value;
  }
  if(complete&&fields.some(field=>!Object.hasOwn(result,field.key)))throw new TypeError('缺少参数');
  return result;
}
// 仅文件导入/旧存储迁移允许补齐新字段，消息协议仍要求完整值。
function normalizeStoredParameters(asset,values){
  const fields=parameterSchemaFor(asset);
  if(!fields)throw TypeError('未登记的 Demo');
  const checked=normalizeParameters(fields,values);
  if(asset.id==='warm-workbench'&&fields.filter(f=>!f.group).every(f=>Object.hasOwn(checked,f.key))&&fields.filter(f=>f.group).every(f=>!Object.hasOwn(checked,f.key))){
    for(const field of fields)if(field.group)checked[field.key]=field.default;
  }
  return normalizeParameters(fields,checked,{complete:true});
}
// 固定字段生成 CSS，而非透传 CSS 文本；颜色、范围及布尔值均经过完整校验。
function warmLayoutCssValues(values){
  const v=normalizeParameters(WARM_LAYOUT_FIELDS,values,{complete:true});
  const css=Object.fromEntries(WARM_LAYOUT_FIELDS.filter(f=>f.css).map(f=>[f.css,String(v[f.key])+(f.unit||'')]));
  const color=v.shadowColor.slice(1).match(/../g).map(part=>parseInt(part,16)).join(', ');
  css['--warm-card-gradient']=v.gradient?'linear-gradient('+v.gradientAngle+'deg, '+v.surface+', '+v.gradientEnd+')':'none';
  css['--warm-card-shadow']=v.shadowOpacity?'0 '+v.shadowY+'px '+v.shadowBlur+'px rgba('+color+', '+v.shadowOpacity/100+')':'none';
  css['--warm-motion-curve']='cubic-bezier('+[v.curveX1,v.curveY1,v.curveX2,v.curveY2].map(x=>x/100).join(', ')+')';
  css['--warm-motion-duration']=v.motionDuration+'ms';
  css['--warm-motion-lift']=v.motionDuration&&v.motionLift?-v.motionLift+'px':'0px';
  return css;
}
function parameterMessage(action,requestId,values,assetId=FOUNDATION_ID){
  return {channel:PARAMETER_CHANNEL,version:PARAMETER_VERSION,assetId,action,requestId,...(values===undefined?{}:{values})};
}
function validParameterMessage(data,actions,assetId=FOUNDATION_ID){
  return !!data&&data.channel===PARAMETER_CHANNEL&&data.version===PARAMETER_VERSION&&data.assetId===assetId&&actions.includes(data.action)&&typeof data.requestId==='string'&&/^[a-zA-Z0-9-]{1,80}$/.test(data.requestId);
}
function tokenExport(values,format){
  const normalized=normalizeParameters(FOUNDATION_FIELDS,values,{complete:true});
  const tokens=Object.fromEntries(FOUNDATION_FIELDS.map(field=>[field.css,typeof normalized[field.key]==='number'?normalized[field.key]+field.unit:normalized[field.key]]));
  if(format==='css')return '/* UI Foundation: 当前编辑参数快照；非完整主题。 */\n:root {\n'+Object.entries(tokens).map(([key,value])=>'  '+key+': '+value+';').join('\n')+'\n}\n';
  if(format==='json')return JSON.stringify({format:'ui-vault-token-snapshot',version:1,tokens},null,2)+'\n';
  if(format==='ts')return 'export const tokens = '+JSON.stringify(tokens,null,2)+' as const;\n';
  throw new TypeError('未知导出格式');
}

function exportDemoParameters(asset,values){
  const fields=parameterSchemaFor(asset);
  if(!fields)throw new TypeError('未登记的 Demo');
  return JSON.stringify({format:'ui-vault-demo-parameters',version:1,assetId:asset.id,values:normalizeParameters(fields,values,{complete:true})},null,2)+'\n';
}
// 同一站点父窗口、精确资产 ID；不接收外站命令。
function installParameterBridge(assetId,fields,{read,apply,reset}){
  if(window.parent===window)return;
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.origin!==location.origin||!validParameterMessage(event.data,['read','apply','reset'],assetId))return;
    const {action,requestId,values}=event.data;
    try{
      if(action==='apply')apply(normalizeParameters(fields,values,{complete:true}));
      else if(action==='reset')reset();
      event.source.postMessage(parameterMessage('state',requestId,normalizeParameters(fields,read(),{complete:true}),assetId),event.origin);
    }catch{event.source.postMessage(parameterMessage('error',requestId,undefined,assetId),event.origin);}
  });
}
  const root=document.documentElement;
  const values=Object.fromEntries(WARM_LAYOUT_FIELDS.map(field=>[field.key,field.default]));
  function apply(next){
    const checked=normalizeParameters(WARM_LAYOUT_FIELDS,next,{complete:true});
    Object.assign(values,checked);
    for(const [key,value] of Object.entries(warmLayoutCssValues(checked)))root.style.setProperty(key,value);
  }
  function reset(){
    for(const field of WARM_LAYOUT_FIELDS)values[field.key]=field.default;
    for(const key of Object.keys(warmLayoutCssValues(values)))root.style.removeProperty(key);
  }
  installParameterBridge('warm-workbench',WARM_LAYOUT_FIELDS,{read:()=>({...values}),apply,reset});
})();
</script>
