<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>背景效果实验室 · UI Vault</title>
<style id="layout-styles">

:root{--page:#f5f5f1;--surface:#fbfbf8;--ink:#242a26;--secondary:#515d54;--tertiary:#657067;--line:#d5dbd4;--accent:#49624d;--subtle:#e9eee7;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page);font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:320px}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.43}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #4b7954;outline-offset:3px}
a{color:inherit}
.app{max-width:1420px;margin:0 auto;padding:clamp(16px,2vw,26px) clamp(16px,3.5vw,50px) clamp(24px,3.5vw,50px)}






.section-label{font-size:15px;font-weight:650;letter-spacing:-.017em;color:var(--ink);margin:0}
.section-hint{font-size:12px;color:var(--secondary)}
.preview-heading,.gallery-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 11px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:28px;align-items:stretch}
.preview-shell{min-width:0}
.preview-top{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 9px}
.preview-name{font-size:12px;font-weight:620;color:var(--secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-tools{display:flex;align-items:center;gap:4px;flex:none}
.icon-button{border:1px solid transparent;background:transparent;color:var(--secondary);border-radius:5px;min-height:32px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:540;white-space:nowrap}
.icon-button:hover:not(:disabled){background:var(--subtle);color:var(--ink)}
.icon-button[aria-pressed="true"]{background:var(--subtle);color:#345e3e}
.scene-frame{background:#202420;overflow:hidden;border-radius:4px;box-shadow:0 0 0 1px #1722180d}
#stage{height:clamp(295px,41vw,510px);min-height:295px}
.scene{width:100%;height:100%;position:relative;isolation:isolate;overflow:hidden;background:var(--base,#121713);color:var(--ink,#f6f6f1)}
.scene::before,.scene::after{content:"";position:absolute;pointer-events:none}
.scene::before{opacity:var(--intensity,.9);z-index:0;transform-origin:center}
.scene::after{z-index:1}
.scene.is-paused::before,.scene.is-paused::after{animation-play-state:paused!important}
.mock-content{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:flex-start;padding:clamp(26px,5vw,66px);text-align:left;pointer-events:none;background:linear-gradient(90deg,#080e132e,transparent 75%)}
.mock-content[hidden]{display:none}
.mock-inner{max-width:450px}
.mock-kicker{font-size:12px;font-weight:550;letter-spacing:0;text-transform:none;opacity:.92}
.mock-title{font-size:clamp(33px,5.1vw,64px);letter-spacing:-.065em;font-weight:630;line-height:1.11;margin:14px 0 15px}
.mock-copy{font-size:13px;line-height:1.82;max-width:370px;margin:0;opacity:.93}
.mock-pill{display:none}
.preview-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 0}
.preview-caption{font-size:12px;color:var(--secondary);line-height:1.5}
.tech-label{font-size:11px;color:var(--tertiary);white-space:nowrap}
.inspector{min-width:0;border-left:1px solid var(--line);padding:5px 0 0 27px;display:flex;flex-direction:column;gap:23px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-head h2{font-size:14px;font-weight:650;margin:0;color:var(--ink)}
.panel-head span{font-size:11px;color:var(--tertiary)}
.effect-title{font-size:24px;font-weight:640;letter-spacing:-.035em;line-height:1.18;margin:0 0 3px}
.effect-alias{font-size:12px;color:var(--tertiary);margin:0 0 9px}
.effect-desc{font-size:12px;line-height:1.74;color:var(--secondary);margin:0}
.rule{height:1px;background:var(--line)}
.control-group{display:grid;gap:10px}
.control-heading{font-size:12px;font-weight:580;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.control-heading output{font-size:12px;color:var(--secondary);font-variant-numeric:tabular-nums;font-weight:500}
.range{width:100%;accent-color:var(--accent);cursor:pointer;min-height:20px}
.palette-row{display:flex;flex-wrap:wrap;gap:7px}
.palette{width:35px;height:32px;display:grid;place-items:center;border:1px solid transparent;padding:3px;background:transparent;border-radius:5px}
.palette:before{content:"";width:100%;height:100%;border-radius:3px;border:1px solid #22332920;background:linear-gradient(125deg,var(--p1),var(--p2) 53%,var(--p3))}
.palette[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch-row label{font-size:12px;font-weight:570;color:var(--ink)}
.switch{border:0;background:#ccd4cd;width:34px;height:20px;border-radius:20px;padding:3px;flex:none}
.switch:before{display:block;content:"";height:14px;width:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0002;transition:transform .18s ease-out}
.switch[aria-pressed="true"]{background:#4d6c54}
.switch[aria-pressed="true"]:before{transform:translateX(14px)}
.panel-actions{display:grid;gap:9px;margin-top:auto}
.primary,.secondary{width:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;font-size:12px;font-weight:600}
.primary{background:#344c3b;color:#f6f8f3;border:1px solid #344c3b}
.primary:hover{background:#283f30}
.secondary{background:transparent;color:var(--secondary);border:1px solid #c8d1c8}
.secondary:hover{background:var(--subtle)}
.detail-note{font-size:11px;line-height:1.7;color:var(--secondary);margin:0}
.library{margin-top:48px}
.gallery-heading{margin-bottom:15px}
.gallery-heading p{font-size:12px;color:var(--secondary);margin:5px 0 0}
.filters{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 21px}
.filter{font-size:12px;font-weight:560;padding:9px 14px 11px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--secondary);margin-bottom:-1px}
.filter:hover{color:var(--ink);background:#e9eee782}
.filter[aria-pressed="true"]{color:#32533a;border-bottom-color:#32533a}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:27px 16px}
.tile{background:transparent;border:0;border-radius:0;text-align:left;color:inherit;padding:0;min-width:0}
.tile .scene{aspect-ratio:1.5;height:auto;border-radius:3px;contain:paint;pointer-events:none;box-shadow:0 0 0 1px #121a130e;transition:box-shadow .16s ease-out}
.tile .scene::before,.tile .scene::after{animation:none!important}
.tile:hover .scene{box-shadow:0 0 0 2px #86998a}
.tile[aria-pressed="true"] .scene{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--page)}
.tile-body{padding:11px 1px 0;display:flex;align-items:baseline;justify-content:space-between;gap:7px}
.tile-name{font-size:13px;font-weight:620;letter-spacing:-.01em;color:var(--ink)}
.tile-sub{display:block;font-size:11px;font-weight:400;color:var(--secondary);margin-top:3px}
.tile-index{font-size:11px;color:#737f74;font-variant-numeric:tabular-nums}
.sources{margin:50px 0 0;border-top:1px solid var(--line);padding:19px 0 0;display:flex;justify-content:space-between;gap:20px;font-size:12px;line-height:1.8;color:var(--secondary)}
.sources strong{color:var(--ink);font-weight:600}
.sources p{max-width:760px;margin:5px 0 0}
dialog{color:var(--ink);border:1px solid #c7d1c8;border-radius:9px;width:min(730px,calc(100vw - 32px));max-height:88vh;padding:0;background:var(--surface);box-shadow:0 30px 85px #1a2e1a45}
dialog::backdrop{background:#151d16ab;backdrop-filter:blur(3px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:19px 22px}
.modal-head h2{font-size:16px;font-weight:640;margin:0}
.modal-head p{font-size:12px;color:var(--secondary);margin:4px 0 0}
.modal-body{padding:18px 22px 21px}
.modal-body textarea{display:block;width:100%;height:min(48vh,410px);resize:vertical;background:#f1f4ef;border:1px solid var(--line);border-radius:5px;padding:13px;color:#293d31;font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace}
.modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px}
.modal-actions button{width:auto;padding:0 18px}
.status{font-size:12px;color:#3f684c;margin-right:auto}
@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr) 242px;gap:22px}.inspector{padding-left:21px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:840px){.workspace{grid-template-columns:1fr}.inspector{border-left:0;border-top:1px solid var(--line);padding:22px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 30px}.inspector>.panel-head,.inspector>.rule,.inspector>.panel-actions{grid-column:1/-1}.panel-actions{display:flex;align-items:center;flex-wrap:wrap}.panel-actions .primary,.panel-actions .secondary{width:auto;padding:0 16px}.detail-note{flex-basis:100%}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:580px){.app{padding:14px 16px 28px}.preview-heading{margin-bottom:8px}.section-hint{font-size:11px}.preview-name{font-size:11px}.icon-button{min-height:32px;padding:6px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 11px}.tile-name{font-size:12px}.tile .scene{aspect-ratio:1.38}.inspector{grid-template-columns:1fr;gap:18px}.inspector>.panel-head,.inspector>.rule,.inspector>.panel-actions{grid-column:auto}.panel-actions{display:grid}.panel-actions .primary,.panel-actions .secondary{width:100%}.sources{display:block}#stage{height:345px;min-height:300px}.mock-title{font-size:37px}.preview-foot{align-items:flex-start}}
@media(max-width:380px){.preview-tools{gap:0}.icon-button{font-size:11px}.tile-index{display:none}.filter{padding:9px 10px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}


/* 单视口工作台：页面本身永远不滚动；小屏转成紧凑上下布局。 */
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
.app{height:100vh;height:100dvh;max-height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:clamp(10px,1.7vh,20px) clamp(12px,3vw,42px);gap:0}
.preview-heading{flex:0 0 auto;align-items:center;margin:0 0 9px;min-height:36px}
.background-picker-trigger{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:36px;border:1px solid #b5c5b8;border-radius:7px;background:var(--surface);color:#314c38;padding:0 13px;font-size:12px;font-weight:650}
.background-picker-trigger:hover{background:var(--subtle);border-color:#8caa90}
.background-picker-trigger span{font-size:16px;line-height:1;opacity:.65}
.workspace{flex:1 1 auto;min-height:0;overflow:hidden;grid-template-columns:minmax(0,1fr) clamp(220px,23vw,276px);gap:clamp(14px,2vw,26px)}
.preview-shell{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.preview-top{flex:0 0 auto;min-height:36px;padding:0 0 7px}
.scene-frame{flex:1 1 auto;min-height:0;display:flex}
#stage{height:100%;min-height:0;flex:1}
.preview-foot{flex:0 0 auto;min-height:24px;padding:7px 0 0}
.inspector{min-height:0;overflow:hidden;gap:clamp(8px,1.7vh,18px);padding-top:0;padding-left:clamp(12px,2vw,24px)}
.effect-title{font-size:clamp(17px,2.8vh,23px)}
.effect-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.effect-alias{margin-bottom:5px}
.control-group{gap:6px}
.palette-row{gap:5px}
.panel-actions{gap:7px}
.panel-actions .primary,.panel-actions .secondary{min-height:34px}
.panel-actions .detail-note{display:none}
.inspector>.rule{margin:0}
.background-dialog{width:min(980px,calc(100vw - 30px));max-width:980px;max-height:min(780px,calc(100dvh - 30px));overflow:hidden;padding:0;border:1px solid #cbd6ce;border-radius:12px;background:var(--surface);box-shadow:0 28px 80px #16231b52}
.background-dialog[open]{display:flex;flex-direction:column}
.background-dialog .library{margin:0;padding:clamp(16px,2.4vw,28px);min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.background-dialog .gallery-heading{align-items:center;margin:0 0 13px}
.background-dialog .gallery-heading p{margin:3px 0 0}
.gallery-heading-tools{display:flex;gap:12px;align-items:center}
.background-dialog .filters{margin:0 0 16px}
.background-dialog .gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 13px}
.background-dialog .tile .scene{aspect-ratio:1.9}
.background-dialog .tile-body{padding:6px 1px 0}
.background-dialog .tile-name{font-size:12px}
.background-dialog .tile-sub{font-size:10px;margin:1px 0 0}
.background-dialog .tile[aria-pressed="true"] .scene{box-shadow:0 0 0 2px var(--accent)}
@media(max-width:850px){
 .workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr);gap:10px}
 .inspector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 15px;align-content:space-between;overflow:hidden;border-left:0;border-top:1px solid var(--line);padding:9px 0 0}
 .inspector>.panel-head{display:none}
 .inspector>div:nth-child(2){grid-column:1/-1}
 .inspector>.rule{display:none}
 .effect-title{font-size:17px;margin:0}
 .effect-alias,.effect-desc{display:none}
 .control-group{gap:3px}
 .inspector>.control-group:nth-of-type(4){grid-column:1/-1}
 .inspector>.switch-row{grid-column:1/-1}
 .inspector>.panel-actions{grid-column:1/-1;display:flex;gap:8px;margin:0}
 .panel-actions .primary,.panel-actions .secondary{width:50%;min-width:0;min-height:34px;padding:0 8px}
 .palette{width:32px;height:27px}
 .preview-top{min-height:30px}
 .preview-foot{min-height:19px}
 .background-dialog .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:580px){
 .app{padding:9px 12px 10px}
 .preview-heading{min-height:34px;margin-bottom:5px}
 .section-label{font-size:13px}
 .background-picker-trigger{min-height:32px;padding:0 10px}
 .workspace{grid-template-rows:minmax(0,49fr) minmax(0,51fr);gap:7px}
 .preview-top{min-height:28px;padding:0 0 4px}
 .preview-name{font-size:11px;max-width:45%;white-space:nowrap}
 .preview-tools{gap:1px}
 .preview-tools .icon-button{min-height:28px;padding:4px 6px;font-size:11px}
 .preview-foot{padding-top:4px;min-height:18px}
 .preview-caption{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .tech-label{font-size:10px}
 #stage{height:100%;min-height:0}

 .effect-title{font-size:15px}
 .control-heading{font-size:11px}

 .range{min-height:14px}
 .switch-row label{font-size:11px}
 .panel-actions .primary,.panel-actions .secondary{min-height:30px;font-size:11px}

 .background-dialog .tile .scene{aspect-ratio:1.7}

 .background-dialog .tile-sub{font-size:10px}

}
@media(max-height:670px) and (max-width:850px){
 .workspace{grid-template-rows:minmax(0,45fr) minmax(0,55fr)}

 .inspector>.switch-row{min-height:18px}

}
@media(max-height:500px) and (min-width:851px){
 .inspector{gap:5px}
 .effect-desc,.effect-alias{display:none}

}

</style>
<style id="background-effects">

/* 每个场景只操作 ::before / ::after；预览动效由宿主控制，缩略图静态。 */
.scene[data-style="aurora"]::before{
  inset:-28% -36%;
  background:
    radial-gradient(ellipse 17% 75% at 26% 44%,var(--a) 0%,transparent 100%),
    radial-gradient(ellipse 14% 83% at 46% 45%,var(--c) 0%,transparent 100%),
    radial-gradient(ellipse 17% 83% at 67% 48%,var(--b) 0%,transparent 100%),
    radial-gradient(ellipse 24% 38% at 76% 80%,var(--a) 0%,transparent 100%);
  filter:blur(31px);transform:rotate(-19deg);
  animation:auroraFlow var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="aurora"]::after{
  inset:0;background:linear-gradient(180deg,var(--base) 0%,transparent 33%,transparent 67%,var(--base) 112%);
  opacity:.63
}
.scene[data-style="mesh"]::before{
  inset:-12%;
  background:
    radial-gradient(ellipse 58% 61% at 10% 0%,var(--a),transparent 92%),
    radial-gradient(ellipse 60% 65% at 94% 26%,var(--b),transparent 93%),
    radial-gradient(ellipse 62% 60% at 57% 110%,var(--c),transparent 96%);
  filter:blur(18px);animation:meshFlow var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="mesh"]::after{
  inset:0;background:linear-gradient(127deg,#ffffff26 0%,transparent 42%,#20201512 100%)
}
.scene[data-style="silk"]::before{
  inset:-58%;
  background:conic-gradient(from 170deg at 49% 50%,var(--base),var(--a) 32deg,var(--c) 92deg,var(--b) 158deg,var(--a) 211deg,var(--base) 293deg,var(--c) 349deg,var(--base));
  filter:blur(15px);
  animation:silkFlow var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="silk"]::after{
  inset:0;background:linear-gradient(124deg,#ffffff2a 0%,transparent 22%,#13121b24 49%,transparent 67%,#ffffff18 86%),radial-gradient(ellipse at 50% 50%,transparent 17%,var(--base) 134%)
}
.scene[data-style="horizon"]{
  background:linear-gradient(180deg,var(--base) 8%,var(--a) 112%,var(--c) 150%)
}
.scene[data-style="horizon"]::before{
  inset:0 -10% -42%;
  background:radial-gradient(ellipse 49% 40% at 50% 80%,var(--c) 0%,var(--b) 37%,transparent 100%);
  filter:blur(20px);animation:lightBreath var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="horizon"]::after{
  inset:0;background:linear-gradient(180deg,transparent 61.5%,#ffecd132 61.65%,transparent 62.2%,#0e18232c 100%)
}
.scene[data-style="beams"]::before{
  inset:-43% -23%;
  background:repeating-conic-gradient(from 244deg at 50% 120%,transparent 0deg 6deg,var(--a) 6.5deg 7.6deg,transparent 8deg 19deg,var(--b) 19.5deg 20.9deg,transparent 22deg 36deg);
  filter:blur(7px);
  mask-image:linear-gradient(0deg,#000 0%,#000 33%,transparent 94%);
  animation:beamTilt var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="beams"]::after{
  inset:0;background:radial-gradient(ellipse at 49% 115%,var(--c),transparent 52%);opacity:.7
}
.scene[data-style="mist"]::before{
  inset:-18%;
  background:
    radial-gradient(ellipse 50% 55% at 27% 64%,var(--a),transparent 94%),
    radial-gradient(ellipse 44% 45% at 80% 24%,var(--b),transparent 93%),
    radial-gradient(ellipse 46% 39% at 65% 86%,var(--c),transparent 95%);
  filter:blur(33px) saturate(.82);
  animation:meshFlow var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="mist"]::after{
  inset:0;background:linear-gradient(145deg,#ffffff21,transparent 46%,#20232916)
}
.scene[data-style="glow"]::before{
  inset:-16%;
  background:
    radial-gradient(ellipse 27% 34% at 52% 49%,var(--c),transparent 100%),
    radial-gradient(ellipse 53% 65% at 52% 49%,var(--a),transparent 98%),
    radial-gradient(ellipse 62% 65% at 52% 49%,var(--b),transparent 100%);
  filter:blur(25px);
  animation:lightBreath var(--duration,22s) ease-in-out infinite alternate
}
.scene[data-style="glow"]::after{
  inset:0;background:radial-gradient(ellipse at 50% 48%,transparent 2%,var(--base) 85%);opacity:.83
}
.scene[data-style="topo"]::before{
  inset:-30%;
  background:
    repeating-radial-gradient(ellipse 62% 47% at 47% 46%,transparent 0px 15px,var(--a) 16px 17px,transparent 18px 31px);
  opacity:var(--pattern-opacity,.44)!important;transform:rotate(-17deg) scale(1.3)
}
.scene[data-style="topo"]::after{
  inset:0;background:radial-gradient(ellipse at 25% 28%,var(--c),transparent 65%);opacity:.19
}
.scene[data-style="grid"]{
  background:linear-gradient(138deg,var(--base),var(--a) 250%)
}
.scene[data-style="grid"]::before{
  inset:0;
  background-image:linear-gradient(var(--b) 1px,transparent 1px),linear-gradient(90deg,var(--b) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse at 51% 49%,#000 12%,transparent 92%);
  opacity:var(--pattern-opacity,.25)!important
}
.scene[data-style="grid"]::after{
  inset:0;background:radial-gradient(ellipse at 86% 18%,var(--c),transparent 58%);opacity:.26
}
.scene[data-style="dots"]::before{
  inset:0;background-image:radial-gradient(circle,var(--a) 1.25px,transparent 1.55px);
  background-size:19px 19px;
  mask-image:linear-gradient(110deg,#000 0%,#000 55%,transparent 100%);
  opacity:var(--pattern-opacity,.56)!important
}
.scene[data-style="dots"]::after{
  inset:0;background:radial-gradient(ellipse at 85% 75%,var(--b),transparent 64%);opacity:.14
}
.scene[data-style="paper"]{
  background:linear-gradient(165deg,var(--base),var(--a) 240%)
}
.scene[data-style="paper"]::before{
  inset:0;
  background:
    repeating-linear-gradient(0deg,transparent 0px 3px,var(--b) 4px 4.45px,transparent 5px 8px),
    repeating-linear-gradient(92deg,transparent 0px 6px,var(--c) 7px 7.4px,transparent 8px 13px),
    radial-gradient(circle at 20% 26%,#766d5650 0 0.45px,transparent .65px);
  background-size:auto,auto,13px 15px;
  opacity:var(--pattern-opacity,.11)!important
}
.scene[data-style="paper"]::after{
  inset:0;background:radial-gradient(ellipse at 56% 30%,#ffffff5c,transparent 60%)
}
.scene[data-style="stars"]::before{
  inset:-12%;
  background:
    radial-gradient(1px 1px at 11% 19%,#fff 90%,transparent),radial-gradient(1.5px 1.5px at 35% 67%,#fff 90%,transparent),
    radial-gradient(1px 1px at 60% 12%,#fff 90%,transparent),radial-gradient(2px 2px at 82% 45%,#fff 90%,transparent),
    radial-gradient(1px 1px at 95% 78%,#fff 90%,transparent),radial-gradient(1px 1px at 45% 34%,#fff 90%,transparent),
    radial-gradient(1px 1px at 73% 88%,#fff 90%,transparent),radial-gradient(1px 1px at 21% 81%,#fff 90%,transparent);
  background-size:140px 140px;
  animation:starDrift var(--duration,22s) linear infinite
}
.scene[data-style="stars"]::after{
  inset:0;background:radial-gradient(ellipse at 66% 65%,var(--a),transparent 59%),radial-gradient(ellipse at 32% 38%,var(--b),transparent 63%);opacity:.32
}
@keyframes auroraFlow{from{transform:translate3d(-4%,1%,0) rotate(-23deg)}to{transform:translate3d(5%,-3%,0) rotate(-11deg) scale(1.08)}}
@keyframes meshFlow{from{transform:translate3d(-2%,-2%,0)}to{transform:translate3d(3%,3%,0) scale(1.035)}}
@keyframes silkFlow{from{transform:rotate(-10deg)}to{transform:rotate(13deg) scale(1.03)}}
@keyframes lightBreath{from{transform:scale(.95)}to{transform:scale(1.07)}}
@keyframes beamTilt{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes starDrift{to{transform:translate3d(30px,18px,0)}}
@media(prefers-reduced-motion:reduce){.scene::before,.scene::after{animation:none!important}}

</style>
</head>
<body>
<main class="app">
<div class="preview-heading"><h2 class="section-label">当前预览</h2><button id="allBackgrounds" class="background-picker-trigger" type="button" aria-haspopup="dialog" aria-controls="backgroundDialog">全部背景 <span aria-hidden="true">▦</span></button></div>
<section class="workspace" aria-label="背景效果编辑器">
  <div class="preview-shell">
    <div class="preview-top">
      <span class="preview-name" id="previewName">流动极光</span>
      <div class="preview-tools">
        <button class="icon-button" id="overlayToggle" type="button" aria-pressed="false" title="显示或隐藏文字对照">文字对照</button>
        <button class="icon-button" id="pauseToggle" type="button" aria-pressed="false" title="暂停或播放动画">暂停动效</button>
      </div>
    </div>
    <div class="scene-frame"><div class="scene" id="stage" data-style="aurora">
      <div class="mock-content" id="mockContent" hidden><div class="mock-inner">
        <div class="mock-kicker">背景与排版对照</div>
        <div class="mock-title">阅读的留白</div>
        <p class="mock-copy">这段文字用于检查明暗、色彩和纹理对阅读的干扰。切换参数，观察文字是否仍然清晰。</p>
      </div></div>
    </div></div>
    <div class="preview-foot"><span class="preview-caption" id="caption">柔和光晕 · 适合品牌首屏和展示页</span><span class="tech-label" id="techLabel">CSS · 动态</span></div>
  </div>
  <aside class="inspector" aria-label="效果控制面板">
    <div class="panel-head"><h2>参数</h2><span>动态效果</span></div>
    <div><div class="effect-title" id="effectTitle">流动极光</div><div class="effect-alias" id="effectAlias">Aurora Drift</div><p class="effect-desc" id="effectDesc">三层径向渐变构建低饱和极光。</p></div>
    <div class="rule"></div>
    <div class="control-group"><div class="control-heading">配色 <output id="paletteLabel">北境苔绿</output></div><div class="palette-row" id="paletteRow" role="group" aria-label="选择配色方案"></div></div>
    <div class="control-group"><div class="control-heading"><label for="intensity">效果强度</label><output id="intensityValue">90%</output></div><input class="range" id="intensity" type="range" min="30" max="100" step="5" value="90"></div>
    <div class="control-group"><div class="control-heading"><label for="speed">动画速度</label><output id="speedValue">1.0×</output></div><input class="range" id="speed" type="range" min="5" max="20" step="5" value="10"></div>
    <div class="switch-row"><label for="overlaySwitch">显示文字对照</label><button type="button" class="switch" id="overlaySwitch" aria-label="显示文字对照" aria-pressed="false"></button></div>
    <div class="rule"></div>
    <div class="panel-actions"><button type="button" class="primary" id="viewCode">查看 CSS 代码</button><button type="button" class="secondary" id="reset">恢复默认参数</button><p class="detail-note">缩略图不会播放动画。选择具体背景后，可以调整颜色与运动速度。</p></div>
  </aside>
</section>
<dialog id="backgroundDialog" class="background-dialog" aria-labelledby="galleryTitle"><section class="library" aria-labelledby="galleryTitle">
  <div class="gallery-heading"><div><h2 class="section-label" id="galleryTitle">选择背景</h2><p>点击缩略图切换预览</p></div><div class="gallery-heading-tools"><span class="section-hint" id="count" aria-live="polite">全部 12 种</span><button type="button" id="closeBackgrounds" class="icon-button" aria-label="关闭背景选择弹窗">关闭</button></div></div>
  <div class="filters" id="filters" role="group" aria-label="背景分类">
    <button class="filter" type="button" data-filter="all" aria-pressed="true">全部背景</button>
    <button class="filter" type="button" data-filter="gradient" aria-pressed="false">渐变</button>
    <button class="filter" type="button" data-filter="light" aria-pressed="false">光效</button>
    <button class="filter" type="button" data-filter="pattern" aria-pressed="false">几何</button>
    <button class="filter" type="button" data-filter="texture" aria-pressed="false">纹理</button>
  </div>
  <div class="gallery" id="gallery"></div>
</section></dialog>
</main>
<dialog id="codeDialog" aria-labelledby="codeTitle">
  <div class="modal-head"><div><h2 id="codeTitle">导出 CSS</h2><p>只包含当前背景的变量、样式与对应动画。</p></div><button type="button" class="icon-button" id="closeCode" aria-label="关闭代码窗口">关闭</button></div>
  <div class="modal-body"><textarea id="codeText" readonly spellcheck="false" aria-label="可复制的背景代码"></textarea><div class="modal-actions"><span class="status" id="copyStatus" role="status" aria-live="polite"></span><button type="button" class="secondary" id="selectCode">全选</button><button type="button" class="primary" id="copyCode">复制代码</button></div></div>
</dialog>
<script>
'use strict';
const styles=[
  {id:'aurora',palette:2,name:'Aurora Drift',cn:'流动极光',category:'gradient',desc:'三层光晕缓慢漂移，保留原版极光实验的柔和氛围。',use:'品牌首屏与沉浸式展示',animated:true},
  {id:'mesh',palette:3,name:'Mesh Gradient',cn:'网格渐变',category:'gradient',desc:'多色椭圆色块交叠，形成轻盈的空间感。',use:'产品介绍与创作工具',animated:true},
  {id:'silk',palette:1,name:'Liquid Silk',cn:'丝绸流彩',category:'gradient',desc:'圆锥渐变缓慢旋转，生成连贯的彩色过渡。',use:'数字艺术与专题封面',animated:true},
  {id:'horizon',palette:1,name:'Horizon',cn:'暮光地平线',category:'light',desc:'低位发光区域与明暗层次，营造远方日落的轮廓。',use:'品牌故事与登陆页',animated:true},
  {id:'beams',palette:5,name:'Light Beams',cn:'光束',category:'light',desc:'稀疏的锥形射线与柔和漫射，制造舞台感。',use:'发布会与作品展示',animated:true},
  {id:'mist',palette:3,name:'Color Mist',cn:'色彩薄雾',category:'gradient',desc:'大范围柔化颜色交融，控制明暗而非增加装饰。',use:'平静的编辑器或工具',animated:true},
  {id:'glow',palette:5,name:'Soft Spotlight',cn:'柔光聚焦',category:'light',desc:'聚焦中央的一束弥散光，用来引导主要文字。',use:'Hero 区和产品亮点',animated:true},
  {id:'topo',palette:3,name:'Contour Lines',cn:'等高线',category:'pattern',desc:'规则的同心轮廓形成层次，不依赖复杂动画。',use:'地图与数据可视化',animated:false},
  {id:'grid',palette:4,name:'Blueprint Grid',cn:'工程网格',category:'pattern',desc:'规则网格、渐隐遮罩和边缘色调，强调结构。',use:'开发者工具与技术文档',animated:false},
  {id:'dots',palette:4,name:'Dot Matrix',cn:'点阵',category:'pattern',desc:'细点重复排列，渐变式显隐让画面更克制。',use:'仪表板与功能模块',animated:false},
  {id:'paper',palette:3,name:'Soft Paper',cn:'纸张肌理',category:'texture',desc:'极淡的交错线纹与偏暖底色，适合长时间阅读。',use:'文字编辑和内容首页',animated:false},
  {id:'stars',palette:0,name:'Night Sky',cn:'夜空星点',category:'texture',desc:'稀疏星点缓慢移动，搭配深色氛围光。',use:'探索与科技艺术',animated:true}
];
const palettes=[
  {name:'暮蓝',base:'#111e2b',a:'#466e93',b:'#7d8dad',c:'#537f80',ink:'#f5f7f6'},
  {name:'落日陶土',base:'#2b2021',a:'#bb6752',b:'#9c7788',c:'#e4ae7a',ink:'#fbf0e6'},
  {name:'北境苔绿',base:'#091b20',a:'#53bcaa',b:'#447d91',c:'#a3cb9d',ink:'#f1fbf5'},
  {name:'亚麻',base:'#ece8da',a:'#d1a391',b:'#bcc7aa',c:'#d2c3a0',ink:'#2c382f'},
  {name:'雾蓝',base:'#e5edea',a:'#96bdc0',b:'#b5b6cd',c:'#a9ccca',ink:'#263e40'},
  {name:'石墨金',base:'#121b1b',a:'#657d6e',b:'#caac72',c:'#536e72',ink:'#f3efe2'}

];
const $=id=>document.getElementById(id);
const state={selected:'aurora',palette:2,intensity:90,speed:10,overlay:false,paused:false,filter:'all'};
const patternOpacity={topo:.48,grid:.24,dots:.62,paper:.18};
const prefersReduced=window.matchMedia('(prefers-reduced-motion: reduce)');
function closeBackgroundPicker(){
  const dialog=$('backgroundDialog');
  if(dialog.open){dialog.close();$('allBackgrounds').focus();}
}
$('allBackgrounds').addEventListener('click',()=>{
  $('backgroundDialog').showModal();
  const active=$('gallery').querySelector('[aria-pressed="true"]');
  if(active)active.focus({preventScroll:true});
});
$('closeBackgrounds').addEventListener('click',closeBackgroundPicker);
$('backgroundDialog').addEventListener('click',event=>{
  if(event.target!==event.currentTarget)return;
  const rect=event.currentTarget.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeBackgroundPicker();
});
$('backgroundDialog').addEventListener('close',()=>{
  if(document.activeElement===document.body)$('allBackgrounds').focus({preventScroll:true});
});

function current(){return styles.find(item=>item.id===state.selected)||styles[0]}
function applyPalette(node,index){
  const p=palettes[index];
  node.style.setProperty('--base',p.base);node.style.setProperty('--a',p.a);
  node.style.setProperty('--b',p.b);node.style.setProperty('--c',p.c);
  node.style.setProperty('--ink',p.ink);
}
function syncMotion(){
  const canPlay=current().animated&&!state.paused&&!prefersReduced.matches&&!document.hidden;
  $('stage').classList.toggle('is-paused',!canPlay);
  $('pauseToggle').disabled=!current().animated||prefersReduced.matches;
  $('pauseToggle').setAttribute('aria-pressed',String(state.paused));
  $('pauseToggle').textContent=prefersReduced.matches?'系统已减弱动效':!current().animated?'无动效':state.paused?'播放动效':'暂停动效';
  $('speed').disabled=!current().animated||prefersReduced.matches;
}
function update(){
  const item=current(),stage=$('stage');
  stage.dataset.style=item.id;
  applyPalette(stage,state.palette);
  stage.style.setProperty('--intensity',String(state.intensity/100));
  stage.style.setProperty('--pattern-opacity',String((state.intensity/100)*(patternOpacity[item.id]??1)));
  stage.style.setProperty('--duration',String(Math.round(220/state.speed))+'s');
  $('effectTitle').textContent=item.cn;
  $('effectAlias').textContent=item.name;
  $('effectDesc').textContent=item.desc;
  $('previewName').textContent=item.cn+' / '+item.name;
  $('caption').textContent='适用：'+item.use;
  $('techLabel').textContent=item.animated?'CSS · 动态':'CSS · 静态';
  $('paletteLabel').textContent=palettes[state.palette].name;
  $('intensityValue').textContent=state.intensity+'%';
  $('intensity').value=String(state.intensity);
  $('speedValue').textContent=(state.speed/10).toFixed(1)+'×';
  $('speed').value=String(state.speed);
  $('mockContent').hidden=!state.overlay;
  $('overlaySwitch').setAttribute('aria-pressed',String(state.overlay));
  $('overlayToggle').setAttribute('aria-pressed',String(state.overlay));
  document.querySelector('.panel-head span').textContent=item.animated?'动态效果':'静态纹理';
  document.querySelectorAll('.palette').forEach((node,i)=>node.setAttribute('aria-pressed',String(i===state.palette)));
  document.querySelectorAll('.tile').forEach(node=>node.setAttribute('aria-pressed',String(node.dataset.id===item.id)));
  syncMotion();
}
function renderGallery(){
  const visible=styles.filter(item=>state.filter==='all'||item.category===state.filter);
  $('gallery').replaceChildren();
  visible.forEach(item=>{
    const button=document.createElement('button');
    button.className='tile';button.type='button';button.dataset.id=item.id;
    button.setAttribute('aria-label','预览 '+item.cn+'背景');
    const scene=document.createElement('div');scene.className='scene';scene.dataset.style=item.id;scene.setAttribute('aria-hidden','true');applyPalette(scene,item.palette??0);scene.style.setProperty('--intensity','.9');scene.style.setProperty('--pattern-opacity',String(.9*(patternOpacity[item.id]??1)));
    const body=document.createElement('div');body.className='tile-body';
    const name=document.createElement('div');name.className='tile-name';name.textContent=item.cn;
    const sub=document.createElement('span');sub.className='tile-sub';sub.textContent=item.name;name.append(sub);
    body.append(name);button.append(scene,body);
    button.addEventListener('click',()=>{state.selected=item.id;state.palette=item.palette??0;state.paused=false;update();closeBackgroundPicker();});
    $('gallery').append(button);
  });
  $('count').textContent=(state.filter==='all'?'全部 ':'当前分类 ')+visible.length+' 种';
  update();
}
function renderPalettes(){
  palettes.forEach((p,i)=>{
    const button=document.createElement('button');
    button.type='button';button.className='palette';button.title=p.name;
    button.setAttribute('aria-label','配色：'+p.name);
    button.style.setProperty('--p1',p.a);button.style.setProperty('--p2',p.b);button.style.setProperty('--p3',p.c);
    button.addEventListener('click',()=>{state.palette=i;update()});
    $('paletteRow').append(button);
  });
}
function toggleOverlay(){state.overlay=!state.overlay;update()}
$('overlayToggle').addEventListener('click',toggleOverlay);
$('overlaySwitch').addEventListener('click',toggleOverlay);
$('pauseToggle').addEventListener('click',()=>{state.paused=!state.paused;update()});
$('intensity').addEventListener('input',event=>{state.intensity=Number(event.target.value);update()});
$('speed').addEventListener('input',event=>{state.speed=Number(event.target.value);update()});
$('reset').addEventListener('click',()=>{Object.assign(state,{palette:current().palette??0,intensity:90,speed:10,overlay:false,paused:false});update()});
$('filters').addEventListener('click',event=>{
  const button=event.target.closest('button[data-filter]');
  if(!button)return;
  state.filter=button.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(node=>node.setAttribute('aria-pressed',String(node===button)));
  renderGallery();
});
document.addEventListener('visibilitychange',syncMotion);
if(prefersReduced.addEventListener)prefersReduced.addEventListener('change',syncMotion);
const animationFor={aurora:'auroraFlow',mesh:'meshFlow',silk:'silkFlow',horizon:'lightBreath',beams:'beamTilt',mist:'meshFlow',glow:'lightBreath',stars:'starDrift'};
function selectedCode(){
  const p=palettes[state.palette],id=state.selected;
  const source=document.querySelector('#background-effects').sheet;
  const relevant=Array.from(source.cssRules).filter(rule=>{
    if(rule.type===CSSRule.KEYFRAMES_RULE)return rule.name===animationFor[id];
    if(rule.type===CSSRule.MEDIA_RULE)return true;
    const selector=rule.selectorText||'';
    return selector.includes('.scene')&&(!selector.includes('data-style')||selector.includes('data-style="'+id+'"'));
  }).map(rule=>rule.cssText).join('\n\n');
  return '<!-- 背景容器 -->\n<div class="scene" data-style="'+id+'"></div>\n\n<style>\n'+
    '.scene {position:relative;isolation:isolate;display:block;overflow:hidden;width:100%;min-height:320px;background:var(--base);color:var(--ink);--base:'+p.base+';--a:'+p.a+';--b:'+p.b+';--c:'+p.c+';--ink:'+p.ink+';--intensity:'+(state.intensity/100)+';--pattern-opacity:'+((state.intensity/100)*(patternOpacity[id]??1))+';--duration:'+Math.round(220/state.speed)+'s;}\n'+
    '.scene::before,.scene::after{content:"";position:absolute;pointer-events:none}.scene::before{opacity:var(--intensity);z-index:0;transform-origin:50% 50%}.scene::after{z-index:1}\n'+
    relevant+'\n</style>';
}
$('viewCode').addEventListener('click',()=>{
  $('codeText').value=selectedCode();$('copyStatus').textContent='';
  if(typeof $('codeDialog').showModal==='function')$('codeDialog').showModal();
  else $('codeDialog').setAttribute('open','');
});
$('closeCode').addEventListener('click',()=>$('codeDialog').close());
$('codeDialog').addEventListener('click',event=>{if(event.target===$('codeDialog'))$('codeDialog').close()});
$('selectCode').addEventListener('click',()=>{$('codeText').focus();$('codeText').select()});
$('copyCode').addEventListener('click',async()=>{
  const input=$('codeText');input.focus();input.select();let copied=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(input.value);copied=true}}catch{}
  if(!copied){try{copied=document.execCommand('copy')}catch{}}
  $('copyStatus').textContent=copied?'已复制到剪贴板':'已选中代码，请手动复制';
});
renderPalettes();renderGallery();
</script>
</body>
</html>
