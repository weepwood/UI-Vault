<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#edf1f4"><title>消息动效实验 · 手工精调 · UI Vault</title>
<style>
/* TUNING: 消息背景、动画时长、曲线与气泡半径均有独立入口。*/
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#edf1f4;--surface:#fff;--sidebar:#f7f9fa;--ink:#202e38;--muted:#5e707c;--line:#dce4e8;--accent:#257bb2;--accent-soft:#e5f1f8;--outgoing:#d8edfa;--incoming:#fff;--radius:16px;--duration:320ms;--fast:190ms;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:13px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{transition:background var(--fast) var(--ease)}
.app{display:grid;grid-template-columns:198px minmax(0,1fr) 226px;height:100vh;min-height:390px;max-height:100vh;overflow:hidden}
.chats{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.chats h2{font-size:13px;margin:0;padding:18px 15px}.chat-nav{display:grid;gap:3px;padding:0 8px}.chat-nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:12px 9px;text-align:left;min-width:0;color:var(--ink)}.chat-nav button[aria-current="page"]{background:var(--accent-soft)}.chat-nav button:hover{background:#e6edf1}.avatar{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;background:#b7d2df;color:#244e60;border-radius:10px;font-weight:700}.avatar.other{background:#d8d1e8;color:#534467}.chat-nav strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-nav small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-note{margin-top:auto;padding:16px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.6}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}.thread-header{background:var(--surface);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}.thread-header strong{display:block;font-size:13px}.thread-header small{font-size:10px;color:var(--muted)}.thread-header .small-btn{padding:7px 9px;border:1px solid var(--line);background:var(--surface);border-radius:6px;color:var(--muted);font-size:11px}
.messages{flex:1;min-height:0;overflow:auto;padding:22px clamp(12px,3vw,38px);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.message{display:flex;align-items:flex-end;gap:7px;max-width:90%;position:relative;touch-action:pan-y}.message.mine{margin-left:auto;flex-direction:row-reverse}.bubble{max-width:470px;position:relative;background:var(--incoming);padding:12px 14px 10px;border:1px solid var(--line);border-radius:var(--radius) var(--radius) var(--radius) 4px;box-shadow:0 2px 4px #1b3c4e08;cursor:default;min-width:70px}.mine .bubble{background:var(--outgoing);border-color:#bddcea;border-radius:var(--radius) var(--radius) 4px var(--radius)}.bubble p{margin:0;font-size:12px;line-height:1.68;overflow-wrap:anywhere;white-space:pre-wrap}.bubble small{display:block;text-align:right;font-size:9px;margin-top:5px;color:#617584}.message-actions{display:flex;gap:4px;opacity:.45;transition:opacity var(--fast)}.message:hover .message-actions,.message:focus-within .message-actions{opacity:1}.message-actions button{border:0;background:transparent;color:var(--muted);padding:5px;font-size:11px;border-radius:5px}.message-actions button:hover{background:var(--surface)}.reaction{position:absolute;right:-9px;bottom:-12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 6px;font-size:10px}
.reply-block{background:var(--surface);display:flex;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid var(--line)}.reply-block strong{font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reply-block button{border:0;background:transparent;color:var(--muted)}
.composer{background:var(--surface);padding:12px 13px;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:9px}.composer textarea{resize:none;flex:1;min-height:42px;max-height:105px;border:1px solid var(--line);background:var(--sidebar);border-radius:11px;padding:11px 12px;color:var(--ink);font-size:12px;line-height:1.6}.composer button{border:0;color:#fff;background:var(--accent);height:42px;min-width:57px;border-radius:10px;font-size:12px;font-weight:600}.composer button:hover{background:#175d8e}
.settings{background:var(--surface);border-left:1px solid var(--line);padding:19px 16px;display:flex;flex-direction:column;gap:22px;overflow:auto}.settings h2{font-size:13px;margin:0;padding-bottom:14px;border-bottom:1px solid var(--line)}.group{display:grid;gap:9px}.group label{font-size:11px;color:var(--muted)}.group select{border:1px solid var(--line);background:var(--sidebar);border-radius:7px;padding:9px;color:var(--ink)}.group input[type=range]{width:100%;accent-color:var(--accent)}.checks{display:flex;align-items:center;gap:8px}.checks input{accent-color:var(--accent)}.rule{color:var(--muted);font-size:10px;line-height:1.7;border-top:1px solid var(--line);padding-top:15px}.test-actions{display:grid;gap:7px}.test-actions button{border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:9px;text-align:left;font-size:11px}.test-actions button:hover{background:var(--accent-soft)}
.motion-ghost{position:fixed;z-index:40;pointer-events:none;font-size:12px;line-height:1.6;white-space:pre-wrap;background:var(--outgoing);border:1px solid #bddcea;color:var(--ink);padding:12px 14px;border-radius:14px;max-width:220px;overflow-wrap:anywhere;box-shadow:0 5px 17px #16384a18}
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:70;background:#19384a;color:#fff;padding:9px 12px;border-radius:7px;opacity:0;pointer-events:none;font-size:11px}.toast.show{opacity:1}
@media(max-width:900px){.app{grid-template-columns:157px minmax(0,1fr)}.settings{grid-column:1/-1;display:flex;flex-wrap:wrap;flex-direction:row;max-height:190px;border-top:1px solid var(--line);border-left:0;padding:12px}.settings h2{display:none}.settings .group{min-width:130px}.settings .rule{flex:1;min-width:150px;margin:0;border:0;padding:0}.settings .test-actions{grid-auto-flow:column}}
@media(max-width:580px){.app{grid-template-columns:1fr}.chats{display:none}.settings{max-height:165px}.messages{padding:12px}.message{max-width:98%}.thread-header{padding:9px 12px}.message-actions{opacity:1}}
@media(prefers-reduced-motion:reduce){:root{--duration:0ms;--fast:0ms}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:0ms!important}}
</style></head>
<body>
<div class="app">
<aside class="chats" aria-label="演示会话"><h2>交互实验 / 会话</h2><nav class="chat-nav"><button type="button" data-chat="motion" aria-current="page"><span class="avatar">UI</span><span><strong>动效评审</strong><small>发送、回复与反应</small></span></button><button type="button" data-chat="review"><span class="avatar other">QA</span><span><strong>设计复盘</strong><small>切换上下文</small></span></button></nav><p class="sidebar-note">这是独立交互实验。所有消息仅在本页面内存中保存，不调用任何聊天服务。</p></aside>
<main class="thread">
<header class="thread-header"><div><strong id="chat-name">动效评审</strong><small>真实操作反馈 / 零网络请求</small></div><button type="button" class="small-btn" id="change-chat">切换会话</button></header>
<div id="messages" class="messages" role="log" aria-label="聊天消息" aria-live="polite" aria-relevant="additions"></div>
<div class="reply-block" id="reply-block" hidden><strong id="reply-text"></strong><button type="button" id="clear-reply" aria-label="取消回复">×</button></div>
<form class="composer" id="composer"><textarea id="message-input" rows="1" maxlength="350" aria-label="输入演示消息" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea><button type="submit">发送</button></form>
</main>
<aside class="settings" aria-label="动效参数">
<h2>Motion / 可调参数</h2><div class="group"><label for="easing">缓动曲线</label><select id="easing"><option value="swift">快速收敛</option><option value="soft">柔和</option><option value="spring">轻回弹</option></select></div><div class="group"><label for="duration">时长 <output id="duration-value">320ms</output></label><input id="duration" type="range" min="100" max="650" value="320" step="10"></div><div class="group"><label class="checks"><input id="reduce" type="checkbox"> 减少动画</label><label class="checks"><input id="compact" type="checkbox"> 紧凑气泡</label></div><div class="test-actions"><button type="button" id="test-send">演示：消息飞入</button><button type="button" id="test-reaction">演示：表情反馈</button></div><p class="rule">交互：右滑气泡超过 48px 可回复，也可按气泡旁的回复按钮。系统减少动态效果优先；所有动画只服务于用户状态变化。</p>
</aside></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* TUNING: 原理取自 Motion-Lab 的 FLIP/WAAPI、手势与 reduced-motion 设计；所有逻辑独立实现。*/
const $=id=>document.getElementById(id);
const threads={
 motion:[{id:1,text:'这次先只研究三种交互：发送、回复、表情反馈。',mine:false,time:'14:20',reaction:''},{id:2,text:'先做有意义的反馈，再考虑装饰。',mine:true,time:'14:22',reaction:''},{id:3,text:'可以右滑这条消息，也可以点「回复」。',mine:false,time:'14:24',reaction:''}],
 review:[{id:4,text:'交互状态要可中断，切换会话不能留下残影。',mine:false,time:'10:30',reaction:''},{id:5,text:'收到。我们分别验证普通模式和减少动画模式。',mine:true,time:'10:31',reaction:''}]
};
let current='motion',nextId=6,reply=null,preset='swift',duration=320,reducedByUser=false,compact=false,toastTimer,animationToken=0;
const easePresets={swift:'cubic-bezier(.23,1,.32,1)',soft:'cubic-bezier(.4,0,.2,1)',spring:'cubic-bezier(.16,1.3,.3,1)'};
const media=matchMedia('(prefers-reduced-motion:reduce)');
function currentDuration(){return reducedByUser||media.matches?0:duration}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function notice(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function pushBottom(){const node=$('messages');node.scrollTop=node.scrollHeight}
function setReply(message){reply=message;$('reply-block').hidden=!reply;if(reply)$('reply-text').textContent='回复：'+reply.text.slice(0,55);$('message-input').focus()}
function cancelReply(){reply=null;$('reply-block').hidden=true}
$('clear-reply').addEventListener('click',cancelReply);
function messageNode(message){const outer=document.createElement('article');outer.className='message'+(message.mine?' mine':'');outer.dataset.id=String(message.id);const bubble=document.createElement('div');bubble.className='bubble';bubble.tabIndex=0;bubble.setAttribute('aria-label',(message.mine?'我：':'对方：')+message.text);const text=document.createElement('p');text.textContent=message.text;const time=document.createElement('small');time.textContent=message.time;bubble.append(text,time);if(message.reaction){const chip=document.createElement('span');chip.className='reaction';chip.textContent=message.reaction;bubble.append(chip)}const actions=document.createElement('div');actions.className='message-actions';const replyButton=document.createElement('button');replyButton.type='button';replyButton.textContent='↩';replyButton.setAttribute('aria-label','回复这条消息');replyButton.addEventListener('click',()=>setReply(message));const reactionButton=document.createElement('button');reactionButton.type='button';reactionButton.textContent=message.reaction?'♥':'♡';reactionButton.setAttribute('aria-label','切换表情反馈');reactionButton.addEventListener('click',()=>toggleReaction(message.id));actions.append(replyButton,reactionButton);outer.append(bubble,actions);
 let pointer=null;
 bubble.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointer={id:event.pointerId,startX:event.clientX,startY:event.clientY,delta:0};});
 bubble.addEventListener('pointermove',event=>{if(!pointer||pointer.id!==event.pointerId)return;const x=event.clientX-pointer.startX,y=event.clientY-pointer.startY;if(x>0&&Math.abs(x)>Math.abs(y)*1.3){pointer.delta=Math.min(x,85);bubble.style.transform='translateX('+pointer.delta+'px)'}});
 function endPointer(event){if(!pointer||pointer.id!==event.pointerId)return;const dx=pointer.delta;pointer=null;bubble.style.transform='';if(dx>48){setReply(message);notice('已选择回复')}}
 bubble.addEventListener('pointerup',endPointer);bubble.addEventListener('pointercancel',()=>{pointer=null;bubble.style.transform=''});
 bubble.addEventListener('keydown',event=>{if(event.key==='r'&&!event.ctrlKey&&!event.metaKey){event.preventDefault();setReply(message)}});
 return outer;
}
function renderThread(){const root=$('messages');root.replaceChildren();threads[current].forEach(message=>root.append(messageNode(message)));pushBottom()}
function toggleReaction(id){const m=threads[current].find(x=>x.id===id);if(!m)return;m.reaction=m.reaction?'':'💙';const row=$('messages').querySelector('[data-id="'+id+'"]');const old=row?.getBoundingClientRect();renderThread();const target=$('messages').querySelector('[data-id="'+id+'"] .reaction');if(target&&currentDuration()&&target.animate){target.animate([{transform:'scale(.65)',opacity:0},{transform:'scale(1.1)',opacity:1},{transform:'scale(1)',opacity:1}],{duration:Math.min(currentDuration(),300),easing:easePresets[preset]})}}
function changeChat(target){if(!threads[target]||target===current)return;current=target;animationToken++;document.querySelectorAll('.motion-ghost').forEach(n=>n.remove());$('chat-name').textContent=target==='motion'?'动效评审':'设计复盘';document.querySelectorAll('[data-chat]').forEach(button=>{if(button.dataset.chat===target)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});cancelReply();renderThread();notice('已切换会话')}
$('change-chat').addEventListener('click',()=>changeChat(current==='motion'?'review':'motion'));
document.querySelectorAll('[data-chat]').forEach(button=>button.addEventListener('click',()=>changeChat(button.dataset.chat)));
async function send(textValue){const content=textValue.trim();if(!content)return;const origin=$('message-input').getBoundingClientRect(),stamp=animationToken,threadId=current;const msg={id:nextId++,text:content,mine:true,time:now(),reaction:''};if(reply)msg.text='↳ '+reply.text.slice(0,24)+'\n'+content;threads[current].push(msg);$('message-input').value='';cancelReply();const root=$('messages');const row=messageNode(msg);root.append(row);pushBottom();const bubble=row.querySelector('.bubble'),ms=currentDuration();if(!ms||!bubble.animate)return;const destination=bubble.getBoundingClientRect();if(destination.width===0)return;bubble.style.opacity='0';
 const ghost=document.createElement('div');ghost.className='motion-ghost';ghost.textContent=msg.text;ghost.style.left=Math.max(0,origin.left+8)+'px';ghost.style.top=Math.max(0,origin.top)+'px';document.body.append(ghost);
 const dx=destination.left-origin.left,dy=destination.top-origin.top;
 try{const animation=ghost.animate([{transform:'translate(0px,0px) scale(.86)',opacity:.35},{transform:'translate('+dx+'px,'+dy+'px) scale(1)',opacity:1}],{duration:ms,easing:easePresets[preset]});await animation.finished.catch(()=>{});}finally{ghost.remove();if(threadId===current&&stamp===animationToken&&bubble.isConnected){bubble.style.opacity='';bubble.animate([{opacity:0},{opacity:1}],{duration:Math.min(120,ms)})}}}
$('composer').addEventListener('submit',event=>{event.preventDefault();void send($('message-input').value)});
$('message-input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();void send(event.currentTarget.value)}});
$('test-send').addEventListener('click',()=>void send('消息从输入框移动到目标位置，随后自然显现。'));
$('test-reaction').addEventListener('click',()=>{const messages=threads[current];if(messages.length)toggleReaction(messages[messages.length-1].id)});
$('easing').addEventListener('change',event=>{preset=event.target.value;document.documentElement.style.setProperty('--ease',easePresets[preset])});
$('duration').addEventListener('input',event=>{duration=Number(event.target.value);$('duration-value').textContent=duration+'ms';document.documentElement.style.setProperty('--duration',duration+'ms');document.documentElement.style.setProperty('--fast',Math.round(duration*.6)+'ms')});
$('reduce').addEventListener('change',event=>{reducedByUser=event.target.checked;notice(reducedByUser?'已禁用可选动画':'已恢复动画偏好')});
$('compact').addEventListener('change',event=>{compact=event.target.checked;document.documentElement.style.setProperty('--radius',compact?'8px':'16px');$('messages').style.gap=compact?'8px':'14px'});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&reply)cancelReply()});
renderThread();
</script></body></html>
