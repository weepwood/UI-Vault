<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf9f7">
<title>任务工作台 · 手工精调实验 · UI Vault</title>
<style>
/* TUNING / 精调入口：先修改这里的语义色、布局密度和圆角，再检查 390 / 768 / 1280。 */
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--bg:#faf9f7;--rail:#f3f2ef;--surface:#fff;--surface2:#f7f6f3;--line:#e7e5df;--ink:#242320;--muted:#65625c;--accent:#5362ce;--accent-text:#fff;--radius:10px;--row:53px;--ease:cubic-bezier(.2,.7,.25,1);color-scheme:light}
body[data-theme="dark"]{--bg:#1b1b1a;--rail:#171716;--surface:#242420;--surface2:#2c2b28;--line:#3b3934;--ink:#eae8e3;--muted:#b5b1a9;--accent:#9da8f7;--accent-text:#1d2449;color-scheme:dark}
body[data-accent="teal"]{--accent:#18776e;--accent-text:#fff}body[data-accent="rose"]{--accent:#a83a64;--accent-text:#fff}body[data-accent="graphite"]{--accent:#54534f;--accent-text:#fff}
body[data-theme="dark"][data-accent="teal"]{--accent:#78d3c9;--accent-text:#122c2a}body[data-theme="dark"][data-accent="rose"]{--accent:#ef9ab9;--accent-text:#462534}body[data-theme="dark"][data-accent="graphite"]{--accent:#d7d5ce;--accent-text:#20201e}
body[data-density="compact"]{--row:38px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{transition:background-color .16s var(--ease)}button:disabled{opacity:.5;cursor:not-allowed}
.app{display:grid;grid-template-columns:204px minmax(0,1fr) 245px;min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:24px}
.brand{font-size:15px;font-weight:760;letter-spacing:-.035em;display:flex;align-items:center;gap:9px}
.mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-text);font-size:15px}
.rail small,.overline{font-size:10px;color:var(--muted)}.rail-nav{display:grid;gap:4px}.rail-nav button{border:0;background:transparent;text-align:left;color:var(--muted);padding:10px 11px;border-radius:7px}.rail-nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:650}.rail-bottom{margin-top:auto;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px}
.workspace{min-width:0;padding:23px clamp(16px,3vw,38px) 34px}.topline,.heading,.section-head,.stat-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.topline{color:var(--muted);font-size:11px}.topline b{color:var(--ink);font-weight:550}
h1{font-size:clamp(24px,3vw,31px);line-height:1.18;letter-spacing:-.055em;margin:24px 0 7px}h2{font-size:14px;letter-spacing:-.025em;margin:0}p{margin:0} .lead{color:var(--muted);font-size:12px;margin-bottom:25px}
.primary,.secondary{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:var(--radius);font-size:12px;font-weight:600}
.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}.primary:hover{filter:brightness(.94)}.secondary:hover{background:var(--surface2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:24px}.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:15px;min-width:0}.stat strong{font-size:27px;line-height:1.5;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.stat .overline{font-size:11px}.progress{height:4px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:12px}.progress span{display:block;width:0;height:100%;background:var(--accent);transition:width .2s var(--ease)}
.section-head{margin:6px 0 13px}.segmented{display:inline-flex;border:1px solid var(--line);padding:3px;border-radius:8px;gap:2px}.segmented button{background:transparent;border:0;border-radius:5px;color:var(--muted);font-size:11px;padding:5px 10px}.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px #0000000b}
.task-panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);overflow:hidden}.task-toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{flex:1;min-width:100px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:7px 9px;color:var(--ink);outline-offset:2px}.filter{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--muted);background:var(--surface)}.filter[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.task-row{min-height:var(--row);display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line)}.task-row:last-child{border-bottom:0}.task-row input{accent-color:var(--accent);width:16px;height:16px;flex:none;margin:0}.task-title{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:550}.task-title.done{text-decoration:line-through;color:var(--muted)}.tag{white-space:nowrap;font-size:10px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);padding:3px 6px;border-radius:5px}.tag.high{color:#a45c23}.empty{padding:28px 13px;color:var(--muted);text-align:center;font-size:12px}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:12px}.board-col{border:1px solid var(--line);background:var(--surface2);border-radius:var(--radius);padding:10px;min-width:0}.board-col h3{font-size:11px;color:var(--muted);margin:1px 0 10px}.board-item{padding:11px;background:var(--surface);border:1px solid var(--line);border-radius:7px;margin-top:7px}.board-item strong{display:block;overflow-wrap:anywhere;font-size:12px}.board-item small{color:var(--muted)}.board-item button{margin-top:9px;background:none;color:var(--accent);border:0;font-size:11px;padding:3px}
.inspector{border-left:1px solid var(--line);background:var(--surface);padding:24px 18px;display:flex;flex-direction:column;gap:19px}.inspector h2{font-size:13px;padding-bottom:14px;border-bottom:1px solid var(--line)}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:11px}.field select,.field input[type="range"]{width:100%}.field select{border:1px solid var(--line);border-radius:7px;padding:9px;background:var(--surface2);color:var(--ink)}
.swatches{display:flex;gap:8px}.swatches button{width:26px;height:26px;border:3px solid var(--surface);border-radius:50%;background:var(--swatch);box-shadow:0 0 0 1px var(--line)}.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}.hint{border-top:1px solid var(--line);padding-top:15px;margin-top:auto;font-size:11px;color:var(--muted);line-height:1.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:7px;padding:9px 13px;font-size:11px;opacity:0;pointer-events:none}.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);width:min(410px,calc(100vw - 30px));padding:22px;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#1720278e}dialog h2{font-size:17px;margin:0 0 13px}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px;font-size:12px;color:var(--muted)}dialog input,dialog select{border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);padding:10px;width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
@media(max-width:1050px){.app{grid-template-columns:170px minmax(0,1fr)}.inspector{border-left:0;border-top:1px solid var(--line);grid-column:2;flex-direction:row;flex-wrap:wrap}.inspector h2{width:100%;padding:0;border:0}.field{min-width:120px;flex:1}.hint{margin:0;width:100%}}
@media(max-width:620px){.app{grid-template-columns:1fr}.rail{display:none}.workspace{padding:16px}.inspector{grid-column:1}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}.heading{align-items:flex-start}.board{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0ms!important;animation-duration:0ms!important}}

/* Lucide icons are embedded in this self-contained sandboxed Demo. */
.lucide-demo-icon{width:16px;height:16px;flex:none;vertical-align:-.2em}
.rail-nav button,.heading>.primary,.segmented button,.filter,.dialog-actions button{display:inline-flex;align-items:center;gap:8px}
.rail-nav button{width:100%}.segmented button{gap:5px}
.heading>.primary .lucide-demo-icon{width:15px;height:15px}
@media(max-width:620px){.heading>.primary{white-space:nowrap}}
</style>
</head>
<body data-theme="light" data-accent="indigo" data-density="comfortable">
<div class="app">
 <aside class="rail" aria-label="实验导航"><div class="brand"><span class="mark" aria-hidden="true">g</span> Task Studio</div><div class="rail-nav"><small>工作空间</small><button aria-current="page"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1" />
  <rect width="7" height="7" x="14" y="3" rx="1" />
  <rect width="7" height="7" x="14" y="14" rx="1" />
  <rect width="7" height="7" x="3" y="14" rx="1" /></svg><span>任务面板</span></button><button type="button" id="nav-create"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" />
  <path d="M12 5v14" /></svg><span>新建任务</span></button><button type="button" id="nav-focus"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <rect x="3" y="4" width="6" height="6" rx="1" /></svg><span>仅看未完成</span></button></div><div class="rail-bottom">独立交互样例 · 无后端数据</div></aside>
 <main class="workspace"><div class="topline"><span>Workspace / Design System</span><b>可交互 Demo</b></div><div class="heading"><div><h1>任务工作台</h1><p class="lead">调节主题和密度，验证真实任务状态在不同风格下的表现。</p></div><button type="button" class="primary" id="new-task"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" />
  <path d="M12 5v14" /></svg><span>新建</span></button></div>
 <section class="stats" aria-label="任务统计"><div class="stat"><span class="overline">任务总数</span><strong id="count-all">0</strong><div class="progress"><span id="progress-all"></span></div></div><div class="stat"><span class="overline">已完成</span><strong id="count-done">0</strong><div class="progress"><span id="progress-done"></span></div></div><div class="stat"><span class="overline">待处理</span><strong id="count-open">0</strong><div class="progress"><span id="progress-open"></span></div></div></section>
 <div class="section-head"><h2>项目任务 <span id="visible-count" class="overline"></span></h2><div class="segmented" role="group" aria-label="切换任务视图"><button data-view="list" aria-pressed="true"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <rect x="3" y="4" width="6" height="6" rx="1" /></svg><span>列表</span></button><button data-view="board" aria-pressed="false"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1" />
  <rect width="7" height="7" x="14" y="3" rx="1" />
  <rect width="7" height="7" x="14" y="14" rx="1" />
  <rect width="7" height="7" x="3" y="14" rx="1" /></svg><span>看板</span></button></div></div>
 <section class="task-panel" aria-label="任务内容"><div class="task-toolbar"><input class="search" id="task-search" type="search" placeholder="筛选任务…" aria-label="搜索任务"><button type="button" class="filter" id="only-open" aria-pressed="false"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg><span>仅未完成</span></button></div><div id="task-list"></div><div class="board" id="task-board" hidden></div></section>
 </main>
 <aside class="inspector" aria-label="样式调节"><h2>外观调节 / 设计 Token</h2><div class="field"><label for="theme">界面主题</label><select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></div><div class="field"><span id="accent-label" style="color:var(--muted);font-size:11px">强调色</span><div class="swatches" role="group" aria-labelledby="accent-label"><button data-accent="indigo" aria-label="蓝紫" aria-pressed="true" style="--swatch:#5362ce"></button><button data-accent="teal" aria-label="蓝绿" aria-pressed="false" style="--swatch:#18776e"></button><button data-accent="rose" aria-label="玫红" aria-pressed="false" style="--swatch:#a83a64"></button><button data-accent="graphite" aria-label="石墨" aria-pressed="false" style="--swatch:#54534f"></button></div></div><div class="field"><label for="density">信息密度</label><select id="density"><option value="comfortable">标准</option><option value="compact">紧凑</option></select></div><div class="field"><label for="radius">圆角 <output id="radius-output">10px</output></label><input type="range" id="radius" min="2" max="18" value="10"></div><p class="hint">调参仅作用于当前页面。要永久修改，请直接调整本 Demo 文件顶部的 CSS 变量。设计来源：gr8r-studio-ui。</p></aside>
</div>
<dialog id="create-dialog" aria-label="创建任务"><form id="task-form" method="dialog"><h2>新建任务</h2><label>任务名称<input id="task-title" name="title" maxlength="90" autocomplete="off" required placeholder="例如：复核表单焦点状态"></label><label>优先级<select name="priority"><option value="普通">普通</option><option value="重要">重要</option></select></label><div class="dialog-actions"><button type="button" class="secondary" id="cancel-task"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" />
  <path d="m6 6 12 12" /></svg><span>取消</span></button><button type="submit" class="primary"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" />
  <path d="M12 5v14" /></svg><span>添加任务</span></button></div></form></dialog>
<div class="toast" role="status" id="toast" aria-live="polite"></div>
<script>
/* TUNING: 数据、状态切换与交互逻辑均在本文件；不依赖任何框架或外部 API。 */
const taskSeed=[
{id:1,title:'完成任务卡片的紧凑模式',priority:'重要',done:false},
{id:2,title:'检查输入框与键盘焦点',priority:'普通',done:true},
{id:3,title:'调整暗色主题的文字对比',priority:'重要',done:false},
{id:4,title:'整理组件 API 与示例文案',priority:'普通',done:false},
{id:5,title:'复核移动端视图状态',priority:'普通',done:true}
];
let tasks=taskSeed.map(item=>({...item})),nextId=6,view='list',onlyOpen=false,toastTimer;
const $=id=>document.getElementById(id);
function notice(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function visibleTasks(){const query=$('task-search').value.trim().toLocaleLowerCase();return tasks.filter(item=>(!onlyOpen||!item.done)&&(!query||item.title.toLocaleLowerCase().includes(query)))}
function badge(priority){const el=document.createElement('span');el.className='tag'+(priority==='重要'?' high':'');el.textContent=priority;return el}
function drawList(items){const root=$('task-list');root.replaceChildren();if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='没有符合条件的任务，可尝试调整筛选。';root.append(p);return}for(const item of items){const row=document.createElement('label');row.className='task-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=item.done;cb.dataset.id=String(item.id);cb.setAttribute('aria-label','完成：'+item.title);const title=document.createElement('span');title.className='task-title'+(item.done?' done':'');title.textContent=item.title;row.append(cb,title,badge(item.priority));root.append(row)}}
function drawBoard(items){const root=$('task-board');root.replaceChildren();for(const [done,title] of [[false,'待处理'],[true,'已完成']]){const col=document.createElement('section');col.className='board-col';const head=document.createElement('h3');head.textContent=title+' · '+items.filter(t=>t.done===done).length;col.append(head);for(const item of items.filter(t=>t.done===done)){const card=document.createElement('div');card.className='board-item';const text=document.createElement('strong');text.textContent=item.title;const meta=document.createElement('small');meta.textContent=item.priority;const button=document.createElement('button');button.type='button';button.dataset.toggle=String(item.id);button.textContent=done?'设为未完成':'标记已完成';card.append(text,meta,button);col.append(card)}root.append(col)}}
function render(){const items=visibleTasks(),done=tasks.filter(x=>x.done).length,open=tasks.length-done;$('count-all').textContent=String(tasks.length);$('count-done').textContent=String(done);$('count-open').textContent=String(open);$('visible-count').textContent='('+items.length+')';for(const [key,count] of [['all',tasks.length],['done',done],['open',open]])$('progress-'+key).style.width=(tasks.length?Math.round(count/tasks.length*100):0)+'%';$('task-list').hidden=view!=='list';$('task-board').hidden=view!=='board';if(view==='list')drawList(items);else drawBoard(items);$('only-open').setAttribute('aria-pressed',String(onlyOpen));}
function toggle(id){const item=tasks.find(t=>t.id===id);if(!item)return;item.done=!item.done;render();notice(item.done?'任务已完成':'任务已恢复')}
$('task-list').addEventListener('change',event=>{const id=Number(event.target.dataset.id);if(id)toggle(id)});
$('task-board').addEventListener('click',event=>{const id=Number(event.target.dataset.toggle);if(id)toggle(id)});
$('task-search').addEventListener('input',render);$('only-open').addEventListener('click',()=>{onlyOpen=!onlyOpen;render()});$('nav-focus').addEventListener('click',()=>{onlyOpen=true;render();$('task-search').focus()});
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render()}));
const dialog=$('create-dialog');function openDialog(){dialog.showModal();$('task-title').focus()}$('new-task').addEventListener('click',openDialog);$('nav-create').addEventListener('click',openDialog);$('cancel-task').addEventListener('click',()=>dialog.close());
$('task-form').addEventListener('submit',event=>{event.preventDefault();const title=$('task-title').value.trim();if(!title){$('task-title').focus();return}tasks.unshift({id:nextId++,title,priority:document.querySelector('[name="priority"]').value,done:false});dialog.close();event.currentTarget.reset();onlyOpen=false;render();notice('已新增任务')});
$('theme').addEventListener('change',event=>document.body.dataset.theme=event.target.value);
$('density').addEventListener('change',event=>document.body.dataset.density=event.target.value);
document.querySelectorAll('[data-accent]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.accent=button.dataset.accent;document.querySelectorAll('[data-accent]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
$('radius').addEventListener('input',event=>{const value=Number(event.target.value);document.documentElement.style.setProperty('--radius',value+'px');$('radius-output').textContent=value+'px'});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('task-search').focus()}});
render();
</script>
</body></html>
