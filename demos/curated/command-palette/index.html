<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Palette · UI Vault</title>
<!--
  Command Palette · UI Vault 手工精选实验（demos/curated）
  设计参考：https://codedvisuals.com/visuals/search/command-palette
  仅参考视觉结构与交互方式，未复制或移植原站源码；图标路径来自 Lucide（ISC）。
  单文件、无外部请求：字体走系统栈，全部资源内联。
  v2：模糊匹配+排序+命中高亮、滑动高亮块、键鼠模式分离、全局快捷键、最近使用、执行反馈。
-->
<style>
/* TUNING · codedvisuals Command Palette 的独立实现（v2 可用版）。
   尺寸：面板 336px 宽 / 圆角 22-18-8 / 内边距 6-11-12；列表固定 229px 高，过滤时面板不跳动。
   主题令牌：--card --muted --accent --border --primary --muted-foreground --mark，深浅两套（html.dark）。
   匹配：前缀 100 > 词首 80 > 包含 60 > 子序列 40-跨度；多词加权求和，关键词/组名命中记 30。
   交互：输入即时过滤、↑↓/PgUp·PgDn/Ctrl+N·P 移动、↵ 派发 palette:select、Esc 先清空再失焦、
        ⌘/Ctrl+K 聚焦、⌘/Ctrl+⇧+字母 直接执行、pointermove 接管高亮。
   动效：滑动高亮块 160ms、行内 120ms、光晕仅在聚焦时旋转；prefers-reduced-motion 下全部归零。 */
:root{
  --background:oklch(100% 0 0);
  --foreground:oklch(14.5% 0 0);
  --card:oklch(100% 0 0);
  --primary:oklch(20.5% 0 0);
  --primary-foreground:oklch(98.5% 0 0);
  --muted:oklch(97% 0 0);
  --muted-foreground:oklch(52.6% 0 0);
  --accent:oklch(96% 0 0);
  --border:oklch(92.2% 0 0);
  --mark:oklch(62.3% .214 259.815);
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-lg:0 12px 32px -12px rgb(0 0 0 / .18);

  --red-500:oklch(63.7% .237 25.331);
  --orange-500:oklch(70.5% .213 47.604);
  --yellow-500:oklch(79.5% .184 86.047);
  --green-500:oklch(72.3% .219 149.579);
  --blue-500:oklch(62.3% .214 259.815);
  --indigo-500:oklch(58.5% .233 277.117);
  --violet-500:oklch(60.6% .25 292.717);

  --ease:cubic-bezier(.2,.8,.2,1);
  --font-sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
html.dark{
  color-scheme:dark;
  --background:#0a0a0a;
  --foreground:#fafafa;
  --card:#0f0f0f;
  --primary:#fafafa;
  --primary-foreground:#0a0a0a;
  --muted:#171717;
  --muted-foreground:#a1a1a1;
  --accent:#1c1c1c;
  --border:rgba(255,255,255,.1);
  --mark:oklch(75% .15 259.815);
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .4);
  --shadow-lg:0 16px 40px -12px rgb(0 0 0 / .7);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;display:grid;place-items:center;
  background:var(--background);color:var(--foreground);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

.pal{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 24px}

/* 面板 */
.panel{
  --panel-width:336px;
  position:relative;display:flex;flex-direction:column;gap:6px;
  width:var(--panel-width);max-width:calc(100vw - 48px);
  border-radius:22px;padding:6px;
  border:1px solid color-mix(in oklab,var(--border) 50%,transparent);
  background:color-mix(in oklab,var(--muted) 75%,transparent);
  box-shadow:var(--shadow-lg);
}

/* 搜索行 */
.field{
  position:relative;display:flex;align-items:center;gap:8px;
  border-radius:16px;border:1px solid var(--border);
  background:var(--card);padding:11px 12px;box-shadow:var(--shadow-xs);
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.field:focus-within{
  border-color:color-mix(in oklab,var(--foreground) 18%,var(--border));
  box-shadow:var(--shadow-xs),0 0 0 3px color-mix(in oklab,var(--foreground) 5%,transparent);
}
.ico-search{width:14px;height:14px;flex-shrink:0;color:var(--muted-foreground);transition:color .15s}
.field:focus-within .ico-search{color:var(--foreground)}

.q{
  min-width:0;flex:1;width:100%;border:0;outline:0;background:transparent;padding:0;margin:0;
  font-family:inherit;font-size:12px;line-height:16px;font-weight:500;
  color:var(--foreground);caret-color:var(--primary);-webkit-appearance:none;appearance:none;
}
.q::placeholder{color:var(--muted-foreground);opacity:1}

.clear{
  display:none;width:16px;height:16px;flex-shrink:0;align-items:center;justify-content:center;
  border:0;padding:0;border-radius:999px;cursor:pointer;
  background:color-mix(in oklab,var(--foreground) 10%,transparent);color:var(--muted-foreground);
}
.clear svg{width:9px;height:9px}
.clear:hover{color:var(--foreground);background:color-mix(in oklab,var(--foreground) 16%,transparent)}
.field.has-value .clear{display:flex}

.count{
  display:flex;height:16px;min-width:16px;align-items:center;justify-content:center;
  border-radius:999px;padding:0 5px;
  background:color-mix(in oklab,var(--primary) 10%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--primary) 15%,transparent);
  font-size:9px;line-height:1;font-weight:600;color:var(--primary);
  font-variant-numeric:tabular-nums;transition:opacity .15s;
}
.count.zero{opacity:.45}
html.dark .count{background:var(--primary);color:var(--primary-foreground);box-shadow:none}

/* 光晕 + 压暗 */
.body{position:relative}
.glow{
  position:absolute;left:-1px;right:-1px;bottom:-6px;height:80px;
  border-radius:9999px 9999px 12px 12px;
  background:linear-gradient(to right,var(--red-500),var(--orange-500),var(--yellow-500),
    var(--green-500),var(--blue-500),var(--indigo-500),var(--violet-500),var(--red-500));
  background-size:200% 100%;
  filter:blur(5px);opacity:.35;
  transition:opacity .4s var(--ease),filter .4s var(--ease);
  animation:hue 8s linear infinite;animation-play-state:paused;
}
.panel:focus-within .glow{opacity:.65;filter:blur(6px);animation-play-state:running}
.panel.flash .glow{opacity:.95;filter:blur(8px)}
@keyframes hue{to{background-position:-200% 0}}

.veil{
  position:absolute;left:-6px;right:-6px;bottom:-6px;height:64px;
  border-radius:0 0 22px 22px;
  background:color-mix(in oklab,var(--background) 75%,transparent);
  -webkit-mask-image:linear-gradient(to top,#000 50%,transparent);
  mask-image:linear-gradient(to top,#000 50%,transparent);
}

.listcard{position:relative;border-radius:16px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-xs);overflow:hidden}
.list{
  position:relative;display:flex;flex-direction:column;padding:4px 0 6px;
  height:229px;overflow-y:auto;overscroll-behavior:contain;scroll-padding:6px;
}
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{
  background:color-mix(in oklab,var(--foreground) 12%,transparent);
  border-radius:999px;border:3px solid var(--card);background-clip:padding-box;
}

/* 单个滑动高亮块 */
.hl{
  position:absolute;left:6px;right:6px;top:0;height:0;border-radius:8px;pointer-events:none;
  background:var(--accent);box-shadow:inset 0 0 0 1px var(--border);
  opacity:0;transition:transform .16s var(--ease),height .16s var(--ease),opacity .12s;
}
.hl.show{opacity:1}
.hl.instant{transition:opacity .12s}

.group{display:flex;flex-direction:column}
.glabel{
  padding:8px 14px 4px;font-size:9px;line-height:1.5;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted-foreground);
}

.item{
  position:relative;margin:0 6px;display:flex;align-items:center;gap:10px;
  border-radius:8px;padding:6px 8px;text-align:left;
  background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none;outline:0;
  transition:transform .1s var(--ease);
}
.item:active,.item.press{transform:scale(.985)}

.ibox{
  display:flex;width:22px;height:22px;flex-shrink:0;align-items:center;justify-content:center;
  border-radius:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted-foreground);box-shadow:var(--shadow-xs);transition:color .12s;
}
.ibox svg{width:12px;height:12px}
.item.on .ibox{color:var(--foreground)}

.label{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;line-height:16px;font-weight:500;color:var(--foreground)}
.label mark{background:none;color:var(--mark);font-weight:650}
.alias{margin-left:6px;font-size:10px;color:var(--muted-foreground);font-weight:400}

.keys{display:flex;flex-shrink:0;align-items:center;gap:3px;transition:opacity .12s}
kbd{
  display:inline-flex;height:18px;min-width:18px;align-items:center;justify-content:center;
  border-radius:5px;border:1px solid var(--border);border-bottom-width:2px;background:var(--muted);
  padding:0 4px;font-family:inherit;font-size:9px;line-height:1;font-weight:500;
  color:var(--muted-foreground);
}
.enter{display:flex;width:12px;flex-shrink:0;align-items:center;justify-content:center;
  color:var(--primary);opacity:0;transform:translateX(-3px);transition:opacity .12s,transform .16s var(--ease)}
.enter svg{width:12px;height:12px}
.item.on .enter{opacity:1;transform:none}

/* 空态 */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:0 16px;text-align:center;font-size:11px;line-height:16px;color:var(--muted-foreground)}
.empty b{color:var(--foreground);font-weight:600;word-break:break-all}
.empty span{font-size:10px;opacity:.75}

/* 底栏 */
.footer{display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--border);padding:8px 12px;background:color-mix(in oklab,var(--muted) 40%,var(--card))}
.fkeys{display:flex;align-items:center;gap:10px}
.fkey{display:flex;align-items:center;gap:4px}
.fkey>span{font-size:9px;color:var(--muted-foreground)}

/* 执行反馈 */
.toast{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;
  border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-xs);
  font-size:11px;color:var(--muted-foreground);
  opacity:0;transform:translateY(-4px);transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.toast.show{opacity:1;transform:none}
.toast b{color:var(--foreground);font-weight:600}
.toast i{width:6px;height:6px;border-radius:50%;background:var(--green-500);font-style:normal}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation:none !important}
}
</style>
</head>
<body>

<div class="pal">
  <div class="panel" id="panel">
    <div class="field" id="field">
      <svg class="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
      <input id="q" class="q" type="text" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" aria-activedescendant="" placeholder="Search commands…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search commands">
      <button class="clear" id="clear" type="button" aria-label="Clear search" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
      <span class="count" id="count" aria-hidden="true">0</span>
    </div>

    <div class="body">
      <div class="glow"></div>
      <div class="veil"></div>
      <div class="listcard">
        <div class="list" id="list" role="listbox" aria-label="Commands"></div>
        <div class="footer">
          <div class="fkeys">
            <span class="fkey"><kbd>↑</kbd><kbd>↓</kbd><span>Navigate</span></span>
            <span class="fkey"><kbd>↵</kbd><span>Select</span></span>
          </div>
          <span class="fkey"><kbd id="kHint">⌘K</kbd><span>Focus</span><kbd>esc</kbd><span id="escLabel">Close</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
(function(){ "use strict"; try {
/* 主题：跟随系统并实时响应 */
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const applyTheme = () => document.documentElement.classList.toggle('dark', !!(mq && mq.matches));
applyTheme(); if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';

/* ============ 数据：换命令只改这里 ============ */
const ICONS = {
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  fileText:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  userPlus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  rocket:'<path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/><path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/>',
  settings:'<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>',
  enter:'<path d="M20 4v7a4 4 0 0 1-4 4H4"/><path d="m9 10-5 5 5 5"/>'
};

/* key：全局快捷键字母（配合 ⌘/Ctrl+Shift，避免与浏览器 ⌘N/⌘D 冲突） */
const COMMANDS = [
  { id:'project',  group:'Actions', icon:'plus',     label:'New project',        key:'P', keywords:'create new project 新建 项目' },
  { id:'doc',      group:'Actions', icon:'fileText', label:'New document',       key:'D', keywords:'create file doc 新建 文档 文件' },
  { id:'invite',   group:'Actions', icon:'userPlus', label:'Invite teammate',    key:'I', keywords:'add member invite 邀请 成员 同事' },
  { id:'launch',   group:'Recent',  icon:'rocket',   label:'Launch checklist',             keywords:'release checklist go live 上线 清单' },
  { id:'settings', group:'Recent',  icon:'settings', label:'Workspace settings',           keywords:'preferences config 设置 工作区' }
];
const GROUP_ORDER = ['Actions','Recent'];

/* ============ 匹配：前缀 > 词首 > 包含 > 子序列，返回分数与命中位置 ============ */
function scoreText(text, t) {
  const s = text.toLowerCase();
  const at = s.indexOf(t);
  if (at === 0) return { score: 100, hits: range(0, t.length) };
  if (at > 0) {
    const wordStart = /[\s\-_/]/.test(s[at - 1]);
    return { score: wordStart ? 80 : 60, hits: range(at, t.length) };
  }
  // 子序列（如 "nwp" → New project）
  const hits = []; let j = 0;
  for (let i = 0; i < s.length && j < t.length; i++) if (s[i] === t[j]) { hits.push(i); j++; }
  if (j === t.length && t.length > 1) {
    const spread = hits[hits.length - 1] - hits[0];
    return { score: Math.max(10, 40 - spread), hits };
  }
  return null;
}
const range = (a, n) => Array.from({ length: n }, (_, k) => a + k);

function matchCmd(cmd, tokens) {
  let total = 0; const hits = new Set(); let viaAlias = false;
  for (const t of tokens) {
    const onLabel = scoreText(cmd.label, t);
    if (onLabel) { total += onLabel.score; onLabel.hits.forEach(h => hits.add(h)); continue; }
    const onKw = (cmd.keywords + ' ' + cmd.group).toLowerCase().includes(t);
    if (onKw) { total += 30; viaAlias = true; continue; }
    return null;
  }
  return { score: total, hits, viaAlias };
}

/* ============ 状态 ============ */
const $ = id => document.getElementById(id);
const input = $('q'), listEl = $('list'), countEl = $('count'), field = $('field'),
      panel = $('panel'), toast = $('toast'), live = $('live');
const hl = document.createElement('div'); hl.className = 'hl';

let rows = [];         // [{cmd, hits, viaAlias}]
let active = 0;
let mode = 'key';      // 'key' | 'pointer'：键盘移动时屏蔽滚动导致的误悬停
const store = { get(){ try { return JSON.parse(sessionStorage.getItem('pal:recent') || '[]'); } catch { return []; } },
                set(v){ try { sessionStorage.setItem('pal:recent', JSON.stringify(v)); } catch {} } };
let recent = store.get();

$('kHint').textContent = MOD + (IS_MAC ? 'K' : '+K');

function compute(query) {
  const tokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length) {
    // 无查询：最近使用的命令排在 Recent 组前列
    return COMMANDS.map(cmd => ({ cmd, hits: new Set(), viaAlias: false }))
      .sort((a, b) => GROUP_ORDER.indexOf(a.cmd.group) - GROUP_ORDER.indexOf(b.cmd.group) ||
        rank(a.cmd) - rank(b.cmd));
  }
  return COMMANDS.map(cmd => ({ cmd, ...matchCmd(cmd, tokens) }))
    .filter(r => r.score != null)
    .sort((a, b) => b.score - a.score || rank(a.cmd) - rank(b.cmd));
}
const rank = cmd => { const r = recent.indexOf(cmd.id); return r < 0 ? 99 : r; };

function highlight(label, hits) {
  let out = '', open = false;
  [...label].forEach((ch, i) => {
    const h = hits.has(i);
    if (h && !open) { out += '<mark>'; open = true; }
    if (!h && open) { out += '</mark>'; open = false; }
    out += ch.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  });
  return out + (open ? '</mark>' : '');
}

const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

function render(query) {
  const q = query.trim();
  rows = compute(query);
  // 有查询时按相关度扁平排序后再按出现顺序分组，最佳结果永远在第一位
  active = 0;
  field.classList.toggle('has-value', !!query);
  countEl.textContent = rows.length;
  countEl.classList.toggle('zero', !rows.length);
  listEl.innerHTML = '';
  listEl.appendChild(hl);
  listEl.scrollTop = 0;

  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'empty'; empty.setAttribute('role', 'status');
    empty.innerHTML = '<div>No results for <b></b></div><span>Try another keyword, or press esc to clear</span>';
    empty.querySelector('b').textContent = '“' + q + '”';
    listEl.appendChild(empty);
    input.setAttribute('aria-activedescendant', '');
    hl.classList.remove('show');
    live.textContent = 'No commands found';
    return;
  }

  const groups = new Map();
  rows.forEach((r, i) => {
    if (!groups.has(r.cmd.group)) groups.set(r.cmd.group, []);
    groups.get(r.cmd.group).push({ ...r, i });
  });
  // 有查询时组顺序跟随最高分；无查询时用固定顺序
  // 下标需要按视觉顺序重排，保证 ↑↓ 与所见一致
  const flat = [];
  groups.forEach((list, g) => {
    const wrap = document.createElement('div');
    wrap.className = 'group'; wrap.setAttribute('role', 'group');
    const gid = 'g-' + g; wrap.setAttribute('aria-labelledby', gid);
    wrap.innerHTML = `<span class="glabel" id="${gid}">${g}</span>`;
    list.forEach(r => {
      const idx = flat.length; flat.push(r);
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'item'; btn.id = 'opt-' + idx;
      btn.tabIndex = -1; btn.dataset.i = idx;
      btn.setAttribute('role', 'option'); btn.setAttribute('aria-selected', 'false');
      const keys = r.cmd.key
        ? `<span class="keys" aria-hidden="true"><kbd>${MOD}</kbd><kbd>⇧</kbd><kbd>${r.cmd.key}</kbd></span>` : '';
      const alias = r.viaAlias ? `<span class="alias">· ${r.cmd.keywords.split(' ').find(w => /[^\x00-\x7f]/.test(w) && q.toLowerCase().split(/\s+/).some(t => w.includes(t))) || 'alias'}</span>` : '';
      btn.innerHTML = `<span class="ibox">${svg(r.cmd.icon)}</span>
        <span class="label">${highlight(r.cmd.label, r.hits)}${alias}</span>${keys}
        <span class="enter">${svg('enter')}</span>`;
      wrap.appendChild(btn);
    });
    listEl.appendChild(wrap);
  });
  rows = flat;
  live.textContent = rows.length + (rows.length === 1 ? ' command' : ' commands');
  paint(false, true);
}

const items = () => [...listEl.querySelectorAll('.item')];

function paint(scroll, instant) {
  let cur = null;
  items().forEach(el => {
    const on = Number(el.dataset.i) === active;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', String(on));
    if (on) cur = el;
  });
  if (!cur) { hl.classList.remove('show'); return; }
  hl.classList.toggle('instant', !!instant);
  hl.style.transform = `translateY(${cur.offsetTop}px)`;
  hl.style.height = cur.offsetHeight + 'px';
  hl.classList.add('show');
  input.setAttribute('aria-activedescendant', cur.id);
  if (scroll) { const t = cur.offsetTop, b = t + cur.offsetHeight; if (t < listEl.scrollTop) listEl.scrollTop = t - 6; else if (b > listEl.scrollTop + listEl.clientHeight) listEl.scrollTop = b - listEl.clientHeight + 6; }
  // 刚到顶时把组标题也滚进来
  if (scroll && active === 0) listEl.scrollTop = 0;
}

function move(step, clamp) {
  if (!rows.length) return;
  mode = 'key';
  const n = rows.length;
  active = clamp ? Math.min(n - 1, Math.max(0, active + step)) : (active + step + n) % n;
  paint(true);
}

let toastTimer;
function select(i) {
  const r = rows[i]; if (!r) return;
  const cmd = r.cmd;
  recent = [cmd.id, ...recent.filter(x => x !== cmd.id)].slice(0, 5);
  store.set(recent);

  const el = listEl.querySelector(`[data-i="${i}"]`);
  el?.classList.add('press'); setTimeout(() => el?.classList.remove('press'), 120);
  panel.classList.add('flash'); setTimeout(() => panel.classList.remove('flash'), 260);
  toast.innerHTML = '<i></i>Ran <b></b>';
  toast.querySelector('b').textContent = cmd.label;
  toast.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);

  input.dispatchEvent(new CustomEvent('palette:select', {
    bubbles: true, detail: { item: cmd, index: i, label: cmd.label, group: cmd.group, query: input.value }
  }));
  if (typeof window.onPaletteSelect === 'function') window.onPaletteSelect(cmd);
}

/* 输入（输入法组词期间不刷新，结束后统一刷新） */
input.addEventListener('input', e => { if (!e.isComposing) render(input.value); });
input.addEventListener('compositionend', () => render(input.value));
const syncEsc = () => $('escLabel').textContent = input.value ? 'Clear' : 'Close';
input.addEventListener('input', syncEsc);

$('clear').addEventListener('click', () => { input.value = ''; render(''); syncEsc(); input.focus(); });

input.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const ctrl = e.ctrlKey && !e.metaKey && !e.altKey;
  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); move(1); break;
    case 'ArrowUp':   e.preventDefault(); move(-1); break;
    case 'PageDown':  e.preventDefault(); move(4, true); break;
    case 'PageUp':    e.preventDefault(); move(-4, true); break;
    case 'Home': if (ctrl) { e.preventDefault(); move(-rows.length, true); } break;
    case 'End':  if (ctrl) { e.preventDefault(); move(rows.length, true); } break;
    case 'Tab':  if (rows.length) { e.preventDefault(); move(e.shiftKey ? -1 : 1); } break;
    case 'Enter': e.preventDefault(); select(active); break;
    case 'Escape':
      e.preventDefault();
      if (input.value) { input.value = ''; render(''); syncEsc(); } else input.blur();
      break;
    case 'n': case 'j': if (ctrl) { e.preventDefault(); move(1); } break;
    case 'p': case 'k': if (ctrl) { e.preventDefault(); move(-1); } break;
  }
});

/* 鼠标：只有真正移动指针才接管高亮 */
let lastPt = '';
listEl.addEventListener('pointermove', e => {
  const pt = e.clientX + ',' + e.clientY;
  if (pt === lastPt) return; lastPt = pt;
  mode = 'pointer';
  const row = e.target.closest('.item'); if (!row) return;
  const i = Number(row.dataset.i);
  if (i !== active) { active = i; paint(false); }
});
listEl.addEventListener('pointerdown', e => { if (e.target.closest('.item')) e.preventDefault(); }); // 保持输入框焦点
listEl.addEventListener('click', e => {
  const row = e.target.closest('.item');
  if (row) select(Number(row.dataset.i));
});

/* 全局快捷键：⌘/Ctrl+K 聚焦，⌘/Ctrl+⇧+字母 直接执行 */
document.addEventListener('keydown', e => {
  const mod = IS_MAC ? e.metaKey : e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 'k' && !e.shiftKey) { e.preventDefault(); input.focus(); input.select(); return; }
  if (e.shiftKey) {
    const cmd = COMMANDS.find(c => c.key && c.key.toLowerCase() === k);
    if (cmd) {
      e.preventDefault();
      if (input.value) { input.value = ''; render(''); syncEsc(); }
      const i = rows.findIndex(r => r.cmd === cmd);
      if (i < 0) return;
      active = i; paint(true); select(i);
    }
  }
});

addEventListener('resize', () => paint(false, true));

render('');
try { input.focus({ preventScroll: true }); } catch (_) {}
} catch (err) { console.warn("[palette]", err); }
})();
</script>


</body></html>
