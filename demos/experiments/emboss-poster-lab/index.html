<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11131a" />
  <meta name="description" content="Emboss Lab — 可交互的纸面压印、雕刻文字和渐变光照效果实验。" />
  <title>Emboss Lab — 触感海报实验室</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --depth: 1;
      --grain-opacity: .37;
      --light-opacity: .40;
      --scene-w: 1676;
      --scene-h: 2048;
      --ink: rgba(32, 21, 53, .26);
      --stroke: rgba(27, 19, 48, .29);
      --shadow: rgba(21, 12, 32, .48);
      --shine: rgba(255,255,255,.41);
      --label-color: #a3a4b3;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background: #11131a; color:#f6f4ff; overflow-x:hidden; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:2px solid #b7abe7; outline-offset:4px; }
    .app { min-height:100vh; display:flex; flex-direction:column; }
    .topbar { width:100%; display:flex; align-items:center; justify-content:space-between; padding:22px clamp(22px,4vw,65px) 14px; gap:16px; position:relative; z-index:5; }
    .brand {display:flex; align-items:center; gap:12px; color:#e8e7f1; text-decoration:none; font-weight:650; font-size:13px; letter-spacing:.14em; white-space:nowrap;}
    .brand-mark {width:27px; height:27px; border:1px solid #9797a3; display:grid; place-items:center; position:relative; overflow:hidden; transform:rotate(-12deg);}
    .brand-mark::before {content:""; width:14px; height:14px; border:3px solid #ebedf6; border-radius:50%; box-shadow:3px 3px 0 #777887;}
    .brand-mark::after {content:""; position:absolute; width:2px; height:22px; background:#e6e5f0; left:12px; top:2px; transform:rotate(45deg);}
    .header-mid {color:#777c8d; font:500 10px/1.4 ui-monospace,"SFMono-Regular",Consolas,monospace; letter-spacing:.17em;}
    .top-actions {display:flex; gap:8px; align-items:center;}
    .icon-button {height:36px; min-width:36px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 11px; border:1px solid #343641; color:#c5c8d5; background:rgba(255,255,255,.035); border-radius:8px; transition:.2s ease;}
    .icon-button:hover {background:#292c39; border-color:#5b5d70;color:white;}
    .icon-button svg {width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .icon-button .button-label {font-size:11px;letter-spacing:.08em;}
    main { width:100%; flex:1; display:flex; align-items:center; justify-content:center; padding:5px 24px 18px; }
    .workspace {display:grid; grid-template-columns:minmax(0,auto) 250px; align-items:center; gap:clamp(26px,5vw,80px); max-width:1130px; width:100%; justify-content:center; }
    .stage-shell {position:relative; display:flex; justify-content:center;align-items:center; min-width:0;}
    .poster {
      width:min(660px, calc((100dvh - 138px)*.81836), calc(100vw - 350px));
      aspect-ratio:1676/2048; position:relative; isolation:isolate; overflow:hidden;
      background: #8d84ab; border-radius:2px; box-shadow: 0 20px 70px rgba(0,0,0,.38), 0 0 0 1px rgba(255,255,255,.085);
      cursor:crosshair; transition:background .55s ease, box-shadow .4s ease;
      --bg: radial-gradient(ellipse 90% 58% at 85% 0%,#b7acd9 0%,transparent 77%),linear-gradient(163deg,#918bb7 0%,#85768d 45%,#755d61 65%,#493a2e 100%);
      background-image:var(--bg);
    }
    .poster[data-scene="0"] { --ink:rgba(48,34,51,.30); --stroke:rgba(45,31,48,.35); --shadow:rgba(40,27,40,.50); --shine:rgba(231,220,251,.48); --bg:radial-gradient(ellipse 82% 55% at 77% 1%,rgba(200,194,238,.68),transparent 83%),radial-gradient(ellipse 76% 61% at 4% 36%,rgba(184,170,205,.22),transparent 88%),linear-gradient(163deg,#9290bd 0%,#8c84ae 34%,#77636e 62%,#4e3c30 100%); }
    .poster[data-scene="1"] { --ink:rgba(17,52,32,.31); --stroke:rgba(13,48,30,.39); --shadow:rgba(9,37,21,.50); --shine:rgba(192,238,202,.38); --bg:radial-gradient(ellipse 96% 58% at 62% -10%,rgba(155,217,178,.66),transparent 92%),linear-gradient(177deg,#76b48d 0%,#54976c 34%,#376c4a 57%,#152819 90%,#0e1d14 100%); }
    .poster[data-scene="2"] { --ink:rgba(75,42,112,.28); --stroke:rgba(77,47,106,.32); --shadow:rgba(71,36,108,.46); --shine:rgba(249,229,255,.49); --bg:radial-gradient(ellipse 89% 63% at 83% 4%,rgba(234,212,255,.80),transparent 87%),linear-gradient(177deg,#c5a9ed 0%,#b99be6 36%,#a582db 70%,#8b64c7 100%); }
    .poster[data-scene="3"] { --ink:rgba(29,29,29,.29); --stroke:rgba(33,33,33,.34); --shadow:rgba(17,17,17,.47); --shine:rgba(250,250,250,.36); --bg:radial-gradient(ellipse 110% 85% at 39% -15%,rgba(217,217,217,.29),transparent 78%),linear-gradient(177deg,#8e8e8e 0%,#777777 45%,#626262 100%); }
    .poster[data-scene="4"] { --ink:rgba(61,27,111,.34); --stroke:rgba(56,18,104,.39); --shadow:rgba(39,15,82,.5); --shine:rgba(227,199,255,.49); --bg:radial-gradient(ellipse 87% 56% at 79% 1%,rgba(209,185,255,.34),transparent 85%),linear-gradient(172deg,#976ede 0%,#9660d5 37%,#8246c3 62%,#4c2082 100%); }
    .poster::before {content:""; position:absolute; z-index:2; inset:0; pointer-events:none; background-image:url("assets/grain.svg"); background-size:240px 240px; opacity:var(--grain-opacity); mix-blend-mode:soft-light;}
    .poster::after {content:""; position:absolute; z-index:3; inset:0; pointer-events:none; background:radial-gradient(circle 350px at var(--mouse-x, 72%) var(--mouse-y, 12%),rgba(255,255,255,.28),rgba(255,255,255,.055) 48%,transparent 82%); opacity:var(--light-opacity); mix-blend-mode:soft-light; transition:opacity .2s;}
    .scene {position:absolute; z-index:1; width:100%;height:100%;inset:0; opacity:0; transform:scale(1.005); pointer-events:none; transition: opacity .42s ease, transform .7s cubic-bezier(.2,.8,.2,1);}
    .scene.is-active {opacity:1;transform:scale(1);pointer-events:auto;}
    .scene svg {width:100%;height:100%;display:block;overflow:visible;}
    .imprint {fill:none;stroke:var(--stroke); stroke-width:1.3;stroke-linejoin:miter;stroke-linecap:square; filter:drop-shadow(calc(1px * var(--depth)) calc(1.2px * var(--depth)) .3px var(--shine)) drop-shadow(calc(-.8px * var(--depth)) calc(-.9px * var(--depth)) .35px var(--shadow));}
    .imprint-bold {stroke-width:2.05;}
    .type {fill:var(--ink);font-family:Arial,Helvetica,sans-serif;font-weight:400;filter:drop-shadow(calc(1px * var(--depth)) calc(1.1px * var(--depth)) .42px var(--shine)) drop-shadow(calc(-.9px * var(--depth)) calc(-.8px * var(--depth)) .4px var(--shadow));}
    .type-tech {font-family:"Courier New",Courier,monospace; font-size:27px;letter-spacing:-1.2px;}
    .type-small {font-size:19px;letter-spacing:-.5px;}
    .type-micro {font-family:Consolas,"Courier New",monospace;font-size:13px;letter-spacing:-.8px;}
    .type-display {font-family:"Arial Narrow","Bahnschrift",Arial,sans-serif;font-weight:700;letter-spacing:-1.8px;}
    .wordmark {fill:none;stroke:var(--stroke);stroke-width:5.0;stroke-linecap:square;stroke-linejoin:bevel;filter:drop-shadow(calc(1.4px * var(--depth)) calc(1.6px * var(--depth)) .75px var(--shine)) drop-shadow(calc(-1px * var(--depth)) calc(-1.1px * var(--depth)) .6px var(--shadow));}
    .tiny {opacity:.78;}
    .poster-index {position:absolute; z-index:4; left:16px; bottom:14px; color:rgba(255,255,255,.12); font:500 9px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.08em; pointer-events:none;}
    .studio-sidebar {height:100%; align-self:center; display:flex; flex-direction:column; justify-content:center; max-width:250px; min-width:220px; gap:33px;}
    .section-kicker {font:600 10px/1.3 ui-monospace,Consolas,monospace; color:#828699; letter-spacing:.2em; text-transform:uppercase;margin:0 0 10px;}
    .sidebar-heading {font-size:31px;line-height:1.16;letter-spacing:-.055em;font-weight:620;margin:0;max-width:240px;}
    .sidebar-description {color:#989baa;font-size:12.5px;line-height:1.86;margin:13px 0 0;max-width:236px;}
    .scene-menu {display:flex;flex-direction:column;gap:7px;}
    .scene-select {border:1px solid transparent;background:transparent;color:#9698a7;padding:9px 10px;display:flex;align-items:center;gap:11px;text-align:left;border-radius:9px;transition:.2s ease; min-height:51px;}
    .scene-select:hover{background:#1c1e29;color:#ecedf7;}
    .scene-select[aria-selected="true"] {border-color:#454658;background:#232530;color:#f1eefc;}
    .swatch {width:25px;height:30px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 2px 7px rgba(0,0,0,.15);}
    .swatch.dusk {background:linear-gradient(150deg,#aaa2d2,#4c382b)}
    .swatch.forest {background:linear-gradient(150deg,#85ba93,#102218)}
    .swatch.lilac {background:linear-gradient(150deg,#cbb3f2,#8e69ca)}
    .swatch.graphite {background:linear-gradient(150deg,#999,#555)}
    .swatch.neon {background:linear-gradient(150deg,#aa7ce8,#4a1e80)}
    .scene-label {display:grid;gap:4px;min-width:0;}
    .scene-name {font-size:12px;font-weight:620;letter-spacing:.013em;}
    .scene-subtitle {font:10px/1.2 ui-monospace,Consolas,monospace;color:#7f8293;}
    .scene-no {margin-left:auto;font:10px ui-monospace,Consolas,monospace;color:#676a7c;}
    .aside-divider {height:1px;background:linear-gradient(90deg,#363846,transparent);margin:-7px 0 -11px;}
    .setting-heading {display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:650;color:#e5e4ef;margin:0 0 16px;}
    .reset {padding:0;border:0;background:none;color:#9295a7;font-size:10px;text-decoration:underline;text-decoration-color:#505362;text-underline-offset:3px;}
    .setting {display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:14px;font-size:11px;color:#a7a9b8;}
    .setting-value {font:10px ui-monospace,Consolas,monospace;color:#7e8292;}
    input[type=range] {grid-column:1/-1;appearance:none; width:100%;height:4px;background:#363a4a;border-radius:8px;margin:3px 0;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb {appearance:none;width:12px;height:12px;border-radius:50%;background:#c5bce5;border:2px solid #1e202a;box-shadow:0 0 0 1px #aaa2ce;}
    input[type=range]::-moz-range-thumb {width:10px;height:10px;border-radius:50%;background:#c5bce5;border:2px solid #1e202a;}
    .footer {max-width:1200px;width:100%;margin:0 auto; padding:0 24px 19px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#686c80;font:10px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.045em;}
    .keycap {display:inline-flex;border:1px solid #3b3d4a;border-bottom-color:#575866;padding:1px 5px;border-radius:4px;color:#989bad;margin:0 3px;}
    .footer a {color:#acacbc;text-decoration:none;}
    .footer a:hover{text-decoration:underline;}
    .nav-mobile {display:none;}
    .full-bleed .topbar,.full-bleed .studio-sidebar,.full-bleed .footer {display:none;}
    .full-bleed main {padding:0;}
    .full-bleed .workspace {display:flex;max-width:none;justify-content:center;}
    .full-bleed .poster {width:min(100vw,81.8359dvh);height:min(100dvh,122.1957vw);box-shadow:none;border-radius:0;}
    .full-bleed .poster-index {display:none;}
    .exit-full {display:none;position:fixed;top:16px;right:16px;z-index:20;background:rgba(12,13,18,.65);border:1px solid rgba(255,255,255,.2);color:white;border-radius:9px;padding:10px 14px;font-size:12px;backdrop-filter:blur(10px);}
    .full-bleed .exit-full {display:block;}
    @media (max-width:800px) {
      .topbar {padding:17px 19px 11px;}
      .header-mid {display:none;}
      .brand {font-size:11px;}
      main {display:block;padding:8px 16px 0;}
      .workspace {display:flex;flex-direction:column;gap:23px;}
      .poster {width:min(560px, calc(100vw - 32px), calc((100dvh - 235px)*.81836));}
      .studio-sidebar {width:min(560px,calc(100vw - 32px)); max-width:none; min-width:0; gap:17px;}
      .sidebar-intro {display:none;}
      .scene-menu {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;}
      .scene-select {flex-direction:column;padding:8px 4px;gap:5px;min-height:70px;justify-content:center;}
      .swatch {height:23px;width:22px;}
      .scene-label {display:none;}
      .scene-no {margin:0;}
      .aside-divider,.settings {display:none;}
      .footer {justify-content:center;padding:15px 16px 20px;text-align:center;}
      .footer .footer-right {display:none;}
    }
    @media (max-width:450px) {
      .icon-button .button-label {display:none;}
      .icon-button {padding:0 9px;}
      .topbar {padding:14px 16px 9px;}
      .poster {width:calc(100vw - 32px);}
      .footer {font-size:9px;}
    }
    @media (prefers-reduced-motion:reduce) {*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  </style>
</head>
<body>

    <header class="topbar">
      <a class="brand" href="." aria-label="Emboss Lab 首页"><span class="brand-mark" aria-hidden="true"></span> EMBOSS LAB <span style="font-size:9px;font-weight:400;opacity:.45;letter-spacing:.02em">/ 01</span></a>
      <span class="header-mid">EXPLORING THE MATERIALITY OF DIGITAL TYPE</span>
      <div class="top-actions">

    <main>
      <div class="workspace">
        <div class="stage-shell">

                <text class="type" x="601" y="312" font-size="15">HUMAN STRENGTH</text>

                <circle class="imprint" cx="813" cy="320" r="21"/><rect class="imprint" x="804" y="311" width="18" height="18" rx="3"/>
                <g class="imprint" transform="translate(500 631)">
                  <rect x="-178" y="-178" width="356" height="356"/>
                  <circle cx="0" cy="0" r="178"/>

  <script>
    (() => {
      'use strict';
      const poster = document.getElementById('poster');
      const tabs = [...document.querySelectorAll('.scene-select')];
      const scenes = [...document.querySelectorAll('.scene')];
      const count = document.getElementById('sceneCount');
      const descriptions = [
        '黄昏紫金纸张上的 ADSTRONAUT 压印海报',
        '深绿色纸张上的 EDGERUN INDUSTRIES 凹刻海报',
        '丁香紫背景上的轨道示意和工业口号海报',
        '灰色纸张上的几何徽章与机械装置海报',
        '电光紫背景上的 ADSTRONAUT 技术仪表海报'
      ];
      let current = 0;
      function selectScene(index) {
        current = (index + scenes.length) % scenes.length;
        poster.dataset.scene = String(current);
        poster.setAttribute('aria-label', descriptions[current]);
        scenes.forEach((el, i) => {
          el.classList.toggle('is-active', i === current);
          el.setAttribute('aria-hidden', String(i !== current));
        });
        tabs.forEach((el, i) => {
          el.setAttribute('aria-selected', String(i === current));
          el.tabIndex = i === current ? 0 : -1;
        });
        count.textContent = '/ ' + String(current + 1).padStart(2,'0') + ' — 05';
      }
      tabs.forEach((button, i) => button.addEventListener('click', () => selectScene(i)));
      document.getElementById('shuffleButton').addEventListener('click', () => {
        const delta = 1 + Math.floor(Math.random() * (scenes.length - 1));
        selectScene(current + delta);
      });
      function setImmersive(on) {
        document.body.classList.toggle('full-bleed', on);
        document.getElementById('fullscreenButton').setAttribute('aria-pressed', String(on));
      }
      document.getElementById('fullscreenButton').addEventListener('click', () => setImmersive(!document.body.classList.contains('full-bleed')));
      document.getElementById('exitFullscreenButton').addEventListener('click', () => setImmersive(false));
      document.addEventListener('keydown', e => {
        if (e.target && e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight') { e.preventDefault(); selectScene(current + 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); selectScene(current - 1); }
        if (e.key.toLowerCase() === 'f') setImmersive(!document.body.classList.contains('full-bleed'));
        if (e.key === 'Escape') setImmersive(false);
        if (/^[1-5]$/.test(e.key)) selectScene(Number(e.key)-1);
      });
      const sliders = [
        ['depth', 'depthSlider', 'depthValue', n => (n/65).toFixed(3)],
        ['grain-opacity', 'grainSlider','grainValue', n => (n/100).toFixed(3)],
        ['light-opacity', 'lightSlider','lightValue', n => (n/100).toFixed(3)]
      ];
      function updateSetting([variable, sliderId, outputId, transform]) {
        const slider = document.getElementById(sliderId);
        const output = document.getElementById(outputId);
        const val = Number(slider.value);
        poster.style.setProperty('--' + variable, transform(val));
        output.textContent = val + '%';
      }
      sliders.forEach(config => {
        document.getElementById(config[1]).addEventListener('input', () => updateSetting(config));
        updateSetting(config);
      });
      document.getElementById('resetButton').addEventListener('click', () => {
        ['65', '47', '58'].forEach((v,i) => document.getElementById(sliders[i][1]).value = v);
        sliders.forEach(updateSetting);
      });
      let pendingPointer = false;
      let px = 72, py = 12;
      poster.addEventListener('pointermove', e => {
        const bounds = poster.getBoundingClientRect();
        px = (e.clientX - bounds.left) / bounds.width * 100;
        py = (e.clientY - bounds.top) / bounds.height * 100;
        if (pendingPointer) return;
        pendingPointer = true;
        requestAnimationFrame(() => {
          poster.style.setProperty('--mouse-x', px.toFixed(2) + '%');
          poster.style.setProperty('--mouse-y', py.toFixed(2) + '%');
          pendingPointer = false;
        });
      });
      // The lettering is hand-built vector geometry, not a raster screenshot.
      const glyph = {
        A:'M2 56 V12 L12 2 H43 L53 12 V56 M2 30 H53',
        D:'M2 2 H42 L53 13 V45 L42 56 H2 Z',
        S:'M52 2 H12 L2 12 V22 L12 29 H43 L53 37 V46 L43 56 H2',
        T:'M0 2 H55 M28 2 V56',
        R:'M2 56 V2 H43 L53 12 V23 L43 32 H2 M35 32 L53 56',
        O:'M12 2 H43 L53 12 V45 L43 56 H12 L2 45 V12 Z',
        N:'M2 56 V2 H10 L44 56 H53 V2',
        U:'M2 2 V45 L12 56 H43 L53 45 V2'
      };
      const ns = 'http://www.w3.org/2000/svg';
      for (const id of ['heroWord','bigWord']) {
        const target = document.getElementById(id);
        let x = 0;
        for (const c of 'ADSTRONAUT') {
          const path = document.createElementNS(ns,'path');
          path.setAttribute('d',glyph[c]);
          path.setAttribute('transform',`translate(${x} 0)`);
          target.appendChild(path);
          x += 65;
        }
      }
      const hatch = document.getElementById('hatchLine');
      for (let x=100; x < 906; x+=7.1) {
        const line = document.createElementNS(ns,'path');
        line.setAttribute('d', `M${x.toFixed(1)} 731 l-6.5 24`);
        hatch.appendChild(line);
      }
      selectScene(0);
    })();
  </script>
