<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计配方实验室 · UI Vault</title>
<style>
:root{color-scheme:light dark;--paper:#f6f5f2;--surface:#fff;--ink:#222725;--muted:#5b645f;--line:#d9ded7;--accent:#345f4c;--soft:#e4ede6;--stage:#e9ece7;--gap:16px;font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}
@media(prefers-color-scheme:dark){:root{--paper:#151917;--surface:#1e2421;--ink:#e8eee8;--muted:#acb8af;--line:#3a443d;--accent:#b4dbbf;--soft:#2e4134;--stage:#262f29}}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{max-width:1260px;margin:auto;padding:clamp(18px,4vw,48px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.eyebrow,.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.mark{display:grid;grid-template-columns:repeat(2,7px);gap:3px;transform:rotate(-12deg)}.mark i{height:7px;background:var(--accent);border-radius:2px}.mark i:last-child{opacity:.35}
.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:28px 0 22px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4.8vw,48px);letter-spacing:-.055em;line-height:1.18;font-weight:660}.hero p{color:var(--muted);margin-top:12px;max-width:48ch}.edition{white-space:nowrap;color:var(--muted);font:11px/1.6 ui-monospace,monospace;text-align:right}
.recipe-nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:16px}.recipe-nav button{min-width:0;display:grid;gap:5px;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--surface)}.recipe-nav button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}.recipe-nav b{font-weight:650;font-size:13px}.recipe-nav small{color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:16px;align-items:start}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:12px;border-bottom:1px solid var(--line)}.card-head strong{font-size:13px}.card-head span{color:var(--muted);font-size:11px}.canvas{min-height:300px;display:grid;place-items:center;padding:clamp(16px,3vw,36px);background:var(--stage);overflow:hidden;isolation:isolate}.sample{width:100%;min-width:0;max-width:500px;color:#253b30}.controls{padding:16px;display:grid;gap:12px}.control-line{display:flex;align-items:center;justify-content:space-between;gap:12px}.control-line label{font-weight:600}.control-line output{font:12px ui-monospace,monospace;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button,.actions a{padding:7px 11px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;text-decoration:none;font-size:12px}.actions .primary{color:var(--surface);background:var(--accent);border-color:var(--accent)}@media(prefers-color-scheme:dark){.actions .primary{color:#17271d}}
.notes{padding:20px;display:grid;gap:16px}.notes h2{font-size:22px;letter-spacing:-.035em;line-height:1.3}.notes p,.notes li{font-size:13px;color:var(--muted)}.note-block{border-top:1px solid var(--line);padding-top:12px}.note-block h3{font-size:12px;margin-bottom:6px}.note-block ul{margin:0;padding-left:19px}.scenarios{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scenario{padding:10px;background:var(--paper);border-radius:8px;min-width:0}.scenario b{font-size:11px}.scenario p{margin-top:4px}.source-links{display:flex;flex-wrap:wrap;gap:6px}.source-links a{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;text-decoration:none;overflow-wrap:anywhere}.snippet{margin-top:16px;padding:16px}.snippet pre{font:12px/1.65 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:10px 0 0}.feedback{font-size:12px;color:var(--muted);min-height:1.6em}
/* Six working CSS studies. The slider changes the actual rendered property. */
.grid-study{display:grid;grid-template-columns:2fr 1fr;gap:var(--value);padding:14px;background:#f8faf7;border:1px solid #d4ded4;border-radius:12px}.grid-study>div{padding:16px;border:1px solid #d7e2d6;background:#e9f1e7;border-radius:7px;min-width:0}.grid-study .hero-tile{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;min-height:178px;background:#264f3c;color:#f1f7ed}.metric{font-size:clamp(24px,5vw,44px);font-weight:650;line-height:1.2}.small-label{font-size:11px;opacity:.85}.bars{display:flex;align-items:end;gap:5px;height:40px}.bars i{flex:1;background:#779d7e;border-radius:3px;height:var(--h)}.glass-study{position:relative;min-height:240px;display:grid;place-items:center;background:radial-gradient(circle at 25% 25%,#a5d8f3,transparent 55%),radial-gradient(circle at 75% 70%,#a3c0a0,transparent 50%),#d5e0f4;border-radius:12px;overflow:hidden}.glass-study:before{content:"";position:absolute;inset:15%;background:repeating-linear-gradient(135deg,#7189ac33 0 8px,transparent 8px 22px);border-radius:50%;transform:rotate(-12deg)}.glass-sheet{position:relative;width:74%;padding:24px;background:rgba(255,255,255,.68);backdrop-filter:blur(var(--value));border:1px solid #ffffffd9;border-radius:15px;box-shadow:0 16px 40px #30496325;color:#183248}.glass-sheet h3{font-size:23px;line-height:1.15;margin:7px 0}.glass-sheet p{font-size:12px}.mesh-study{min-height:240px;padding:24px;display:flex;flex-direction:column;justify-content:end;border-radius:12px;background:radial-gradient(circle at var(--value) 30%,#a4e2d2,transparent 55%),radial-gradient(circle at 90% 5%,#9fa5ed,transparent 55%),radial-gradient(circle at 15% 100%,#eab8ab,transparent 55%),#23394e;color:#fff}.mesh-study h3{font-size:28px;letter-spacing:-.04em}.mesh-study .mesh-caption{background:#172f40;color:#fff;padding:11px 13px;border-radius:8px;align-self:start}.terminal-study{background:#1c2a25;color:#d8eedc;border:1px solid #455c4b;padding:18px;border-radius:10px;font:var(--value)/1.7 ui-monospace,monospace}.terminal-study .terminal-label{color:#a8dcb0;font-size:11px;border-bottom:1px solid #526c5b;padding-bottom:9px;margin-bottom:14px}.terminal-study .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:4px 0}.terminal-study .status{color:#b7d8bf}.reading-study{background:#fffcf4;color:#352e25;border:1px solid #e1d9c9;border-radius:8px;padding:clamp(18px,3vw,30px)}.reading-study article{max-width:var(--value);margin:auto}.reading-study h3{font-family:Georgia,serif;line-height:1.2;font-size:27px;letter-spacing:-.03em;margin:10px 0}.reading-study p{font-size:13px;line-height:1.85;color:#655b4d}.motion-study{background:#dce8e1;min-height:240px;border-radius:12px;display:grid;place-items:center;padding:20px;perspective:700px}.motion-tile{width:min(100%,240px);padding:26px 20px;background:#234f3c;color:#f3f9f3;border:1px solid #335e4a;border-radius:12px;transition:transform var(--value) cubic-bezier(.2,.8,.2,1);transform:translateY(0)}.motion-tile.is-raised{transform:translateY(-22px) rotateY(-7deg)}.motion-tile h3{font-size:22px}.motion-tile button{margin-top:14px;background:#ecf6ed;color:#244b39;border:0;padding:8px 12px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.motion-tile.is-raised{transform:none;outline:3px solid #82ad90}}
@media(max-width:850px){.recipe-nav{grid-template-columns:repeat(3,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.canvas{min-height:260px}}
@media(max-width:430px){main{padding:15px}.hero{display:block;margin:22px 0 16px}.edition{display:none}.recipe-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.recipe-nav button{padding:9px}.card-head{padding:11px 12px}.notes{padding:15px}.canvas{padding:13px}.grid-study{padding:9px;grid-template-columns:1fr}.grid-study .hero-tile{grid-row:auto;min-height:125px}.grid-study>div{padding:10px}.scenarios{grid-template-columns:1fr}.brand{font-size:12px}.eyebrow{font-size:10px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> UI Vault / Design Lab</div><span class="eyebrow">Practice · 01</span></header>
<section class="hero"><div><div class="kicker">Visual recipes / 设计方法</div><h1>让设计原理可操作。</h1><p>从真实设计指南提炼六种方法，在同一实验室中观察布局、材质、色彩与运动的变化。</p></div><div class="edition">06 RECIPES<br>INTERACTIVE CSS STUDIES</div></section>
<nav class="recipe-nav" aria-label="选择设计配方" id="recipe-nav"></nav>
<div class="workspace">
<section class="card"><div class="card-head"><strong>实时实验</strong><span id="study-number">01 / 06</span></div><div class="canvas" id="canvas"><div class="sample" id="sample"></div></div>
<div class="controls"><div class="control-line"><label for="value" id="control-label">模块间距</label><output id="output" for="value"></output></div><input id="value" type="range"><div class="actions"><button type="button" id="reset">恢复默认</button><button type="button" id="select-code" class="primary">选中实现代码</button></div><p class="feedback" role="status" id="feedback"></p></div></section>
<section class="card notes" aria-labelledby="recipe-title"><div><div class="kicker" id="recipe-kind">01 / Layout</div><h2 id="recipe-title"></h2></div><p id="principle"></p><div class="note-block"><h3>实现机制</h3><p id="mechanism"></p></div><div class="scenarios"><div class="scenario"><b>适用场景</b><p id="use-when"></p></div><div class="scenario"><b>不适用场景</b><p id="avoid-when"></p></div></div><div class="note-block"><h3>AI 实施指令</h3><p id="agent"></p></div><div class="note-block"><h3>验收清单</h3><ul id="checks"></ul></div><div class="note-block"><h3>来源案例</h3><div class="source-links" id="references"></div><p>示例为本仓原创 CSS 实验，不是上游页面的完整复刻或认证。</p></div></section>
</div>
<section class="card snippet"><div class="card-head"><strong>当前参数的 CSS 片段</strong><span>可选择并复制</span></div><pre id="snippet" tabindex="0" aria-label="当前实现代码"></pre></section>
</main>
<script type="application/json" id="recipes">[{"id":"functional-grid","title":"功能优先的模块化网格","references":["website-style-bauhaus","website-style-bento-grid"],"principle":"使用模块与阅读顺序表达功能层级，面积应与内容重要性相称，不是每个模块都需要卡片。","mechanism":"以 CSS Grid 定义明确列数与跨列规则；使用统一间距、最小尺寸和语义标题，窄屏按内容顺序降为单列。","useWhen":"仪表盘、功能集合、信息概览","avoidWhen":"长篇连续阅读或所有条目必须严格等权的列表","agentInstruction":"先写内容结构和真实状态，再选择网格；避免为填满空格制造无意义卡片。","checks":["长标题与空状态","键盘顺序与视觉顺序一致","320px 无横向溢出"]},{"id":"frosted-overlay","title":"有界玻璃材质","references":["website-style-glassmorphism","website-style-liquid-glass"],"principle":"半透明与背景过滤表达前后关系，不能牺牲内容可读性；折射是不同于普通模糊的效果。","mechanism":"在有限面积的浮层使用 backdrop-filter 与语义边框；无支持或降低视觉效果时回退为不透明表面。真实折射需另外验证 shader 或图像采样，不称普通 CSS 模糊为 Liquid Glass。","useWhen":"浮层、导航、少量层叠面板","avoidWhen":"密集数据正文、大面积叠加滤镜和低性能设备","agentInstruction":"复用成熟浮层组件的焦点及定位逻辑；材质仅负责表面，不实现第二套交互。","checks":["浅深背景文字对比","浮层碰撞与焦点","无滤镜回退"]},{"id":"atmospheric-color","title":"柔和空间色场","references":["website-style-aurora-gradient","website-style-gradient-mesh"],"principle":"通过多色控制点建立氛围与视觉焦点，正文层级不依赖颜色噪声。","mechanism":"少量 radial-gradient 叠加可实现静态近似；必要时才用 Canvas/WebGL 多点混色，降低动态效果时保留静态图。","useWhen":"品牌封面、背景实验、低密度展示","avoidWhen":"密集编辑工作台正文与需要精确色彩判断的视图","agentInstruction":"限定色板、空间位置与透明度，明确近似实现和真正网格插值的区别。","checks":["渐变边缘无突兀断层","文字对比","静态降级与连续渲染性能"]},{"id":"technical-interface","title":"工程信息与命令界面","references":["website-style-blueprint-technical","website-style-terminal-cli-aesthetic"],"principle":"网格、字符对齐和明确状态提示服务测量、诊断与操作，不以装饰性终端拟态代替真实功能。","mechanism":"正文使用易读字体，代码、数值与路径使用等宽字和 tabular-nums；语义颜色和文本同时标识状态。","useWhen":"日志、网络诊断、命令面板、参数检查器","avoidWhen":"长篇自然语言阅读或需要亲和感的大众服务入口","agentInstruction":"使用真实命令、真实字段与可操作反馈，禁止生成无意义日志。","checks":["错误与成功非仅颜色区分","可复制文本","长路径换行或滚动"]},{"id":"restrained-reading","title":"克制的阅读界面","references":["website-style-minimalism","website-style-analog-warmth"],"principle":"留白、色温和文本层级支撑阅读节奏，而非单纯减少元素或降低对比。","mechanism":"限制正文行长，以语义字号、行高和间距构建层次；暖色与颗粒仅作可选背景，不覆盖正文。","useWhen":"文档、设计指南、知识库和阅读器","avoidWhen":"高密度操作区需要快速并列比较大量字段时","agentInstruction":"删除无用容器和装饰，但保留导航、错误、操作状态及键盘焦点。","checks":["中文长文本","字号放大","浅深主题正文对比"]},{"id":"spatial-motion","title":"可降级的空间与文字动效","references":["website-style-3d-immersive","website-style-kinetic-typography"],"principle":"空间或文字运动应表达状态、叙事或反馈，不应阻止阅读和操作。","mechanism":"先实现静态语义结构，简单过渡采用 transform/opacity；真正三维场景才使用经验证的渲染库，限制重绘并提供静态回退。","useWhen":"沉浸式作品、演示和必要状态过渡","avoidWhen":"持续输入、关键表单和高频操作路径","agentInstruction":"保留可中断交互、键盘导航和 prefers-reduced-motion；不要为视觉演示强制接管滚动。","checks":["减少动效","快速反向交互","帧间隔与低性能降级"]}]</script>
<script>
const recipes=JSON.parse(document.getElementById('recipes').textContent);
const studies=[
 {label:'模块化网格',kind:'Layout',control:'模块间距',min:4,max:28,initial:12,unit:'px',markup:'<div class="grid-study"><div class="hero-tile"><span class="small-label">本月概览</span><b class="metric">24</b><span class="small-label">模块面积表达重要性</span></div><div><span class="small-label">已完成</span><b class="metric">18</b></div><div><span class="small-label">分布示意</span><div class="bars"><i style="--h:35%"></i><i style="--h:65%"></i><i style="--h:50%"></i><i style="--h:95%"></i></div></div></div>',css:v=>'.grid-study {\n  display: grid;\n  grid-template-columns: 2fr 1fr;\n  gap: '+v+'px;\n}\n.hero-tile { grid-row: span 2; }\n@media (max-width: 430px) {\n  .grid-study { grid-template-columns: 1fr; }\n  .hero-tile { grid-row: auto; }\n}'},
 {label:'玻璃材质',kind:'Material',control:'背景模糊',min:0,max:28,initial:14,unit:'px',markup:'<div class="glass-study"><div class="glass-sheet"><span class="small-label">SURFACE / 01</span><h3>光线穿过表面</h3><p>观察背景模糊与文字对比。</p></div></div>',css:v=>'.glass-sheet {\n  background: rgba(255,255,255,.68);\n  backdrop-filter: blur('+v+'px);\n  border: 1px solid #ffffffd9;\n}'},
 {label:'空间色场',kind:'Color',control:'色场横向位置',min:0,max:100,initial:28,unit:'%',markup:'<div class="mesh-study"><div class="mesh-caption"><span class="small-label">COLOR FIELD</span><h3>柔和色场</h3><p>移动一个径向渐变控制点</p></div></div>',css:v=>'.mesh-study {\n  background: radial-gradient(circle at '+v+'% 30%, #a4e2d2, transparent 55%),\n    radial-gradient(circle at 90% 5%, #9fa5ed, transparent 55%),\n    radial-gradient(circle at 15% 100%, #eab8ab, transparent 55%), #23394e;\n}'},
 {label:'工程界面',kind:'Information',control:'等宽文本字号',min:11,max:17,initial:13,unit:'px',markup:'<div class="terminal-study"><div class="terminal-label">SYSTEM / EXAMPLE DATA</div><div class="row"><span>registry / tokens</span><span class="status">READY</span></div><div class="row"><span>source / preview</span><span class="status">READY</span></div><div class="row"><span>evidence / hash</span><span>CHECK</span></div><div class="row"><span>sample count</span><span>0006</span></div></div>',css:v=>'.terminal-study {\n  font: '+v+'px/1.7 ui-monospace, monospace;\n}\n.row {\n  display: grid;\n  grid-template-columns: minmax(0,1fr) auto;\n  gap: 8px;\n}'},
 {label:'阅读界面',kind:'Typography',control:'正文最大行宽',min:18,max:48,initial:34,unit:'ch',markup:'<div class="reading-study"><article><span class="small-label">FIELD NOTES — 01</span><h3>在留白中找到节奏</h3><p>好的阅读界面不需要每一段都置于卡片。让文字的层级、行长与段落间距成为结构本身，减少无意义的装饰，同时保留清晰的操作与状态反馈。</p></article></div>',css:v=>'.reading-study article {\n  max-width: '+v+'ch;\n  margin: auto;\n}\n.reading-study p { line-height: 1.85; }'},
 {label:'空间动效',kind:'Motion',control:'过渡时长',min:0,max:600,initial:220,unit:'ms',markup:'<div class="motion-study"><div class="motion-tile"><span class="small-label">MOTION / STATE</span><h3>状态而非装饰</h3><button type="button" aria-pressed="false" id="motion-toggle">切换空间状态</button></div></div>',css:v=>'.motion-tile {\n  transition: transform '+v+'ms cubic-bezier(.2,.8,.2,1);\n}\n.motion-tile.is-raised { transform: translateY(-22px) rotateY(-7deg); }\n@media (prefers-reduced-motion: reduce) {\n  .motion-tile { transition: none; }\n  .motion-tile.is-raised { transform: none; outline: 3px solid #82ad90; }\n}'}
];
const $=id=>document.getElementById(id),nav=$('recipe-nav'),range=$('value');let active=0;
function update(){const s=studies[active],v=Number(range.value);$('sample').style.setProperty('--value',v+s.unit);$('output').textContent=v+s.unit;$('snippet').textContent=s.css(v);$('feedback').textContent='';}
function choose(index){active=index;const r=recipes[index],s=studies[index];for(const [i,b] of [...nav.children].entries())b.setAttribute('aria-pressed',String(i===index));$('study-number').textContent=String(index+1).padStart(2,'0')+' / 06';$('recipe-kind').textContent=String(index+1).padStart(2,'0')+' / '+s.kind;$('recipe-title').textContent=r.title;$('principle').textContent=r.principle;$('mechanism').textContent=r.mechanism;$('use-when').textContent=r.useWhen;$('avoid-when').textContent=r.avoidWhen;$('agent').textContent=r.agentInstruction;$('checks').replaceChildren(...r.checks.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));$('references').replaceChildren(...r.references.map(id=>{const a=document.createElement('a');a.href='../../../?asset='+encodeURIComponent(id);a.target='_blank';a.rel='noopener noreferrer';a.textContent=id.replace('website-style-','');return a}));$('sample').innerHTML=s.markup;$('control-label').textContent=s.control;range.min=s.min;range.max=s.max;range.step=s.unit==='ms'?10:1;range.value=s.initial;const motion=$('motion-toggle');if(motion)motion.addEventListener('click',()=>{const raised=motion.closest('.motion-tile').classList.toggle('is-raised');motion.setAttribute('aria-pressed',String(raised))});update();}
for(const [i,s] of studies.entries()){const b=document.createElement('button');b.type='button';b.innerHTML='<small>'+String(i+1).padStart(2,'0')+' / '+s.kind+'</small><b>'+s.label+'</b>';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>choose(i));nav.append(b);}
range.addEventListener('input',update);$('reset').addEventListener('click',()=>{range.value=studies[active].initial;update();$('feedback').textContent='已恢复默认参数。'});
$('select-code').addEventListener('click',()=>{const selection=window.getSelection(),r=document.createRange();r.selectNodeContents($('snippet'));selection.removeAllRanges();selection.addRange(r);$('snippet').focus({preventScroll:true});$('snippet').scrollIntoView({block:'nearest'});$('feedback').textContent='已选中 CSS，可使用系统复制快捷键。';});
choose(0);
</script>
