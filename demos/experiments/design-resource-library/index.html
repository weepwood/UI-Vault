<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>设计资源索引 · UI Vault</title><style>
:root{color-scheme:light;--bg:#f6f7f7;--surface:#fff;--ink:#252c30;--muted:#5e6a71;--line:#dde3e5;--soft:#f0f3f4;--accent:#325e79}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:300px;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #4886af;outline-offset:3px}.skip{position:absolute;top:-60px;left:10px;z-index:10;background:white;padding:10px}.skip:focus{top:10px}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,40px);font-size:12px}.top strong{font-size:13px;font-weight:700}.top a{color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,3.5vw,42px)}.intro{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:11px;color:#56646b;font-weight:650}.intro h1{font-size:clamp(25px,3vw,37px);letter-spacing:-.04em;font-weight:680;line-height:1.22;margin:8px 0 8px}.intro p{font-size:13px;color:var(--muted);max-width:68ch;margin:0;line-height:1.85}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:24px 0 10px}.search{flex:1 1 265px;min-width:0;background:#fff;border:1px solid #d4dde1;border-radius:7px;height:43px;padding:0 13px;color:var(--ink)}.filter{border:1px solid #d6dee1;background:#fff;border-radius:6px;color:#48565d;font-size:12px;height:37px;padding:0 13px}.filter[aria-pressed=true]{color:#fff;border-color:var(--accent);background:var(--accent)}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 22px;align-items:center}.count{font-size:12px;color:var(--muted);margin-left:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.resource{background:#fff;border:1px solid var(--line);border-radius:9px;min-width:0;padding:19px;display:flex;flex-direction:column;gap:9px}.resource:hover{border-color:#bacad2}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.meta span{font-size:11px;color:#637077}.kind{display:inline-block;padding:3px 7px;border-radius:4px;background:var(--soft);font-weight:650;font-size:11px;color:#405460}.resource h2{font-size:17px;line-height:1.4;margin:0;letter-spacing:-.02em;font-weight:670}.resource .desc{font-size:12px;color:#45555d;line-height:1.75;margin:0}.resource .usage{font-size:12px;color:#607077;margin:0}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}.tags span{font-size:10px;border:1px solid #e0e6e8;color:#617079;padding:2px 7px;border-radius:5px}.actions{margin-top:auto;display:flex;align-items:center;gap:8px}.open{border:1px solid #c5d2d8;border-radius:5px;background:#fff;color:#315c75;padding:7px 11px;font-size:12px;font-weight:650}.open:hover{background:#f0f5f7}.star{border:1px solid #d5dcdf;background:#fff;border-radius:5px;min-height:32px;min-width:32px;font-size:16px;line-height:1}.star[aria-pressed=true]{background:#f6efdb;border-color:#d6c394;color:#735720}.empty{padding:38px 16px;color:#6e7a80;border:1px dashed #cbd5d9;border-radius:8px;text-align:center}.note{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:#6c777d}.note a{color:var(--accent);text-decoration:underline}.hidden{display:none!important}
@media(max-width:720px){.grid{grid-template-columns:1fr}.toolbar{gap:8px}.count{margin-left:0;width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style><script defer src="../../../assets/design-resources/catalog.js"></script><script defer src="../../../assets/design-resources/library.js"></script></head>
<body><a class="skip" href="#main">跳转资源列表</a><header class="top"><strong>UI Vault / 设计资源</strong><a href="https://github.com/weepwood/UI-Vault/blob/main/docs/UI-SKILLS-HANDBOOK.md" target="_blank" rel="noopener noreferrer">阅读 Skills 手册 ↗</a></header>
<main id="main"><section class="intro"><div class="eyebrow">资源索引 · 网站、Skill 与文档</div><h1>设计参考与工程资料</h1><p>按用途找到合适的网站、AI 设计 Skill 和官方文档。保留原站来源与使用场景，不复制第三方网页，也不自动安装 Skills。</p></section>
<div class="toolbar" role="search"><label class="hidden" for="query">搜索设计资源</label><input id="query" class="search" type="search" autocomplete="off" placeholder="搜索名称、工具、场景或标签…" aria-label="搜索设计资源"><button id="clear" class="filter" type="button">清除</button></div>
<div class="filters" role="group" aria-label="资源类型筛选">
<button class="filter" type="button" data-kind="all" aria-pressed="true">全部</button>
<button class="filter" type="button" data-kind="skill" aria-pressed="false">AI Skills</button>
<button class="filter" type="button" data-kind="site" aria-pressed="false">设计网站</button>
<button class="filter" type="button" data-kind="doc" aria-pressed="false">规范文档</button>
<button class="filter" type="button" data-kind="tool" aria-pressed="false">组件与工具</button>
<button class="filter" type="button" data-kind="favorite" aria-pressed="false">本次收藏</button>
<span class="count" id="count" role="status" aria-live="polite"></span>
</div><div id="results" class="grid" role="list"></div><p id="empty" class="empty hidden">没有找到匹配的资料。可尝试减少关键词或切换分类。</p>
<p class="note">索引核对日期：2026-11-21。第三方内容可能更新；点击“访问原站”在新标签页查看。所有站点和 Skill 均是资料引用，不代表已安装、获得再分发授权或通过安全审查。<a href="https://github.com/weepwood/UI-Vault/blob/main/docs/DESIGN-RESOURCES.md" target="_blank" rel="noopener noreferrer">查看维护文档</a>。</p></main></body></html>
