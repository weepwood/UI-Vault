<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔光玻璃卡片 · UI Vault</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#9eb8bb;color:#253b46;font-family:Inter,system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:-35%;background:radial-gradient(ellipse at 35% 40%,#e5e5fb 0,transparent 32%),radial-gradient(ellipse at 74% 27%,#f6cbb9 0,transparent 26%),radial-gradient(ellipse at 66% 77%,#84c9b5 0,transparent 28%),linear-gradient(120deg,#bbc8df,#bbccc0);filter:blur(30px);animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate3d(5%,-3%,0) scale(1.06)}}.glass{position:relative;margin:22px;width:min(440px,calc(100% - 44px));padding:30px;border:1px solid rgba(255,255,255,.55);border-radius:26px;background:rgba(255,255,255,.29);box-shadow:0 24px 90px #405a6430,inset 0 1px 0 #ffffffaa;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.badge{font-size:11px;display:inline-block;border-radius:100px;padding:7px 10px;background:#ffffff80;border:1px solid #fff9;letter-spacing:.05em}.icon{width:64px;height:64px;border-radius:21px;display:grid;place-items:center;margin:26px 0 18px;background:linear-gradient(140deg,#ffffffb9,#d5e4f19e);box-shadow:0 15px 32px #64839c46;font-size:30px}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 10px;letter-spacing:-.06em;font-weight:720}p{font-size:13px;line-height:1.7;color:#58707b;margin:0 0 25px}.actions{display:flex;gap:10px}.actions button{border:0;border-radius:12px;padding:12px 19px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;transition:transform .2s}.actions button:hover{transform:translateY(-2px)}.primary{background:#263f4b;color:#fff}.secondary{background:#ffffff8a;color:#345460}.state{margin-top:20px;color:#526973;font-size:11px;min-height:17px}.actions button:focus-visible{outline:2px solid #345c6d;outline-offset:3px}
@media(prefers-reduced-motion:reduce){body::before{animation:none}.actions button{transition:none}}

/* Lucide icons are embedded in this standalone sandboxed Demo. */
.lucide-demo-icon{width:17px;height:17px;flex:none;vertical-align:-.18em}
.icon .lucide-demo-icon{width:34px;height:34px;color:#41647a}
.actions button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
@media(max-width:410px){.actions{flex-wrap:wrap}.actions button{flex:1 1 145px}}
</style></head><body><article class="glass"><span class="badge">显示偏好</span><div class="icon" aria-hidden="true"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
  <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
  <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></svg></div><h1>界面显示设置</h1><p>调整内容显示模式。此卡片用于检验透明材质下的文字对比度与按钮反馈。</p><div class="actions"><button id="primary" class="primary"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg><span>启用半透明</span></button><button id="secondary" class="secondary"><svg class="lucide-demo-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
  <path d="M3 3v5h5" /></svg><span>恢复默认</span></button></div><div class="state" id="status" aria-live="polite">当前状态：标准显示</div></article><script>document.querySelector('#primary').onclick=()=>document.querySelector('#status').textContent='当前状态：已启用半透明';document.querySelector('#secondary').onclick=()=>document.querySelector('#status').textContent='当前状态：标准显示';</script></body></html>
