<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>液态玻璃球 · UI-Vault</title>
  <style>
  :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
  *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#06080f;color:#eef0fa}
  button,input{font:inherit}button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid #b3bdff;outline-offset:3px}
  .shell{height:100dvh;min-height:370px;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px clamp(16px,3vw,32px) 0}
  h1{font-size:clamp(18px,2.2vw,25px);font-weight:570;letter-spacing:-.035em;margin:0}
  .sub{font-size:12px;color:#9ba5bb;line-height:1.5;margin:7px 0 0}
  #engine{font-size:11px;color:#aab4c9;white-space:nowrap}
  #engine::before{content:"";display:inline-block;vertical-align:2px;width:6px;height:6px;border-radius:50%;background:#94d2bd;margin-right:8px}
  .fallback #engine::before{background:#e2bf82}
  .stage{position:relative;flex:1;min-height:190px;overflow:hidden;isolation:isolate}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

  #status{position:absolute;right:16px;bottom:14px;padding:8px 10px;border-radius:7px;background:#0d1223e8;border:1px solid #424b62;font-size:12px;color:#d4d9e7}
  [hidden]{display:none!important}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 clamp(16px,3vw,32px);padding:12px 0 16px;border-top:1px solid #252a3b}
  .modes{display:flex;gap:3px;padding:3px;border:1px solid #343a50;background:#191f2e;border-radius:9px}
  .modes button{min-width:58px;height:30px;background:transparent;color:#b9c0d1;border:0;border-radius:6px;font-size:12px}
  .modes button[aria-pressed=true]{background:#3b435c;color:white}
  .speed{font-size:12px;color:#bbc3d5;display:flex;align-items:center;gap:8px}
  #speed{width:clamp(72px,10vw,134px);accent-color:#9cafff}
  #speed-label{min-width:36px;color:#e7ebfa;font-variant-numeric:tabular-nums}
  .option{height:34px;padding:0 12px;border:1px solid #363d53;border-radius:7px;background:#171d2b;color:#e0e5f3;font-size:12px}
  .option[aria-pressed=false]{color:#9da7bd}
  .option:hover{background:#242c40}
  .hint{margin-left:auto;font-size:11px;color:#8791a6}
  .quality-control{display:flex;align-items:center;gap:8px;font-size:12px;color:#b9c3d7}
  .quality-control select{height:34px;max-width:130px;padding:0 8px;border:1px solid #363d53;border-radius:7px;background:#171d2b;color:#e0e5f3;font:inherit;cursor:pointer}
  #quality-status{font-size:11px;line-height:1.5;color:#97a5bd;white-space:nowrap;font-variant-numeric:tabular-nums}
  @media(max-width:700px){#quality-status{width:100%}}
  @media(max-width:700px){header{padding-top:15px}.controls{gap:8px;padding:9px 0 12px}.hint{width:100%;margin-left:0}}
  @media(max-height:445px){.shell{min-height:0}header{padding-top:8px}.sub{display:none}.stage{min-height:90px}.controls{padding:7px 0}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}}

  /* Render gate: until the first GPU frame is complete, show only actual loading stages. */
  .stage canvas{opacity:0;transition:opacity 230ms ease}
  .ready .stage canvas{opacity:1}
  .fallback .stage canvas{opacity:0}
  .orb-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#bac1d2;z-index:1;padding:22px;text-align:center}
  .orb-loading-label{font-size:13px;line-height:1.6;color:#aeb8c9}
  .orb-track{width:min(280px,70vw);max-width:100%;height:7px;border-radius:999px;background:#222838;border:1px solid #32394a;overflow:hidden;box-shadow:inset 0 1px 3px #0006}
  .orb-track-fill{display:block;height:100%;width:8%;border-radius:inherit;background:linear-gradient(90deg,#85d8fa 0%,#9a9ff9 55%,#ed99de 100%);box-shadow:0 0 15px #bbadff55;transition:width 240ms ease}
  .orb-progress-caption{font-size:11px;letter-spacing:.02em;color:#707f9c;font-variant-numeric:tabular-nums}
  .orb-retry{display:none;border:1px solid #414960;border-radius:9px;color:#eef1fb;background:#1a2032;padding:8px 17px;font-size:12px;pointer-events:auto;cursor:pointer}
  .fallback .orb-track,.fallback .orb-progress-caption{display:none}
  .fallback .orb-retry{display:block}
  .ready .orb-loading{display:none}
  .embed{background:transparent}
  .embed .shell{height:100dvh;min-height:0}
  .embed header,.embed .controls,.embed #status,.embed .orb-loading{display:none!important}
  .embed .stage{min-height:0}
  .embed .stage canvas{transition:opacity 180ms ease}
  @media(prefers-reduced-motion:reduce){.stage canvas,.orb-track-fill{transition:none!important}}

  /* A single live WebGPU canvas serves both the orb view and the dialog view. */
  .shell{min-height:340px}
  .showcase-nav{display:flex;gap:4px;align-self:flex-start;margin:16px clamp(16px,3vw,32px) 2px;padding:3px;border:1px solid #2c3446;background:#111622;border-radius:10px}
  .showcase-tab{padding:9px 16px;font-size:12px;color:#94a0b8;border:0;border-radius:7px;background:none}
  .showcase-tab[aria-selected=true]{background:#2c364d;color:#f3f5fb;box-shadow:0 1px 5px #0005}
  .showcase-tab:hover{color:#f3f5fb}
  .demo-viewport{display:grid;place-items:center;flex:1;min-height:190px;overflow:hidden;position:relative;width:100%;padding:16px 18px}
  .presentation{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .presentation .stage{flex:1;height:100%;min-width:0}
  .dialog-caption{display:none;color:#91929a;font-size:var(--pill-text,clamp(30px,4vw,59px));font-weight:620;letter-spacing:-.05em;line-height:1.1;white-space:nowrap;min-width:0;text-overflow:ellipsis;overflow:hidden}
  /* Geometry: the orb viewport is a square inscribed into the pill's left cap.
     Both centres share x = pill-height/2; never independently size the circle. */
  .dialog-mode{--pill-width:750px;--pill-height:248px;--pill-inset:28px;--pill-text:clamp(31px,4.3vw,60px)}
  .dialog-mode[data-dialog-size=compact]{--pill-width:540px;--pill-height:176px;--pill-inset:21px;--pill-text:clamp(26px,3.4vw,42px)}
  .dialog-mode[data-dialog-size=large]{--pill-width:890px;--pill-height:290px;--pill-inset:33px;--pill-text:clamp(35px,5.1vw,72px)}
  .dialog-mode .presentation{flex:none;width:min(var(--pill-width),100%);height:var(--pill-height);min-height:0;gap:clamp(16px,3.5vw,48px);justify-content:flex-start;overflow:hidden;padding:var(--pill-inset);border:1px solid #7475806c;border-radius:calc(var(--pill-height) / 2);background:radial-gradient(ellipse at 25% 100%,#36324333,transparent 58%),linear-gradient(150deg,#15171b,#101114 75%);box-shadow:inset 0 1px 1px #ffffff1b,0 20px 65px #0004}
  .dialog-mode .presentation .stage{flex:0 0 auto;align-self:stretch;width:calc(var(--pill-height) - 2 * var(--pill-inset) - 2px);height:auto;aspect-ratio:1;min-width:0;min-height:0;position:relative;border-radius:50%;overflow:hidden}
  .dialog-mode .dialog-caption{display:block;flex:1;min-width:0}
  .dialog-settings{display:none;gap:12px;align-items:end;flex-wrap:wrap;margin:0 clamp(16px,3vw,32px) 16px;padding:12px 0 0;border-top:1px solid #252a3b}
  .dialog-mode .dialog-settings{display:flex}
  .dialog-field{display:flex;align-items:center;gap:10px;font-size:12px;color:#aab4c9}
  .dialog-field input{height:34px;padding:0 10px;border-radius:7px;border:1px solid #333c51;color:#e3e8f3;background:#161d2a;font:inherit}
  .dialog-field input{width:clamp(128px,18vw,225px)}
  .dialog-size-field{position:relative}
  .size-picker{position:relative;width:142px;max-width:100%;flex:none}
  /* Keep the native select as a compatibility value source, not as a visible popup. */
  .size-picker > select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;clip-path:inset(50%);overflow:hidden;left:0;bottom:0}
  .size-trigger{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:34px;padding:0 10px 0 12px;border:1px solid #343f55;border-radius:8px;background:#181e2b;color:#e1e8f4;font-size:12px;text-align:left;cursor:pointer}
  .size-trigger:hover,.size-picker.is-open .size-trigger{border-color:#8190b2;background:#20283a}
  .size-trigger svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:#9baac3;transition:transform .16s}
  .size-picker.is-open .size-trigger svg{transform:rotate(180deg)}
  .size-menu{position:absolute;display:flex;flex-direction:column;gap:8px;left:0;bottom:calc(100% + 9px);z-index:30;width:max(100%,226px);max-width:min(260px,calc(100vw - 32px));max-height:min(230px,45dvh);overflow-y:auto;padding:10px;border:1px solid #414c61;border-radius:10px;background:#1b2231;box-shadow:0 16px 42px #0009,0 3px 12px #0006;overscroll-behavior:contain}
  .size-menu[hidden]{display:none!important}
  .size-menu [role=option]{display:flex;align-items:center;gap:12px;flex:none;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#d6dfef;text-align:left;white-space:nowrap;font-size:12px;cursor:pointer}
  .size-menu [role=option]:hover,.size-menu [role=option]:focus-visible{background:#323d56;outline:none}
  .size-menu [role=option][aria-selected=true]{background:#343f5b;color:#f7f9ff}
  .size-menu .size-note{flex:1;text-align:right;margin-left:14px;font-size:10px;font-variant-numeric:tabular-nums;color:#94a1bc}
  .size-menu svg{width:15px;height:15px;margin-left:4px;flex:none;fill:none;stroke:#b9c8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
  .size-menu [aria-selected=true] svg{visibility:visible}
  .size-trigger:focus-visible,.size-menu [role=option]:focus-visible{outline:2px solid #aebdff;outline-offset:2px}
  .dialog-mode .dialog-settings{position:relative;z-index:5;overflow:visible}
  .dialog-open{height:34px;padding:0 14px;border:1px solid #9fb2d5;border-radius:7px;background:#dce7fc;color:#1a263a;font-size:12px;font-weight:600}
  .dialog-open:hover{background:#f3f6ff}
  .thinking-modal{width:min(940px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);padding:14px;border:0;background:transparent;overflow:visible;color:inherit}
  .thinking-modal::backdrop{background:#01040ce8;backdrop-filter:blur(11px)}
  .thinking-modal-slot{display:grid;place-items:center;width:100%}
  .thinking-modal .presentation{width:min(var(--pill-width),100%);height:var(--pill-height);max-height:min(70dvh,320px)}
  .thinking-modal-close{position:absolute;top:20px;right:clamp(24px,6vw,65px);display:grid;place-items:center;width:32px;height:32px;border:1px solid #ffffff18;border-radius:50%;background:#ffffff0b;color:#b1b7c8;cursor:pointer}
  .thinking-modal-close:hover{background:#ffffff21;color:#fff}
  .thinking-modal-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
  .thinking-modal-close:focus-visible{outline:2px solid #abbaff;outline-offset:3px}
  .dialog-mode .orb-loading{padding:8px;gap:8px}
  .dialog-mode .orb-loading-label{font-size:11px}
  .dialog-mode .orb-track{width:80%;max-width:160px;height:6px}
  .dialog-mode .orb-progress-caption{font-size:10px}
  .embed .showcase-nav,.embed .dialog-settings,.embed .thinking-modal,.embed .dialog-caption{display:none!important}
  .embed .demo-viewport{padding:0;min-height:0}
  .embed .presentation{height:100%;width:100%;border:0;padding:0;border-radius:0;box-shadow:none;background:transparent}
  .embed .presentation .stage{height:100%;width:100%;flex:1;border-radius:0;aspect-ratio:auto}
  @media(max-width:620px){
    .demo-viewport{padding:12px 14px}
    .dialog-mode{--pill-inset:14px;--pill-mobile-height:clamp(145px,calc((100vw - 28px) / 3.15),210px);--pill-text:clamp(26px,6vw,42px)}
    .dialog-mode[data-dialog-size=compact]{--pill-mobile-height:clamp(124px,calc((100vw - 28px) / 3.55),176px);--pill-inset:12px;--pill-text:clamp(23px,5.3vw,35px)}
    .dialog-mode[data-dialog-size=large]{--pill-mobile-height:clamp(164px,calc((100vw - 28px) / 2.85),236px);--pill-inset:17px;--pill-text:clamp(28px,6.5vw,48px)}
    .dialog-mode .presentation{height:var(--pill-mobile-height);min-height:0;max-height:none;aspect-ratio:auto;border-radius:calc(var(--pill-mobile-height) / 2);padding:var(--pill-inset);gap:clamp(10px,3.6vw,23px)}
    .dialog-mode .presentation .stage{width:calc(var(--pill-mobile-height) - 2 * var(--pill-inset) - 2px);height:auto}
    .dialog-field{gap:6px}
    .dialog-field input{width:150px}
    .dialog-settings{gap:10px}
    .thinking-modal .presentation{height:var(--pill-mobile-height);max-height:none;aspect-ratio:auto;min-height:0}
  }
  @media(max-width:390px){
    .dialog-mode .presentation{gap:10px}
    .dialog-mode .dialog-caption{font-size:clamp(23px,6.3vw,29px)}
    .dialog-field input{width:128px}
    .size-picker{width:130px}
    .thinking-modal{padding:5px;width:calc(100vw - 12px)}
    .thinking-modal-close{top:5px;right:17px;width:26px;height:26px}
    .hint{display:none}
  }

  /* Mobile: use a true viewport-level option sheet, not a menu that obscures inputs. */
  .size-backdrop{display:none}
  @media(max-width:620px){
    .size-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:120;background:#03060db5;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .size-menu.is-sheet{position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%);z-index:121;width:min(380px,calc(100vw - 24px));max-width:none;max-height:min(360px,65dvh);gap:10px;padding:13px;border-radius:14px;border-color:#46536b;background:#1b2434;box-shadow:0 20px 80px #000b}
    .size-menu.is-sheet [role=option]{min-height:54px;padding:12px 15px;gap:14px;font-size:14px}
    .size-menu.is-sheet .size-note{font-size:11px}
  }
  @media(prefers-reduced-motion:reduce){.showcase-tab,.dialog-open{transition:none!important}}

  /* Keep failure UI compact inside the pill; expose retry as a separate control. */
  .dialog-retry{display:none;align-items:center;height:34px;padding:0 12px;border:1px solid #3d4961;border-radius:7px;background:#1a2333;color:#d2dbea;font-size:12px}
  .dialog-mode.fallback .dialog-retry{display:inline-flex}
  .dialog-mode.fallback #status{display:none!important}
  .dialog-mode.fallback .orb-retry{display:none!important}
  .dialog-mode.fallback .orb-loading{gap:0;padding:6px}
  .dialog-mode.fallback .orb-loading-label{font-size:clamp(10px,1.5vw,12px);line-height:1.5;color:#9ba6b9;width:100%;text-align:center}
  @media(max-width:620px){.dialog-mode.fallback .orb-loading-label{font-size:10px}}
</style>
</head>
<body>
<main class="shell">
    <header>
      <div><h1>液态玻璃</h1><p class="sub">玻璃球渲染、思考对话框与加载状态</p></div>
      <span id="engine" role="status">初始化中</span>
    </header>
    <div class="showcase-nav" role="tablist" aria-label="效果展示">
      <button type="button" class="showcase-tab" id="tab-orb" data-showcase="orb" role="tab" aria-selected="true" aria-controls="demo-viewport">玻璃球</button>
      <button type="button" class="showcase-tab" id="tab-dialog" data-showcase="dialog" role="tab" aria-selected="false" aria-controls="demo-viewport">思考对话框</button>
    </div>
    <div class="demo-viewport" id="demo-viewport" role="tabpanel" aria-labelledby="tab-orb">
      <div class="presentation" id="presentation">
        <section class="stage" aria-label="玻璃球实时预览">
      <div class="orb-loading" id="orb-loading" role="status" aria-live="polite">
        <span class="orb-loading-label" id="orb-loading-label">正在检测 WebGPU…</span>
        <div class="orb-track" id="orb-progress" role="progressbar" aria-label="渲染器初始化阶段" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
          <span class="orb-track-fill" id="orb-progress-fill"></span>
        </div>
        <span class="orb-progress-caption" id="orb-progress-caption">初始化渲染器</span>
        <button type="button" id="orb-retry" class="orb-retry">重新尝试</button>
      </div>
      <canvas id="orb" role="img" aria-label="液态玻璃球动画"></canvas>
      <div id="status" role="status" hidden></div>
        </section>
        <span class="dialog-caption" id="dialog-caption">Thinking...</span>
      </div>
    </div>
    <div class="controls" aria-label="玻璃球控制">
      <div class="modes" role="group" aria-label="运动状态">
        <button type="button" data-state="idle" aria-pressed="false">静置</button>
        <button type="button" data-state="thinking" aria-pressed="true">思考</button>
      </div>
      <label class="speed" for="speed">流速
        <input id="speed" type="range" min="0.25" max="2" value="1" step="0.05" />
        <output id="speed-label" for="speed">1.00×</output>
      </label>
      <button class="option" type="button" id="glass-toggle" aria-pressed="true">玻璃外壳：开</button>
      <button class="option" type="button" id="motion-toggle" aria-pressed="false">暂停动画</button>
      <label class="quality-control" for="quality-mode">画质
        <select id="quality-mode" aria-label="液态玻璃渲染画质">
          <option value="auto" selected>自动 · 推荐</option>
          <option value="eco">节能</option>
          <option value="balanced">均衡</option>
          <option value="high">高质量</option>
        </select>
      </label>
      <output id="quality-status" for="quality-mode" aria-live="off">正在检测性能…</output>
    </div>
    <div class="dialog-settings" id="dialog-settings">
      <label class="dialog-field" for="dialog-text">对话框文字
        <input type="text" id="dialog-text" maxlength="40" value="Thinking..." autocomplete="off" />
      </label>
      <div class="dialog-field dialog-size-field">
        <span id="dialog-size-label">尺寸</span>
        <div class="size-picker" id="size-picker">
          <select id="dialog-size" aria-hidden="true" tabindex="-1">
            <option value="compact">紧凑</option>
            <option value="standard" selected>标准</option>
            <option value="large">大尺寸</option>
          </select>
          <button type="button" class="size-trigger" id="dialog-size-trigger"
            aria-haspopup="listbox" aria-expanded="false" aria-controls="dialog-size-menu"
            aria-labelledby="dialog-size-label dialog-size-current">
            <span id="dialog-size-current">标准</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="size-menu" id="dialog-size-menu" role="listbox" aria-labelledby="dialog-size-label" hidden>
            <button type="button" role="option" tabindex="-1" data-size="compact" aria-selected="false">
              <span>紧凑</span><span class="size-note">540 × 176</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
            </button>
            <button type="button" role="option" tabindex="-1" data-size="standard" aria-selected="true">
              <span>标准</span><span class="size-note">750 × 248</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
            </button>
            <button type="button" role="option" tabindex="-1" data-size="large" aria-selected="false">
              <span>大尺寸</span><span class="size-note">890 × 290</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <button class="dialog-open" id="dialog-open" type="button">弹出对话框</button>
      <button class="dialog-retry" id="dialog-retry" type="button">重试渲染</button>
    </div>
  </main>
  <div class="size-backdrop" id="size-backdrop" hidden aria-hidden="true"></div>
  <dialog class="thinking-modal" id="thinking-modal" aria-label="液态玻璃思考对话框">
    <div class="thinking-modal-slot" id="thinking-modal-slot"></div>
    <button class="thinking-modal-close" type="button" id="thinking-modal-close" aria-label="关闭对话框" title="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </dialog>
  <script type="module">
    const shaderSource = "// Glass Liquid — curated flow programs with an optional glass shell.\n//\n// The local presets use independent spatial models for Siri-like sheets,\n// symmetric colour waves, aurora curtains, frost flow, neural interference,\n// liquid chrome, opal interference, a voice membrane, a blue liquid drop, and\n// a violet molten core, plus a chromatic brushed-metal field. The legacy liquid\n// bank remains below for compatibility with older shared shader\n// code, but is not exposed as an editor preset.\n//\n// When enabled, the shell uses a signed-distance refraction profile around the\n// boundary, asymmetric spectral separation, and two directional edge lights.\n// The fluid is resampled through that profile, so glass changes the image rather\n// than covering it with a translucent white face.\n//\n// ---------------------------------------------------------------------------\n// Analytic optical diffusion without a convolution.\n// ---------------------------------------------------------------------------\n//\n// The source used a thirteen-tap 5px frost blur. This port keeps one fluid\n// evaluation and applies the equivalent gaussian in the frequency domain:\n//\n//  1. **Per-octave attenuation, inside `lqFbm`.** Convolving with a gaussian of\n//     sigma σ scales a component at wavenumber k by exp(-k²σ²/2). An fbm's\n//     octaves have known wavenumbers — octave i sits at 2.03^i times the base —\n//     so each octave's amplitude is scaled by its own factor and the field is\n//     sampled once. The mean is untouched (a blur preserves it), so only the\n//     deviation from 0.5 is scaled and the `s / m` normaliser is unchanged.\n//     Every caller passes the diffusion sigma in its own input units, so detail\n//     attenuation continues to track `zoom`.\n//\n//  2. **Value-space quadrature at every pointwise nonlinearity.** This is the\n//     part that is easy to get wrong. `blur(ridge(f))` is not `ridge(blur(f))`:\n//     attenuating first and ridging after leaves filaments thin and hard where\n//     the blur should have spread them, which is exactly how the earlier\n//     analytic-edge version failed. So `lqFbm` also returns the standard\n//     deviation of the detail the attenuation removed — within a gaussian\n//     window an octave scaled by β contributes variance ∝ (1 - β²), NOT\n//     (1 - β)² — and every nonlinearity applied to that field integrates it\n//     back out with a three-point Gauss-Hermite rule (exact through the fourth\n//     moment). Three evaluations of a function of one float, not three\n//     evaluations of the noise. `lqRidgeS`/`lqStepS`/`lqPowS` below; Nectar's\n//     branch has the fbm inside a `sin`, where the same integral is closed-form\n//     (E[sin(A + cε)] = sin A · exp(-c²σ²/2)), so it damps the sine instead.\n//\n//  3. **One continuous disc edge.** The fluid always reaches the sphere\n//     boundary. Glass changes its sample coordinates near that boundary, so\n//     toggling the shell cannot reveal a second hard-clipped silhouette.\n//\n// Deliberately NOT ported, and why:\n//   - The liquid grain. It sits below display-pixel scale and adds noise rather\n//     than useful optical detail, so Glass Liquid has no Grain parameter.\n//   - The two contact-shadow ellipses under the ball and its outer\n//     `0 26px 50px -24px` drop shadow. The Orbs family cut the source app's\n//     floor at the user's request, and the export paints over `Color.black`.\n//\n// Scalar controls are packed after `time`; the colour bank starts on the next\n// 16-byte boundary. The TypeScript writer mirrors this order exactly.\nstruct Uniforms {\n  size:           vec2<f32>,\n  time:           f32,\n  speed:          f32,\n  radius:         f32,\n  zoom:           f32,\n  warp:           f32,\n  ridgeAmt:       f32,\n  sharp:          f32,\n  shade:          f32,\n  sheen:          f32,\n  gloss:          f32,\n  shellMidAlpha:  f32,\n  shellEdgeAlpha: f32,\n  exposure:       f32,\n  style:          f32,\n  edgeSoftness:   f32,\n  edgeGlow:       f32,\n  paletteCount:   f32,\n  glassEnabled:   f32,\n  glassOpacity:   f32,\n  contourDeform:  f32,\n  bandDensity:    f32,\n  chromaticShift: f32,\n  metalScale:     f32,\n  metalStretch:   f32,\n  metalAngle:     f32,\n  metalOffset:    f32,\n  metalPhase:     f32,\n  metalEvolution: f32,\n  metalRoughness: f32,\n  metalDepth:     f32,\n  particleDensity: f32,\n  ribbonCount:     f32,\n  ribbonWidth:     f32,\n  ribbonTwist:     f32,\n  ribbonFold:      f32,\n  ribbonBreath:    f32,\n  particleSize:    f32,\n  particleBloom:   f32,\n  colorA:         vec4<f32>,\n  colorB:         vec4<f32>,\n  colorC:         vec4<f32>,\n  colorD:         vec4<f32>,\n  highlightColor: vec4<f32>,\n  shellInner:     vec4<f32>,\n  shellMid:       vec4<f32>,\n  shellEdge:      vec4<f32>,\n  sheenColor:     vec4<f32>,\n  specColor:      vec4<f32>,\n  canvasColor:    vec4<f32>,\n  glowColor:      vec4<f32>,\n  paletteStop0:    vec4<f32>,\n  paletteStop1:    vec4<f32>,\n  paletteStop2:    vec4<f32>,\n  paletteStop3:    vec4<f32>,\n  paletteStop4:    vec4<f32>,\n  paletteStop5:    vec4<f32>,\n  paletteStop6:    vec4<f32>,\n  paletteStop7:    vec4<f32>,\n  paletteStop8:    vec4<f32>,\n  paletteStop9:    vec4<f32>,\n  paletteStop10:   vec4<f32>,\n  paletteStop11:   vec4<f32>,\n};\n@group(0) @binding(0) var<uniform> u: Uniforms;\n\n// ── The Orbs edge bank (WGSL) ───────────────────────────────────────────────\n// Two knobs every orb on the shelf carries: how soft its limb is, and how far\n// it glows past it. See effects/_shared/edge.ts for the contract.\n//\n// THREE files must agree — edge.wgsl, edge.metal, edge.sksl. Change one, change\n// all three, or the Code tab starts lying about what it ships.\n\n// How much wider than the shipped feather the Edge softness slider is asking\n// for. 0.005 is the width every orb was authored with, so this returns exactly\n// 0 at the default and every edge expression collapses to the constant it\n// replaced — the defaults are bit-identical to the render before the bank.\nfn mfEdgeD(soft: f32) -> f32 {\n  return soft - 0.005;\n}\n\n// The halo an orb throws past its own limb.\n//\n// ADDED, never subtracted: whatever the orb already paints out there — a\n// studio wall, its own exp() bleed, the sheet's cones — survives untouched.\n// That is what lets this be adopted by seventeen shaders whose backdrops have\n// nothing in common.\n//\n// `glow == 0` returns `col` by an early exit rather than by adding zero. Both\n// are exact, but the exit also skips the length() on the ~60% of the frame\n// outside the ball, and 0 is the default.\nfn mfEdgeGlow(col: vec3<f32>, uv: vec2<f32>, ctr: vec2<f32>, rad: f32,\n              soft: f32, glow: f32, glowRGB: vec3<f32>) -> vec3<f32> {\n  if (glow <= 0.0) { return col; }\n  let r = length(uv - ctr);\n  // Fenced to the outside of the limb by the same softness the limb uses, so\n  // the halo starts where the ball stops however soft that boundary is. Without\n  // it the exp() is 1 across the whole disc and washes the face flat.\n  let outside = smoothstep(rad - max(soft, 0.0005), rad + max(soft, 0.0005), r);\n  return col + glowRGB * (glow * exp(-max(r - rad, 0.0) * 11.0) * outside);\n}\n\n\n// ── The Orbs palette-ramp bank (WGSL) ───────────────────────────────────────\n// The add/remove colour list, evaluated INSIDE the shader so every stop paints\n// its own region of the ball instead of being averaged into a role colour.\n// See effects/_shared/ramp.ts for the contract.\n//\n// THREE files must agree — ramp.wgsl, ramp.metal, ramp.sksl. Change one, change\n// all three, or the Code tab starts lying about what it ships.\n\n// One stop, picked without a dynamic array index.\n//\n// A `var` array indexed by a runtime value is the shape that spills to scratch\n// memory on the GPUs this project cares about (PERFORMANCE.md); twelve selects\n// stay in registers and are branchless on every backend. Written once here so\n// no adopting shader has to.\nfn mfRampPick(idx: f32,\n              s0: vec3<f32>, s1: vec3<f32>, s2:  vec3<f32>, s3:  vec3<f32>,\n              s4: vec3<f32>, s5: vec3<f32>, s6:  vec3<f32>, s7:  vec3<f32>,\n              s8: vec3<f32>, s9: vec3<f32>, s10: vec3<f32>, s11: vec3<f32>) -> vec3<f32> {\n  var r = s0;\n  r = select(r, s1,  idx == 1.0);\n  r = select(r, s2,  idx == 2.0);\n  r = select(r, s3,  idx == 3.0);\n  r = select(r, s4,  idx == 4.0);\n  r = select(r, s5,  idx == 5.0);\n  r = select(r, s6,  idx == 6.0);\n  r = select(r, s7,  idx == 7.0);\n  r = select(r, s8,  idx == 8.0);\n  r = select(r, s9,  idx == 9.0);\n  r = select(r, s10, idx == 10.0);\n  r = select(r, s11, idx == 11.0);\n  return r;\n}\n\n// The CYCLIC ramp: `t` wraps, and the last stop runs back into the first.\n//\n// This is the one a generated-colour orb wants. Prism's hue comes from a cosine\n// of an unbounded scalar field, so its colour has always been periodic — a\n// clamped ramp would flatten every band past t == 1 into one colour and throw\n// the banding away. Wrapping keeps the field's structure exactly and only swaps\n// what the structure is *coloured* with.\n//\n// NOT ONE BRANCH IN HERE, and that is load-bearing rather than tidy. An orb\n// evaluates this next to a `fract(sin(x) * 43758.5453)` grain hash, which\n// amplifies a last-bit change in its argument by ~44000x. Any `if` in this file\n// or at a call site splits the fragment's basic block, the compiler stops\n// folding `uv / rad` into its uses, and the hash turns that into speckle up to\n// 33/255 — measured, on exactly the first cut of this bank. Straight-line code\n// keeps the untouched render bit-identical. Same reasoning as the early-out\n// guards every orb carries; see the note in orb-prism.wgsl.\nfn mfRampCyc(tIn: f32, n: f32,\n             s0: vec3<f32>, s1: vec3<f32>, s2:  vec3<f32>, s3:  vec3<f32>,\n             s4: vec3<f32>, s5: vec3<f32>, s6:  vec3<f32>, s7:  vec3<f32>,\n             s8: vec3<f32>, s9: vec3<f32>, s10: vec3<f32>, s11: vec3<f32>) -> vec3<f32> {\n  let k  = clamp(floor(n + 0.5), 1.0, 12.0);\n  let x  = fract(tIn) * k;\n  let i0 = min(floor(x), k - 1.0);\n  let i1 = select(i0 + 1.0, 0.0, i0 + 1.0 >= k);   // the wrap\n  return mix(mfRampPick(i0, s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11),\n             mfRampPick(i1, s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11),\n             x - i0);\n}\n\n// The CLAMPED ramp: stop 0 at t == 0, the last stop at t == 1, held outside.\n//\n// This is the one an orb with an authored dark→light body ramp wants — the\n// four-stop Deep/Mid/Surge/Crest shape, where the ends really are ends.\n//\n// Branchless for the same reason as `mfRampCyc`. The single-stop case falls out\n// of the arithmetic rather than needing an early return: k == 1 makes the span\n// zero, so x is 0, i0 is 0 and the mix weight is 0 — s0, exactly.\nfn mfRampLin(tIn: f32, n: f32,\n             s0: vec3<f32>, s1: vec3<f32>, s2:  vec3<f32>, s3:  vec3<f32>,\n             s4: vec3<f32>, s5: vec3<f32>, s6:  vec3<f32>, s7:  vec3<f32>,\n             s8: vec3<f32>, s9: vec3<f32>, s10: vec3<f32>, s11: vec3<f32>) -> vec3<f32> {\n  let k  = clamp(floor(n + 0.5), 1.0, 12.0);\n  let x  = clamp(tIn, 0.0, 1.0) * (k - 1.0);\n  let i0 = clamp(floor(x), 0.0, max(k - 2.0, 0.0));\n  return mix(mfRampPick(i0,     s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11),\n             mfRampPick(i0 + 1.0, s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11),\n             x - i0);\n}\n\n// ── The ramp as ONE value ───────────────────────────────────────────────────\n//\n// Thirteen uniforms is a reasonable thing for a shader to hold and a terrible\n// thing for a helper to take. Several orbs make their body colour deep inside\n// one — Glass·Liquid's fluid, the studio orbs' environment mirrors — and in the\n// MSL these files are transcribed against, a helper cannot read the stitchable\n// entry point's arguments, so the palette has to be handed down. Bundled like\n// this that is one parameter instead of thirteen, and the three languages stay\n// line-for-line.\n//\n// The stops come back out by CONSTANT index only, so this is still not a\n// dynamically indexed array and still cannot spill to scratch memory.\nstruct MfRamp {\n  n:   f32,\n  s0:  vec3<f32>, s1:  vec3<f32>, s2:  vec3<f32>, s3:  vec3<f32>,\n  s4:  vec3<f32>, s5:  vec3<f32>, s6:  vec3<f32>, s7:  vec3<f32>,\n  s8:  vec3<f32>, s9:  vec3<f32>, s10: vec3<f32>, s11: vec3<f32>,\n};\n\nfn mfRampOf(n: f32,\n            s0: vec3<f32>, s1: vec3<f32>, s2:  vec3<f32>, s3:  vec3<f32>,\n            s4: vec3<f32>, s5: vec3<f32>, s6:  vec3<f32>, s7:  vec3<f32>,\n            s8: vec3<f32>, s9: vec3<f32>, s10: vec3<f32>, s11: vec3<f32>) -> MfRamp {\n  return MfRamp(n, s0, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10, s11);\n}\n\nfn mfRampCycR(t: f32, r: MfRamp) -> vec3<f32> {\n  return mfRampCyc(t, r.n, r.s0, r.s1, r.s2, r.s3, r.s4, r.s5,\n                   r.s6, r.s7, r.s8, r.s9, r.s10, r.s11);\n}\n\nfn mfRampLinR(t: f32, r: MfRamp) -> vec3<f32> {\n  return mfRampLin(t, r.n, r.s0, r.s1, r.s2, r.s3, r.s4, r.s5,\n                   r.s6, r.s7, r.s8, r.s9, r.s10, r.s11);\n}\n\n\n// Fluid geometry, in ball radii (|p| == 1 on the ball's edge, y up).\n// Default balanced/eco keeps one fluid evaluation per pixel. High quality\n// preserves the original three-channel optical dispersion along the rim.\nconst GL_HIGH_DISPERSION: bool = false;\nconst GL_FU:   f32 = 0.88172043;   // canvas half-side = 0.82/0.93 R\n\n// Pure fluid keeps tighter diffusion; enabling glass restores the source's 5px\n// frosted diffusion inside the inset shell.\nconst GL_BSIG_CLEAR: f32 = 0.01800000;\nconst GL_BSIG_GLASS: f32 = 0.03990000;\n\n// --- the three constants the frequency-domain blur is fitted on -------------\n// A gaussian's response is exp(-k²σ²/2), so GL_KA is k²/2 for the wavenumber\n// where smoothstep-interpolated value noise actually keeps its energy. The\n// textbook choice — one cycle per noise cell, k = 2π, GL_KA = 19.74 — blurs too\n// hard, because the smoothstep interpolation is itself a low-pass and pulls the\n// effective k down to about 3.5. Fitted against the 13-tap render.\nconst GL_KA:  f32 = 6.0;\n// (2.03)² — how σ grows, in its own octave's cells, from one octave to the next.\nconst GL_KG:  f32 = 4.1209;\n// The warp field displaces the fluid rather than colouring it, so blurring the\n// image does not attenuate it as strongly as the model says. Also fitted.\nconst GL_KWA: f32 = 0.5;\n// One value-noise octave's standard deviation about its own mean, as a fraction\n// of its range — the scale that turns \"amplitude the attenuation removed\" into\n// \"how far the removed detail typically pushed the value\".\nconst GL_KR:  f32 = 0.32;\nconst GL_GH:  f32 = 1.73205081;   // sqrt(3), the 3-point Gauss-Hermite abscissa\n\n// Pure fluid reaches the ball edge.\nconst GL_CLEAR_EA: f32 = 0.995;\nconst GL_CLEAR_EB: f32 = 1.04;\n\n// ---------------------------------------------------------------------------\n// The sheet's liquid noise bank. Five octaves, gain .5, normalised by the\n// weight sum, and rotated every octave. This is NOT the bank the sheet's Prism\n// screen uses (a different hash, gain .55, unnormalised, no rotation).\n// ---------------------------------------------------------------------------\nfn lqHash(pIn: vec2<f32>) -> f32 {\n  var p = fract(pIn * vec2<f32>(123.34, 456.21));\n  p = p + vec2<f32>(dot(p, p + vec2<f32>(45.32)));\n  return fract(p.x * p.y);\n}\n\nfn lqNoise(p: vec2<f32>) -> f32 {\n  let i = floor(p);\n  var f = fract(p);\n  f = f * f * (3.0 - 2.0 * f);\n  return mix(mix(lqHash(i), lqHash(i + vec2<f32>(1.0, 0.0)), f.x),\n             mix(lqHash(i + vec2<f32>(0.0, 1.0)), lqHash(i + vec2<f32>(1.0, 1.0)), f.x), f.y);\n}\n\n// The fbm, pre-blurred. `bs` is the blur's sigma expressed in THIS call's input\n// units — the caller scales it by whatever it scaled the domain by. Returns\n// `.x` the attenuated value and `.y` the standard deviation of the detail the\n// attenuation took out, which is what a following nonlinearity has to integrate\n// over. Both are exact for a gaussian window: the surviving amplitude is β and\n// the variance that leaves is (1 - β²), per octave, weighted by that octave's\n// own share of the normalised sum.\nfn lqFbm(pIn: vec2<f32>, bs: f32) -> vec2<f32> {\n  var p = pIn;\n  var s:  f32 = 0.0;\n  var a:  f32 = 0.5;\n  var m:  f32 = 0.0;\n  var vr: f32 = 0.0;\n  let e = -GL_KA * bs * bs;\n  var g: f32 = 1.0;\n  for (var i: i32 = 0; i < 5; i = i + 1) {\n    let b = exp(e * g);\n    s  = s  + a * (0.5 + b * (lqNoise(p) - 0.5));\n    vr = vr + a * a * (1.0 - b * b);\n    m  = m + a;\n    a  = a * 0.5;\n    g  = g * GL_KG;\n    // GLSL's mat2(.8,.6,-.6,.8) is COLUMN-major — columns (.8,.6) and\n    // (-.6,.8) — so the product is written out rather than constructed.\n    p = vec2<f32>(0.8 * p.x - 0.6 * p.y, 0.6 * p.x + 0.8 * p.y) * 2.03;\n  }\n  return vec2<f32>(s / m, GL_KR * sqrt(vr) / m);\n}\n\nfn lqRidge(v: f32, k: f32) -> f32 {\n  return pow(clamp(1.0 - abs(v * 2.0 - 1.0), 0.0, 1.0), k);\n}\n\n// The sheet's four-stop ramp, shared by every branch of every program.\nfn lqRamp(v: f32, cA: vec3<f32>, cB: vec3<f32>, cC: vec3<f32>, cD: vec3<f32>) -> vec3<f32> {\n  var c = mix(cA, cB, smoothstep(0.0, 0.45, v));\n  c = mix(c, cC, smoothstep(0.38, 0.72, v));\n  c = mix(c, cD, smoothstep(0.68, 1.0, v));\n  // The editor's four colours are the default ramp. An optional custom palette\n  // can replace them without changing the scalar field that produces `v`.\n  return select(c, mfRampLin(v, u.paletteCount,\n                             u.paletteStop0.rgb, u.paletteStop1.rgb, u.paletteStop2.rgb,\n                             u.paletteStop3.rgb, u.paletteStop4.rgb, u.paletteStop5.rgb,\n                             u.paletteStop6.rgb, u.paletteStop7.rgb, u.paletteStop8.rgb,\n                             u.paletteStop9.rgb, u.paletteStop10.rgb, u.paletteStop11.rgb), u.paletteCount > 0.5);\n}\n\n// ---------------------------------------------------------------------------\n// The three nonlinearities the fluid applies to a pre-blurred field, each\n// integrated over the detail `lqFbm` attenuated away. Three-point\n// Gauss-Hermite — nodes 0 and ±sqrt(3)·sd, weights 4/6 and 1/6 — reproduces a\n// gaussian's second AND fourth moments, which is what keeps a ridged filament\n// spreading as it dims instead of just dimming. `vs` is an `lqFbm` result:\n// `.x` the value, `.y` that standard deviation.\n// ---------------------------------------------------------------------------\nfn lqRidgeS(vs: vec2<f32>, k: f32) -> f32 {\n  let d = GL_GH * vs.y;\n  return (lqRidge(vs.x - d, k) + 4.0 * lqRidge(vs.x, k) + lqRidge(vs.x + d, k)) / 6.0;\n}\n\nfn lqStepS(vs: vec2<f32>, a: f32, b: f32) -> f32 {\n  let d = GL_GH * vs.y;\n  return (smoothstep(a, b, vs.x - d) + 4.0 * smoothstep(a, b, vs.x)\n        + smoothstep(a, b, vs.x + d)) / 6.0;\n}\n\nfn lqPowS(vs: vec2<f32>, k: f32) -> f32 {\n  let d = GL_GH * vs.y;\n  return (pow(clamp(vs.x - d, 0.0, 1.0), k) + 4.0 * pow(clamp(vs.x, 0.0, 1.0), k)\n        + pow(clamp(vs.x + d, 0.0, 1.0), k)) / 6.0;\n}\n\n// ---------------------------------------------------------------------------\n// Curated local flow programs. Each preset owns a different spatial model;\n// colour changes are secondary to silhouette, frequency, and motion structure.\n// ---------------------------------------------------------------------------\n\nfn glsFinishPresetFluid(colorIn: vec3<f32>, p: vec2<f32>) -> vec3<f32> {\n  var color = colorIn;\n  color = mix(color, u.highlightColor.rgb,\n              u.shade * 0.22 * smoothstep(0.15, 1.15, dot(p, vec2<f32>(-0.32, 0.78))));\n  color = color * (1.0 - u.shade * 0.34\n                  * smoothstep(-0.1, 1.2, dot(p, vec2<f32>(0.45, -0.62))));\n  color = color * (1.0 - u.shade * 0.22 * smoothstep(0.72, 1.08, length(p)));\n  return clamp(color, vec3<f32>(0.0), vec3<f32>(1.0));\n}\n\nfn glsFinishEmissionFluid(colorIn: vec3<f32>, p: vec2<f32>) -> vec3<f32> {\n  var color = colorIn;\n  if (u.glassEnabled > 0.5) {\n    color = mix(color, u.highlightColor.rgb,\n                u.shade * 0.22 * smoothstep(0.15, 1.15, dot(p, vec2<f32>(-0.32, 0.78))));\n  }\n  color = color * (1.0 - u.shade * 0.34\n                  * smoothstep(-0.1, 1.2, dot(p, vec2<f32>(0.45, -0.62))));\n  color = color * (1.0 - u.shade * 0.22 * smoothstep(0.72, 1.08, length(p)));\n  return clamp(color, vec3<f32>(0.0), vec3<f32>(1.0));\n}\n\nfn glsSiriBand(q: vec2<f32>, drift: f32, phaseOffset: f32, amplitude: f32,\n               mainY: f32, envelope: f32, softness: f32) -> vec2<f32> {\n  let y = amplitude * envelope * sin(q.x * 1.0 + drift + phaseOffset);\n  let distanceToLine = abs(q.y - y);\n  let line = 0.018 / (sqrt(distanceToLine * distanceToLine + softness * softness) + 0.026);\n  let bandDistance = max(0.0, max(q.y - max(mainY, y), min(mainY, y) - q.y));\n  let band = 0.018 / (bandDistance + 0.075);\n  return vec2<f32>(line, band);\n}\n\nfn glsSiriFluid(p: vec2<f32>, t: f32) -> vec3<f32> {\n  // The reference wave is a main sinusoid plus four chromatically separated\n  // waves. Their enclosed bands carry colour while the shared crest stays hot.\n  let scale = 0.74 + u.zoom * 0.34;\n  let q = p / scale;\n  let xNorm = q.x;\n  let envelopeBase = cos(1.57079633 * min(abs(0.9 * xNorm), 1.0));\n  let envelope = envelopeBase * envelopeBase;\n  let low = 0.5 + 0.5 * cos(t * 0.37);\n  let mid = 0.5 + 0.5 * sin(t * 0.51 + 1.2);\n  let high = 0.5 + 0.5 * cos(t * 0.73 + 2.1);\n  let drift = t * 2.4;\n  let mainAmplitude = 0.25 + u.ridgeAmt * 0.075 + low * 0.018;\n  let bandAmplitude = mainAmplitude + mid * 0.025 + high * 0.018;\n  let mainY = mainAmplitude * envelope * sin(q.x * 1.1 + drift);\n  let separation = 1.85 + u.warp * 0.2 + mid * 0.28;\n  let softness = 0.035 + (1.0 - u.ridgeAmt) * 0.018 + mid * 0.006;\n\n  let band0 = glsSiriBand(q, drift, -separation, bandAmplitu colorC.rgb, 0.46) * membrane * 0.34;\n  color = color + u.highlightColor.rgb * crest * 0.14;\n  color = color * (0.58 + 0.42 * depth);\n  return glsFinishPresetFluid(color, p);\n}\n\nfn glsBlueDropFluid(p: vec2<f32>, t: f32) -> vec3<f32> {\n  // Slow diagonal advection keeps the broad liquid bodies coherent. The two\n  // shear waves replace the reference orb's circular, looped point motion.\n  let depth = sqrt(max(1.0 - clamp(dot(p, p), 0.0, 1.0), 0.0));\n  var q = p * mix(0.72, 1.0, depth * 0.62 + 0.38);\n  q = glsRotate(q, -0.24 + 0.06 * sin(t * 0.17));\n  let scale = 1.0 + u.zoom * 1.12;\n  let blur = 0.012 + 0.006 * u.zoom;\n  let driftA = lqFbm(q * 1.28 + vec2<f32>(t * 0.095, -t * 0.034), blur * 1.28);\n  let driftB = lqFbm(glsRotate(q, 1.08) * 1.62\n                     + vec2<f32>(-t * 0.042, t * 0.078), blur * 1.62);\n  var flowed = q + vec2<f32>(driftA.x - 0.5, driftB.x - 0.5)\n                 * (0.24 + u.warp * 0.1);\n  flowed.x = flowed.x + sin(flowed.y * 2.15 + t * 0.24) * (0.035 + u.warp * 0.012);\n  flowed.y = flowed.y + sin(flowed.x * 1.38 - t * 0.18) * (0.045 + u.warp * 0.01);\n  let body = lqFbm(flowed * scale + vec2<f32>(t * 0.025, -t * 0.018), blur * scale);\n  let marble = lqRidgeS(lqFbm(flowed * (1.72 + u.zoom * 0.9)\n                              + vec2<f32>(2.7, -t * 0.035),\n                              blur * (1.72 + u.zoom * 0.9)),\n                            0.8 + u.sharp * 0.46);\n  let value = clamp(mix(body.x, body.x * 0.62 + marble * 0.58, u.ridgeAmt), 0.0, 1.0);\n  var color = lqRamp(value, u.colorA.rgb, u.colorB.rgb, u.colorC.rgb, u.colorD.rgb);\n  let light = pow(max(dot(normalize(vec3<f32>(p, depth)),\n                          normalize(vec3<f32>(-0.48, 0.62, 0.92))), 0.0), 3.2);\n  color = mix(color, u.highlightColor.rgb, light * (0.035 + 0.05 * u.shade));\n  color = color * (0.74 + 0.26 * depth);\n  return glsFinishPresetFluid(color, p);\n}\n\nfn glsVioletEmberFluid(p: vec2<f32>, t: f32) -> vec3<f32> {\n  // A radial twist and two crossing drift fields make heavy molten folds. This\n  // moves as a breathing spiral instead of the reference orb's closed circles.\n  let scale = 1.08 + u.zoom * 1.18;\n  let blur = 0.011 + 0.005 * u.zoom;\n  let radius = length(p);\n  let twist = t * 0.055 + radius * (0.72 + u.warp * 0.11)\n              + 0.08 * sin(t * 0.31 + radius * 4.0);\n  let q = glsRotate(p * scale, twist);\n  let low = lqFbm(q * 1.18 + vec2<f32>(t * 0.068, -t * 0.105), blur * 1.18);\n  let cross = lqFbm(glsRotate(q, -1.12) * 1.52\n                    + vec2<f32>(-t * 0.094, t * 0.042)\n                    + vec2<f32>(low.x * 1.35, -low.x * 0.72), blur * 1.52);\n  let warped = q + vec2<f32>(low.x - 0.5, cross.x - 0.5)\n                   * (0.3 + u.warp * 0.12);\n  let melt = lqFbm(warped * 1.34\n                   + vec2<f32>(cross.x * 1.48, low.x * 1.12), blur * 1.34);\n  let veins = lqRidgeS(lqFbm(warped * (2.05 + u.zoom * 0.72)\n                             + vec2<f32>(-2.1, t * 0.052),\n                             blur * (2.05 + u.zoom * 0.72)),\n                           0.82 + u.sharp * 0.58);\n  let heat = smoothstep(0.18, 0.92,\n                        melt.x * (0.72 - u.ridgeAmt * 0.16)\n                        + veins * (0.32 + u.ridgeAmt * 0.5));\n  var color = lqRamp(heat, u.colorA.rgb, u.colorB.rgb, u.colorC.rgb, u.colorD.rgb);\n  let pulse = 0.94 + 0.06 * sin(t * 0.44 + melt.x * 5.0);\n  color = color * pulse;\n  color = mix(color, u.highlightColor.rgb, pow(veins, 4.0) * 0.045);\n  return glsFinishPresetFluid(color, p);\n}\n\nfn glsRefractiveBlobFluid(p: vec2<f32>, t: f32) -> vec3<f32> {\n  // Broad advected cells give the lens something legible to bend. A slower\n  // caustic ribbon crosses those cells out of phase, so the material evolves\n  // without looking like a texture rotating inside a fixed sphere.\n  let radial2 = clamp(dot(p, p), 0.0, 1.0);\n  let depth = sqrt(max(1.0 - radial2, 0.0));\n  let scale = 0.82 + u.zoom * 1.08;\n  let blur = 0.012 + 0.005 * u.zoom;\n  var q = glsRotate(p * scale, 0.08 * sin(t * 0.17));\n  let driftA = lqFbm(q * 1.16 + vec2<f32>(t * 0.052, -t * 0.078), blur * 1.16);\n  let driftB = lqFbm(glsRotate(q, 1.21) * 1.34\n                     + vec2<f32>(-t * 0.064, t * 0.041), blur * 1.34);\n  q = q + vec2<f32>(driftA.x - 0.5, driftB.x - 0.5)\n          * (0.34 + u.warp * 0.105);\n\n  let body = lqFbm(q * 1.42 + vec2<f32>(driftB.x * 0.82, driftA.x * 0.66),\n                   blur * 1.42);\n  let ribbonPhase = q.y * (2.2 + u.warp * 0.11)\n                  + sin(q.x * 1.72 - t * 0.19) * 0.92\n                  + sin((q.x + q.y) * 1.08 + t * 0.13) * 0.46;\n  let ribbon = pow(clamp(1.0 - abs(sin(ribbonPhase)), 0.0, 1.0),\n                   0.82 + u.sharp * 0.23);\n  let fold = lqRidgeS(lqFbm(q * 2.05 + vec2<f32>(2.8, -t * 0.037),\n                            blur * 2.05), 0.9 + u.sharp * 0.32);\n  let value = clamp(body.x * 0.5 + driftA.x * 0.16\n                    + ribbon * (0.2 + u.ridgeAmt * 0.2)\n                    + fold * u.ridgeAmt * 0.18, 0.0, 1.0);\n\n  var color = lqRamp(value, u.colorA.rgb, u.colorB.rgb, u.colorC.rgb, u.colorD.rgb);\n  let caustic = pow(ribbon, 3.1) * (0.24 + 0.28 * u.ridgeAmt)\n               + pow(fold, 4.2) * 0.08;\n  color = mix(color, u.colorD.rgb, clamp(caustic, 0.0, 0.52));\n  color = color * (0.7 + depth * 0.3);\n  let key = pow(max(dot(normalize(vec3<f32>(p, depth)),\n                        normalize(vec3<f32>(-0.42, 0.58, 0.9))), 0.0), 4.0);\n  color = mix(color, u.highlightColor.rgb, key * 0.055);\n  return glsFinishPresetFluid(color, p);\n}\n\nfn glsParticleRibbonFluid(p: vec2<f32>, t: f32) -> vec3<f32> {\n  // The visible body is emitted by the dedicated particle pipeline. Keeping\n  // this branch empty lets the shared fullscreen pass contribute only the\n  // optional glass shell and its transparent background contract.\n  return vec3<f32>(0.0);\n}\n\nfn glsPresetFluid(p: vec2<f32>, style: i32, t: f32) -> vec3<f32> {\n  if (style == 9) { return glsSiriFluid(p, t); }\n  if (style == 10) { return glsAuroraFluid(p, t); }\n  if (style == 11) { return glsPlasmaFluid(p, t); }\n  if (style == 12) { return glsChromeFluid(p, t); }\n  if (style == 13) { return glsOpalFluid(p, t); }\n  if (style == 14) { return glsSpectrumFluid(p, t); }\n  if (style == 15) { return glsFrostFluid(p, t); }\n  if (style == 19) { return glsVoiceWaveFluid(p, t); }\n  if (style == 20) { return glsBlueDropFluid(p, t); }\n  if (style == 21) { return glsVioletEmberFluid(p, t); }\n  if (style == 22) { return glsChromaticMetalFluid(p, t); }\n  if (style == 23) { return glsRefractiveBlobFluid(p, t); }\n  if (style == 24) { return glsParticleRibbonFluid(p, t); }\n  return glsFrostFluid(p, t);\n}\n\n// ---------------------------------------------------------------------------\n// The fluid, at one point, already blurred and straight (not premultiplied):\n// the sheet's shader on `fu` — both programs, all four inner branches, and the\n// shared shade tail — with the blur folded into the noise bank as above. The\n// disc's own alpha is the caller's, because it is analytic now.\n// ---------------------------------------------------------------------------\nfn glsFluid(fu: vec2<f32>, md: i32, t: f32) -> vec3<f32> {\n  let df = length(fu);\n\n  let cA = u.colorA.rgb;\n  let cB = u.colorB.rgb;\n  let cC = u.colorC.rgb;\n  let cD = u.colorD.rgb;\n\n  // The blur's sigma, carried from fluid units into the fluid's own domains.\n  // `sp` is it in pp/q units — the warp shifts q about but does not stretch it\n  // on average, so pp and q share one. `sw` is the warp field's own, softened\n  // by GL_KWA.\n  let blurSigma = select(GL_BSIG_CLEAR, GL_BSIG_GLASS, u.glassEnabled > 0.5);\n  let sp = blurSigma * u.zoom;\n  let sw = sp * 1.1 * GL_KWA;\n\n  var fcol: vec3<f32>;\n  if (md < 0) {\n    // progA — the warped body, the only branch with the slow vertical drift\n    // and the only one that reads Ridge.\n    var pp = fu * u.zoom;\n    pp.y = pp.y + t * 0.05;\n    let w = vec2<f32>(lqFbm(pp * 1.1 + vec2<f32>(0.0, t * 0.09), sw).x,\n                      lqFbm(pp * 1.1 + vec2<f32>(7.7, -t * 0.07), sw).x);\n    let q = pp + u.warp * (w - vec2<f32>(0.5));\n    let body  = lqFbm(q * 1.5 + vec2<f32>(t * 0.04, 0.0), sp * 1.5);\n    let veins = lqRidgeS(lqFbm(q * 2.2 + vec2<f32>(3.1), sp * 2.2), u.sharp);\n    let v = mix(lqStepS(body, 0.12, 0.88),\n                clamp(veins * 0.85 + 0.45 * body.x, 0.0, 1.0), u.ridgeAmt);\n    fcol = lqRamp(v, cA, cB, cC, cD);\n  } else {\n    // progB — same warp, no vertical drift, four inner branches.\n    let pp = fu * u.zoom;\n    let w = vec2<f32>(lqFbm(pp * 1.1 + vec2<f32>(0.0, t * 0.09), sw).x,\n                      lqFbm(pp * 1.1 + vec2<f32>(7.7, -t * 0.07), sw).x);\n    let q = pp + u.warp * (w - vec2<f32>(0.5));\n    if (md == 0) {\n      // Nectar — a sine band the noise leans on. The fbm is INSIDE the sine, so\n      // the removed detail integrates out in closed form rather than by\n      // quadrature: E[sin(A + 6e)] = sin(A)·exp(-18·sd²). The second term of\n      // the exponent is the same integral for the sine's own `q.x * 7.0`, which\n      // the blur attenuates by exp(-49·sp²/2).\n      let n0 = lqFbm(q * 2.2, sp * 2.2);\n      let damp = exp(-18.0 * n0.y * n0.y - 24.5 * sp * sp);\n      var v = 0.5 + 0.5 * damp * sin(q.x * 7.0 + n0.x * 6.0 + t * 0.35);\n      v = mix(v, lqFbm(q * 1.4 + vec2<f32>(t * 0.03), sp * 1.4).x, 0.25);\n      fcol = lqRamp(v, cA, cB, cC, cD);\n    } else if (md == 1) {\n      // Lumen — two ridged fields multiplied into filaments. The two fields are\n      // independent, so each integrates its own detail out before the product.\n      let v = lqRidgeS(lqFbm(q * 1.4 + vec2<f32>(t * 0.06, 0.0), sp * 1.4), u.sharp)\n            * lqRidgeS(lqFbm(q * 1.7 - vec2<f32>(0.0, t * 0.05), sp * 1.7), u.sharp);\n      fcol = lqRamp(pow(v, 0.7), cA, cB, cC, cD);\n    } else if (md == 6) {\n      // Sprig — noise warped by noise, with a ridged edge darkening it     const audioFlowStrengths = {"9":0.8,"10":0.65,"11":0.65,"14":0.75,"19":1,"21":0.7};
    function applyAudioUniforms(values, bands) {
      const strength = audioFlowStrengths[Math.round(values[15])] ?? 0;
      if (!strength) return;
      for (const [index, band, additive, proportional, ceiling] of audioRules) {
        const input = bands[band];
        const level = (Number.isFinite(input) ? Math.max(0, Math.min(1, input)) : 0) * strength;
        if (!level) continue;
        values[index] = Math.min(Math.max(ceiling, values[index]), values[index] * (1 + proportional * level) + additive * level);
      }
    }
    let audioBands = { low: 0, mid: 0, high: 0, all: 0 };
    // Feed normalized 0...1 bands from your audio analyser; zero them on stop.
    function setAudioBands(bands = {}) {
      audioBands = Object.fromEntries(["low", "mid", "high", "all"].map(key => [key,
        Number.isFinite(bands[key]) ? Math.max(0, Math.min(1, bands[key])) : 0]));
    }

    function srgbToLinear(value) {
      return value <= 0.04045
        ? value / 12.92
        : ((value + 0.055) / 1.055) ** 2.4;
    }

    function linearToSrgb(value) {
      return value <= 0.0031308
        ? value * 12.92
        : 1.055 * value ** (1 / 2.4) - 0.055;
    }

    function mixSrgb(from, to, progress) {
      return linearToSrgb(
        srgbToLinear(from) + (srgbToLinear(to) - srgbToLinear(from)) * progress,
      );
    }

    function transitionProgress(now) {
      if (activeTransitionDuration === 0) return 1;
      const raw = Math.min(1, Math.max(0, (now - transitionStartedAt) / activeTransitionDuration));
      return transitionTargetState === "thinking"
        ? 1 - (1 - raw) ** 3
        : raw * raw * (3 - 2 * raw);
    }

    function sampleTransition(now) {
      const progress = transitionProgress(now);
      for (let index = 3; index < displayedUniforms.length; index += 1) {
        const colorComponent = index >= 40
          && (index - 40) % 4 < 3;
        displayedUniforms[index] = colorComponent
          ? mixSrgb(fromUniforms[index], targetUniforms[index], progress)
          : fromUniforms[index] + (targetUniforms[index] - fromUniforms[index]) * progress;
      }
      displayedUniforms[19] = glassEnabled ? 1 : 0;
      return displayedUniforms;
    }

    function setState(nextState) {
      if (!Object.prototype.hasOwnProperty.call(stateSeeds, nextState)) {
        throw new TypeError(`Unknown liquid orb state: ${nextState}`);
      }
      if (nextState === state) return;

      const now = performance.now();
      sampleTransition(now);
      fromUniforms = new Float32Array(displayedUniforms);
      targetUniforms = new Float32Array(stateSeeds[nextState]);
      transitionTargetState = nextState;
      transitionStartedAt = now;
      activeTransitionDuration = nextState === "thinking"
        ? activationDurationMs
        : settleDurationMs;
      state = nextState;
      if (!playing) { displayedUniforms.set(targetUniforms); activeTransitionDuration = 0; }
      updateControls(); requestDraw();
    }

    Object.defineProperty(window, "liquidOrb", {
      value: Object.freeze({
        getState: () => state,
        setState,
        setAudioBands,
        setPlaying,
        setGlass,
        setSpeed,
        getPerformance: () => ({
          quality, mode: qualityMode.current, targetFps, renderDpr: renderDpr(),
          displayScale, lastLatencyMs, inViewport, gpuPending, playing,
        }),
        setQuality: chooseQualityMode,
      }),
    });

    function stopWithError(error) {
      if (stopped) return;
      stopped = true;
      cancelAnimationFrame(animationFrame);
      viewportObserver?.disconnect();
      ribbonTarget?.destroy();
      device?.destroy();
      document.body.classList.add("fallback");
      document.querySelector("#engine").textContent = "渲染不可用";
      loadingLabel.textContent = "WebGPU 不可用";
      loadingTrack.removeAttribute("aria-valuenow");
      status.hidden = false;
      status.textContent = "浏览器或图形设备不支持此效果，请尝试更新浏览器。";
      sendHost("error", { label: "WebGPU 不可用" });
      status.title = error instanceof Error ? error.message : String(error);
      console.warn("[Liquid Orb]", error);
    }

    async function start() {
      setLoading(12, "正在检测 WebGPU…");
      if (!navigator.gpu) throw new Error("WebGPU is not supported in this environment.");
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error("No compatible WebGPU adapter was found.");
      setLoading(28, "正在连接图形适配器…");
      device = await adapter.requestDevice();
      setLoading(48, "正在初始化图形设备…");
      const context = canvas.getContext("webgpu");
      if (!context) throw new Error("Unable to create a WebGPU canvas context.");

      const format = navigator.gpu.getPreferredCanvasFormat();
      context.configure({ device, format, alphaMode: "premultiplied" });
      const shader = device.createShaderModule({ code: shaderSource });
      const compilation = await shader.getCompilationInfo();
      const errors = compilation.messages.filter((message) => message.type === "error");
      if (errors.length) {
        throw new Error(errors.map((message) => `${message.lineNum}:${message.linePos} ${message.message}`).join("\n"));
      }
      setLoading(70, "着色器编译完成");

      const createMainPipeline = module => device.createRenderPipelineAsync({
        layout: "auto",
        vertex: { module, entryPoint: "vs_main" },
        fragment: {
          module,
          entryPoint: "fs_main",
          targets: [{
            format,
            blend: {
              color: {
                srcFactor: "one",
                dstFactor: "one-minus-src-alpha",
                operation: "add",
              },
              alpha: {
                srcFactor: "one",
                dstFactor: "one-minus-src-alpha",
                operation: "add",
              },
            },
          }],
        },
        primitive: { topology: "triangle-list" },
      });
      const pipeline = await createMainPipeline(shader);
      const values = new Float32Array(displayedUniforms);
      const uniformBuffer = device.createBuffer({
        size: values.byteLength,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });
      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });
      let highPipeline = null;
      let highBindGroup = null;
      let highCompiling = false;
      ensureHighPipeline = () => {
        if (highPipeline || highCompiling || highPipelineUnavailable || stopped) return;
        highCompiling = true;
        (async () => {
          const highSource = shaderSource.replace(
            "const GL_HIGH_DISPERSION: bool = false;",
            "const GL_HIGH_DISPERSION: bool = true;",
          );
          const highShader = device.createShaderModule({ code: highSource });
          const errors = (await highShader.getCompilationInfo()).messages
            .filter(message => message.type === "error");

            layout: compiled.getBindGroupLayout(0),
            entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],

      let ribbonPipeline = null;
      let ribbonCompositePipeline = null;
      let ribbonBindGroup = null;
      let ribbonSampler = null;
      let ribbonCompiling = false;

        (async () => {
      const nextRibbonPipeline = await device.createRenderPipelineAsync({
        layout: "auto",
        vertex: { module: shader, entryPoint: "ribbon_vs_main" },
        fragment: {
          module: shader,
          entryPoint: "ribbon_fs_main",
          targets: [{
            format,
            blend: {
              color: { srcFactor: "one", dstFactor: "one", operation: "add" },

                srcFactor: "one",
                dstFactor: "one-minus-src-alpha",
                operation: "add",

        primitive: { topology: "triangle-list" },

        layout: "auto",
        vertex: { module: shader, entryPoint: "vs_main" },
        fragment: {
          module: shader,
          entryPoint: "ribbon_composite_fs_main",
          targets: [{
            format,
            blend: {
              color: {
                srcFactor: "one",
                dstFactor: "one-minus-src-alpha",
                operation: "add",
              },
              alpha: {
                srcFactor: "one",
                dstFactor: "one-minus-src-alpha",
                operation: "add",
              },
            },
          }],
        },
        primitive: { topology: "triangle-list" },

          ribbonPipeline = nextRibbonPipeline;
          ribbonCompositePipeline = nextRibbonCompositePipeline;

            layout: ribbonPipeline.getBindGroupLayout(0),
            entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],

            addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge",
            magFilter: "linear", minFilter: "linear",

      let ribbonCompositeBindGroup = null;
      setLoading(85, "正在准备第一帧…");

          const dpr = renderDpr();

            ? 0
            : Math.min(0.1, Math.max(0, (now - lastFrameAt) / 1000));

          motionPhase += playing ? frameDelta * Math.max(values[3], 0) * speedFactor : 0;

          values[1] = height;

                size: { width, height },

          const pass = encoder.beginRenderPass({
            colorAttachments: [{
              view: context.getCurrentTexture().createView(),
              clearValue: { r: 0, g: 0, b: 0, a: 0 },
              loadOp: "clear",
              storeOp: "store",

            pass.setPipeline(ribbonCompositePipeline);
            pass.setBindGroup(0, ribbonCompositeBindGroup);

            pass.setPipeline(useHigh ? highPipeline : pipeline);
            pass.setBindGroup(0, useHigh ? highBindGroup : bindGroup);

          pass.end();

          const submittedAt = performance.now();
          if (!firstFrameReady) setLoading(94, "正在等待首帧渲染…");
          // Backpressure: never submit a second GPU frame before the previous
          // submission completes. This prevents an overloaded GPU queue.
          device.queue.onSubmittedWorkDone().then(() => {
            if (stopped) return;
            gpuPending = false;
            if (playing) {
              gpuLatencyTotal += performance.now() - submittedAt;
              gpuLatencySamples += 1;
              const sampledAt = performance.now();
              if (gpuLatencySamples >= 18 && sampledAt - qualityAdjustedAt >= 4000) {
                // Completion latency includes queue/scheduling, not exact GPU time.
                // Hysteresis prevents oscillation when the browser briefly stalls.

                lastLatencyMs = Math.round(meanLatency * 10) / 10;
                gpuLatencyTotal = 0;
                gpuLatencySamples = 0;
                qualityAdjustedAt = sampledAt;
                if (qualityMode.current === "auto" && !reducedMotion.matches) {
                  const budgetMs = 1000 / targetFps;
                  overBudgetWindows = meanLatency > budgetMs * 0.9 ? overBudgetWindows + 1 : 0;
                  underBudgetWindows = meanLatency < budgetMs * 0.42 ? underBudgetWindows + 1 : 0;
                  if (overBudgetWindows >= 2 && sampledAt - lastQualityChangeAt >= 4000) {
                    overBudgetWindows = underBudgetWindows = 0;
                    if (quality === "high") applyActiveQuality("balanced");
                    else if (adaptiveDpr > profile.minDpr + 0.02) {
                      adaptiveDpr = Math.max(profile.minDpr, Math.round((adaptiveDpr - 0.15) * 100) / 100);
                    } else if (targetFps > 20) targetFps = 20;
                    else if (quality === "balanced") applyActiveQuality("eco");
                    else targetFps = 15;
                    lastQualityChangeAt = sampledAt;
                  } else if (underBudgetWindows >= 3 && sampledAt - lastQualityChangeAt >= 12000) {
                    underBudgetWindows = overBudgetWindows = 0;
                    if (targetFps < profile.fps) targetFps = profile.fps;
                    else if (adaptiveDpr + 0.02 < profile.maxDpr) {
                      adaptiveDpr = Math.min(profile.maxDpr, Math.round((adaptiveDpr + 0.1) * 100) / 100);
                    } else if (quality === "eco" && !saveData) {
                      applyActiveQuality("balanced");
                    } else if (quality === "balanced" && !highPipelineUnavailable &&
                      !saveData && canvas.clientWidth * canvas.clientHeight <= 230000) {
                      applyActiveQuality("high");
                    }
                    lastQualityChangeAt = sampledAt;
                  }
                }
                updateQualityStatus();
              }
            }
            if (!firstFrameReady) {
              firstFrameReady = true;
              setLoading(100, "渲染就绪");
              document.body.classList.add("ready");
              document.querySelector("#engine").textContent = "WebGPU";
              sendHost("ready", { state });
            }
            const requested = needsRedraw;
            needsRedraw = false;
            if (requested || playing || transitionProgress(performance.now()) < 1) requestDraw();
          }).catch(stopWithError);
        } catch (error) {
          stopWithError(error);
        }
      }

      requestDraw = () => {
        if (stopped || document.hidden || !inViewport) return;
        if (gpuPending) { needsRedraw = true; return; }
        if (!animationFrame) animationFrame = requestAnimationFrame(frame);
      };
      if (typeof IntersectionObserver !== "undefined") {
        viewportObserver = new IntersectionObserver(entries => {
          const visible = entries.some(entry => entry.isIntersecting);
          if (visible === inViewport) return;
          inViewport = visible;
          if (visible) requestDraw();
          else {
            cancelAnimationFrame(animationFrame);
            animationFrame = 0;
          }

        viewportObserver.observe(canvas);
      }
      requestDraw();
    }

    window.addEventListener("pagehide", () => {
      stopped = true;
      cancelAnimationFrame(animationFrame);
      viewportObserver?.disconnect();
      ribbonTarget?.destroy();
      device?.destroy();
    }, { once: true });
    window.addEventListener("message", event => {
      if (event.source !== window.parent || window.parent === window) return;
      const data = event.data;
      if (!data || data.channel !== "ui-vault/liquid-orb" || data.event !== "command") return;
      if (data.action === "setDisplayScale") { setDisplayScale(data.value); return; }
      if (!embedded) return;
      if (data.action === "setState" && Object.hasOwn(stateSeeds, data.value)) setState(data.value);
      else if (data.action === "setPlaying" && typeof data.value === "boolean") setPlaying(data.value);
      else if (data.action === "setGlass" && typeof data.value === "boolean") setGlass(data.value);
      else if (data.action === "setSpeed" && Number.isFinite(data.value)) setSpeed(data.value);
      else if (data.action === "setQuality" && typeof data.value === "string") chooseQualityMode(data.value);
    });
    document.querySelector("#orb-retry").addEventListener("click", () => location.reload());
    document.querySelectorAll("[data-state]").forEach(button =>
      button.addEventListener("click", () => setState(button.dataset.state)));
    document.querySelector("#motion-toggle").addEventListener("click", () => setPlaying(!playing));
    document.querySelector("#glass-toggle").addEventListener("click", () => setGlass(!glassEnabled));
    document.querySelector("#speed").addEventListener("input", event => setSpeed(event.target.value));
    qualitySelect.addEventListener("change", event => chooseQualityMode(event.target.value));
    updateQualityStatus();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      } else {
        gpuLatencySamples = gpuLatencyTotal = 0;
        qualityAdjustedAt = performance.now();
        requestDraw();
      }
    });
    window.addEventListener("resize", () => requestDraw());
    reducedMotion.addEventListener?.("change", event => { if (event.matches) setPlaying(false); });

    // Presentations share one canvas and one GPU device; moving the element
    // between inline preview and native modal does not create another renderer.
    const presentation = document.querySelector("#presentation");
    const viewport = document.querySelector("#demo-viewport");
    const modal = document.querySelector("#thinking-modal");
    const modalSlot = document.querySelector("#thinking-modal-slot");
    const modalClose = document.querySelector("#thinking-modal-close");
    const dialogText = document.querySelector("#dialog-text");
    const caption = document.querySelector("#dialog-caption");
    const isEmbedMode = new URLSearchParams(location.search).get("embed") === "1";
    function changeShowcase(mode, updateHash = true) {
      if (isEmbedMode || (mode !== "orb" && mode !== "dialog")) return;
      document.body.classList.toggle("dialog-mode", mode === "dialog");
      closeSizeMenu();
      for (const tab of document.querySelectorAll("[data-showcase]")) {
        const selected = tab.dataset.showcase === mode;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      }
      viewport.setAttribute("aria-labelledby", mode === "dialog" ? "tab-dialog" : "tab-orb");
      if (updateHash) {
        // Sandboxed iframe 文档可能拥有 opaque origin；避免 History API 访问失败影响 UI 操作。
        try { history.replaceState(null, "", mode === "dialog" ? "#dialog" : "#orb"); }
        catch { /* 保留当前选项卡状态，无需刷新或改写地址 */ }
      }
      requestDraw();
    }
    const sizeNames = { compact:"紧凑", standard:"标准", large:"大尺寸" };
    const sizePicker = document.querySelector("#size-picker");
    const sizeTrigger = document.querySelector("#dialog-size-trigger");
    const sizeMenu = document.querySelector("#dialog-size-menu");
    const nativeSize = document.querySelector("#dialog-size");
    const sizeBackdrop = document.querySelector("#size-backdrop");
    const sizeItems = [...sizeMenu.querySelectorAll("[role=option]")];
    function closeSizeMenu({restoreFocus=false}={}) {
      sizePicker.classList.remove("is-open");
      sizeMenu.hidden = true;
      sizeMenu.classList.remove("is-sheet");
      sizeBackdrop.hidden = true;
      // Return the listbox to its trigger after a mobile top-layer presentation.
      if (sizeMenu.parentElement !== sizePicker) sizePicker.appendChild(sizeMenu);
      sizeTrigger.setAttribute("aria-expanded", "false");
      if (restoreFocus) sizeTrigger.focus({preventScroll:true});
    }
    function openSizeMenu(focus="selected") {

      sizePicker.classList.add("is-open");
      if (isMobile) {

      sizeItems[index]?.focus({preventScroll:true});
    }
    function setDialogSize(value) {
      if (!Object.hasOwn(sizeNames,value)) return;

      document.body.dataset.dialogSize = value;

    }

    }

    }
    document.querySelectorAll("[data-showcase]").forEach(tab => {
      tab.addEventListener("click", () => changeShowcase(tab.dataset.showcase));
      tab.addEventListener("keydown", event => {

      });
    });
    nativeSize.addEventListener("change", event => setDialogSize(event.target.value));
    sizeTrigger.addEventListener("click", () => sizeMenu.hidden ? openSizeMenu() : closeSizeMenu({restoreFocus:true}));
    sizeTrigger.addEventListener("keydown", event => {

    }
    document.addEventListener("pointerdown", event => {
      if (!sizePicker.contains(event.target) && !sizeMenu.contains(event.target)) closeSizeMenu();
    });
    document.addEventListener("focusin", event => {
      if (!sizePicker.contains(event.target) && !sizeMenu.contains(event.target)) closeSizeMenu();
    });
    window.addEventListener("resize", () => { if (!sizeMenu.hidden) closeSizeMenu(); });
    dialogText.addEventListener("input", event => setDialogText(event.target.value));
    document.querySelector("#dialog-open").addEventListener("click", openThinkingDialog);
    document.querySelector("#dialog-retry").addEventListener("click", () => location.reload());
    modalClose.addEventListener("click", () => modal.close());
    modal.addEventListener("click", event => { if (event.target === modal) modal.close(); });
    modal.addEventListener("cancel", restorePresentation);
    modal.addEventListener("close", restorePresentation);
    if (!isEmbedMode) {
      document.body.dataset.dialogSize = "standard";
      changeShowcase(location.hash === "#dialog" ? "dialog" : "orb", false);
      window.addEventListener("hashchange", () => changeShowcase(location.hash === "#dialog" ? "dialog" : "orb", false));
    }

    updateControls();
    start().catch((error) => {
      stopWithError(error);
    });
  </script>
</body>
</html>
