:root{
  --accent:#f7cd5c;--gold:#dabb65;
  --stripe-size:.5rem;--stripe-fade:10rem;--overlap:.5rem;--radius:.379rem;
  --dur:.2s;--ease:ease;--stage-scale:.78;
  --halo-1:#e1e1e0 0 0 .25rem;--halo-2:#e1e1e0 0 0 .5rem;
  --halo-3:#e1e1e0 0 0 .75rem;--halo-4:#e1e1e0 0 0 1rem;
  --halo-idle:rgba(225,225,224,0) 0 0 .25rem,rgba(225,225,224,0) 0 0 .5rem,
    rgba(225,225,224,0) 0 0 .75rem,rgba(225,225,224,0) 0 0 1rem;
  font-family:"HarmonyOS_Sans_SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:16px 12px;
  background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(247,205,92,.08),transparent 70%),#242526;
  color:#ececec}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #fff100;outline-offset:4px}

.rail-viewport{width:100%;display:flex;justify-content:center}
.tab-rail{
  transform:scale(var(--stage-scale));transform-origin:center center;
  display:flex;flex-direction:column;gap:1.4375rem;width:29.25rem;flex:none;
}

/* ---------- 组件本体：映射原站 JRtBdW / KHykTF ---------- */
.tab-wrap{position:relative;padding-left:calc(100% - 19.5rem);width:29.25rem}
/* 斜纹装饰条：原站 .JRtBdW:before —— 右端钻入按钮 8px + 两端 mask 渐隐 */
.tab-wrap::before{
  content:"";position:absolute;top:0;right:19rem;width:20rem;height:100%;
  background-color:var(--accent);
  background-image:linear-gradient(-45deg,transparent 0,transparent 20.5805%,#fff 20.5805%,#fff 29.4195%,
    transparent 29.4195%,transparent 70.5805%,#fff 70.5805%,#fff 79.4195%,transparent 79.4195%,transparent 100%);
  background-repeat:repeat;background-size:var(--stripe-size) var(--stripe-size);
  -webkit-mask-image:linear-gradient(270deg,transparent 0,#fff var(--overlap),#fff calc(100% - var(--stripe-fade)),transparent 100%);
  mask-image:linear-gradient(270deg,transparent 0,#fff var(--overlap),#fff calc(100% - var(--stripe-fade)),transparent 100%);
  opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none;
}
.tab-wrap.is-active::before{opacity:.5}

/* 按钮：原站 .KHykTF */
.tab-btn{
  box-sizing:border-box;position:relative;overflow:visible;display:flex;flex-direction:column;
  width:16.25rem;height:5.125rem;padding:1.42176rem 0 0 1.99056rem;
  background:transparent;border:0;border-radius:var(--radius);outline:0;text-align:left;
  color:rgba(255,255,255,.92);
  transition:color var(--dur) var(--ease),filter var(--dur) var(--ease);
}
.tab-btn:focus-visible{outline:2px solid #fff100;outline-offset:4px}
/* 背景层：原站 .xh6xJE */
.tab-bg{position:absolute;inset:0;border-radius:var(--radius);
  background:rgba(55,55,57,.6);transition:background var(--dur) var(--ease)}
/* 插画层：原站 .ntFJ5x —— 历史原插画内嵌，渐变兜底，默认透明，激活淡入 */

/* 左侧竖条：原站 .KHykTF:after */
.tab-btn::after{content:"";position:absolute;left:.875rem;top:50%;transform:translateY(-50%);
  width:.3125rem;height:1rem;border-radius:.1875rem;background:#818081;
  transition:height var(--dur) var(--ease),background-color var(--dur) var(--ease);z-index:2}
/* 标题：原站 .FWCA9B */
.tab-title{position:relative;z-index:2;flex:none;line-height:1.159;
  font-size:1.56396rem;font-weight:400;letter-spacing:-.03132rem;
  text-shadow:var(--halo-idle);
  transition:text-shadow var(--dur) var(--ease)}
/* 副标题：原站 .KHykTF>small */
.tab-sub{position:relative;z-index:2;flex:none;margin-top:.15rem;
  font-size:.85308rem;letter-spacing:-.01704rem;line-height:1.172;
  color:rgba(255,255,255,.3);transition:color var(--dur) var(--ease),opacity var(--dur) var(--ease)}

/* ---------- 激活态：原站 P26xDN 挂在父容器上 ---------- */
.tab-wrap.is-active .tab-art{opacity:1}
.tab-wrap.is-active .tab-btn::after{height:3.25rem;background-color:var(--gold)}
.tab-wrap.is-active .tab-title{color:#151515;
  text-shadow:var(--halo-1),var(--halo-2),var(--halo-3),var(--halo-4)}
.tab-wrap.is-active .tab-sub{opacity:0}

/* ---------- hover 反白：原站未激活项 hover ---------- */
.tab-wrap:not(.is-active) .tab-btn:hover{color:#151515}
.tab-wrap:not(.is-active) .tab-btn:hover .tab-title{
  text-shadow:var(--halo-1),var(--halo-2),var(--halo-3),var(--halo-4)}
.tab-wrap:not(.is-active) .tab-btn:hover .tab-sub{color:rgba(21,21,21,.3)}
.tab-wrap:not(.is-active) .tab-btn:hover .tab-bg{background:#e1e1e0}
.tab-wrap:not(.is-active) .tab-btn:hover::after{background-color:var(--gold)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
}

<body>
<div class="rail-viewport">
  <div class="tab-rail" role="tablist" aria-label="版本内容导航" aria-orientation="vertical" id="rail"></div>
</div>

<script>
/* 7 个标签，内容取自原站版本导览；副标题沿用原站占位符 */
const TABS = [
  '内容总览','新干员','新武器','新活动','新区域','新剧情','体验优化'
];
const rail = document.getElementById('rail');

TABS.forEach((label, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'tab-wrap' + (i === 0 ? ' is-active' : '');
  wrap.setAttribute('role','presentation');

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab-btn';
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  btn.tabIndex = i === 0 ? 0 : -1;
  btn.dataset.index = String(i);
  btn.innerHTML =
    '<span class="tab-bg" aria-hidden="true"></span>' +
    '<span class="tab-art" aria-hidden="true"></span>' +
    '<span class="tab-title">' + label + '</span>' +
    '<small class="tab-sub" aria-hidden="true">-/////////-</small>';
  wrap.appendChild(btn);
  rail.appendChild(wrap);
});

const wraps = [...rail.querySelectorAll('.tab-wrap')];
const btns  = [...rail.querySelectorAll('.tab-btn')];

function activate(i, focus){
  wraps.forEach((w, idx) => w.classList.toggle('is-active', idx === i));
  btns.forEach((b, idx) => {
    b.setAttribute('aria-selected', idx === i ? 'true' : 'false');
    b.tabIndex = idx === i ? 0 : -1;
  });
  if (focus) btns[i].focus();
}

btns.forEach((b, i) => {
  b.addEventListener('click', () => activate(i, false));
});

/* 竖排 tablist 的键盘契约：上下 / Home / End */
rail.addEventListener('keydown', (e) => {
  const cur = btns.findIndex(b => b === document.activeElement);
  if (cur < 0) return;
  let next = cur;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = (cur + 1) % btns.length;
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = (cur - 1 + btns.length) % btns.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = btns.length - 1;
  else return;
  e.preventDefault();
  activate(next, true);
});

/* 按视口高度自适应缩放，一屏看全 7 个标签（无需控件） */
function fitStage(){
  const NATURAL_H = 7 * 5.125 * 16 + 6 * 1.4375 * 16; // 7 行 + 6 个间距，px
  const NATURAL_W = 29.25 * 16;
  const availH = window.innerHeight - 32;
  const availW = document.querySelector('.rail-viewport').clientWidth - 24;
  const s = Math.min(1, availH / NATURAL_H, availW / NATURAL_W);
  document.documentElement.style.setProperty('--stage-scale', s.toFixed(3));
}
fitStage();
window.addEventListener('resize', fitStage);
</script>
</body></html>
